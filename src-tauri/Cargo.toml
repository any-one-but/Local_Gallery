[package]
name = "local-gallery"
version = "1.7.32"
description = "Local Gallery"
authors = ["any-one-but"]
edition = "2021"
rust-version = "1.77"

# The library that `main.rs` calls into. Keeping the app logic in a lib makes it
# unit-testable (see the thumbnail tests) without launching the GUI.
[lib]
name = "local_gallery_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: lets the frontend render local files (thumbnails, media) via
# the asset: protocol (convertFileSrc) — matches assetProtocol in tauri.conf.json.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
# Read the clipboard natively when opening the Grok window. Doing this in Rust
# rather than via navigator.clipboard avoids the webview's paste permission
# prompt, which macOS would otherwise raise on every single toggle.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Semaphore to cap concurrent thumbnail generation (already in the dep tree via
# tauri). Without a cap, opening a big folder spawns one ffmpeg/decode task per
# tile and melts the CPU.
tokio = { version = "1", features = ["sync"] }
# Pure-Rust image decode/resize for image thumbnails. Video/other formats fall
# back to macOS QuickLook (qlmanage) for now; this is where ffmpeg / AVFoundation
# bindings will slot in for production.
image = "0.25"

# macOS text checking. WebKit keeps its spelling/substitution state in the app's
# own NSUserDefaults and reads it before the first webview exists, so turning the
# red underline and autocorrect on has to happen from native code — see
# src/text_checking.rs. Already in the tree via tauri; named here so the version
# is not incidental.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSUserDefaults",
  "NSString",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
