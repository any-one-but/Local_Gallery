<!doctype html>
<!-- spellcheck is off for the document and opted back in per field, rather than
     the other way round. macOS text checking is on at the host level now (see
     src-tauri/src/text_checking.rs), and the attribute inherits, so the default
     decides what every field added later does. Almost every input in this app
     holds a *name* — a file, a folder, a tag, a search — where a red underline
     is noise and autocorrect silently rewriting "IMG_2032b" or a tag would be
     damage. Prose is the exception, so prose asks: the daily journal editor
     carries spellcheck="true", as does Variations' block editor. -->
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Local Gallery</title>
    <script src="js/theme-boot.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
    <!-- Styles, in cascade order. -->
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/themes.css" />
    <link rel="stylesheet" href="styles/boot-and-lock.css" />
    <link rel="stylesheet" href="styles/base-layout.css" />
    <link rel="stylesheet" href="styles/title-pane.css" />
    <link rel="stylesheet" href="styles/directories-pane.css" />
    <link rel="stylesheet" href="styles/menus.css" />
    <link rel="stylesheet" href="styles/music-player.css" />
    <link rel="stylesheet" href="styles/key-help.css" />
    <link rel="stylesheet" href="styles/menu-rows.css" />
    <link rel="stylesheet" href="styles/preview-and-control-pane.css" />
    <link rel="stylesheet" href="styles/prism.css" />
    <link rel="stylesheet" href="styles/preview-grid.css" />
    <link rel="stylesheet" href="styles/thumbnail-states.css" />
    <link rel="stylesheet" href="styles/media-viewport.css" />
    <link rel="stylesheet" href="styles/gallery.css" />
    <link rel="stylesheet" href="styles/debug.css" />
    <link rel="stylesheet" href="styles/media-transitions.css" />
    <link rel="stylesheet" href="styles/overlays.css" />
    <link rel="stylesheet" href="styles/shortcuts-help.css" />
    <link rel="stylesheet" href="styles/menu-sidebar.css" />
    <link rel="stylesheet" href="styles/menu-panels.css" />
    <link rel="stylesheet" href="styles/stats.css" />
    <link rel="stylesheet" href="styles/journal.css" />
    <link rel="stylesheet" href="styles/crop-editor.css" />
    <link rel="stylesheet" href="styles/title-strips.css" />
    <link rel="stylesheet" href="styles/surfaces.css" />
    <link rel="stylesheet" href="styles/plates-and-finish.css" />
    <link rel="stylesheet" href="styles/markdown.css" />
    <link rel="stylesheet" href="styles/calm-cream.css" />
    <link rel="stylesheet" href="styles/settings-window.css" />
    <link rel="stylesheet" href="styles/selection-states.css" />
    <link rel="stylesheet" href="styles/title-strip-geometry.css" />
    <link rel="stylesheet" href="styles/light-theme.css" />
    <link rel="stylesheet" href="styles/liquid-glass.css" />
    <link rel="stylesheet" href="styles/keyboard-only.css" />
    <link rel="stylesheet" href="styles/media-zoom.css" />
    <link rel="stylesheet" href="styles/card-captions.css" />
    <link rel="stylesheet" href="styles/variations.css" />
  </head>

  <body>
    <!-- Visible immediately while #app stays hidden and the script runs; JS
         dismisses it once the managed library is open (or boot finishes). -->
    <div id="bootSplash" role="status" aria-live="polite" aria-busy="true">
      <div class="bootSplashSpinner" aria-hidden="true"></div>
      <div class="bootSplashLabel">Loading</div>
    </div>
    <!-- App lock (Touch ID or the Mac's password). Present in the markup so it
         can cover the window from the first painted frame; JS opens it before
         the library is built. -->
    <div id="lockScreen" role="dialog" aria-modal="true" aria-label="Locked">
      <div id="lockCard">
        <div id="lockGlyph" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-fingerprint"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg></div>
        <div id="lockTitle">Local Gallery</div>
        <div id="lockSub">Locked</div>
        <input id="lockPassword" type="password" autocomplete="off" spellcheck="false" placeholder="Mac password" aria-label="Mac password" />
        <div id="lockMessage" role="alert"></div>
        <div id="lockHint"></div>
      </div>
    </div>
    <div id="app">
      <!-- =========================================================
         Title Pane
         ========================================================= -->
      <!-- The top bar hosts the path / search / info row. -->
      <div id="titlePane">
        <div id="titlePaneTop">
          <div id="titleMain">
            <h1 id="titleLabel">—</h1>
          </div>
          <!-- A Mac search field: the magnifier inside it, and the key that
               reaches it shown as a small key cap at the right end. -->
          <div id="directoriesSearchRow">
            <span class="searchFieldIcon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
            <input
              id="directoriesSearchInput"
              class="tagEditInput"
              type="text"
              placeholder="Search"
            />
            <kbd class="searchFieldKey" aria-hidden="true">/</kbd>
          </div>
          <div id="titleBtns">
            <div id="titleInfo">—</div>
          </div>
        </div>
      </div>
      <input
        id="openWritableInput"
        type="file"
        webkitdirectory
        multiple
        hidden
      />

      <div id="layout">
        <div id="shell">
          <!-- =========================================================
             Retired Directory Pane
             ========================================================= -->
          <div id="directoriesPane">
            <div id="directoriesHeader">
              <div id="directoriesHeaderTop">
                <div class="title">File</div>
              </div>
              <!-- Search bar moved above -->
              <div id="directoriesTagsRow"></div>
              <div id="directoriesActionRow">
                <div id="directoriesActionMenu" class="dropdownMenu"></div>
              </div>
              <div id="tagActionMenu" class="dropdownMenu"></div>
              <div id="directoriesBulkRow"></div>
            </div>
            <div id="directoriesList"></div>
          </div>

          <!-- =========================================================
             Preview Pane
             ========================================================= -->
          <div id="previewPane">
            <div id="previewContent">
              <div id="previewMainStack">
                <div id="previewBody"></div>

                <!-- =========================================================
                   Control Pane
                   ========================================================= -->
                <div id="controlPane">
                  <div id="controlPaneInner">
                    <div id="controlButtons" aria-label="Media controls">
                      <button
                        id="controlPrevItemBtn"
                        class="miniBtn controlBtn controlIconBtn controlTransportBtn"
                        type="button"
                        title="Previous item"
                        aria-label="Previous item"
                      >
                        <span class="controlIcon controlIconFlip" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-forward-icon lucide-skip-forward"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg></span>
                      </button>
                      <button
                        id="controlSkipBackBtn"
                        class="miniBtn controlBtn controlIconBtn controlSkipBtn"
                        type="button"
                        title="Skip back"
                        aria-label="Skip back"
                      >
                        <span class="controlIcon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rewind-icon lucide-rewind"><path d="M12 6a2 2 0 0 0-3.414-1.414l-6 6a2 2 0 0 0 0 2.828l6 6A2 2 0 0 0 12 18z"/><path d="M22 6a2 2 0 0 0-3.414-1.414l-6 6a2 2 0 0 0 0 2.828l6 6A2 2 0 0 0 22 18z"/></svg></span>
                      </button>
                      <button
                        id="controlPlayPauseBtn"
                        class="miniBtn controlBtn controlIconBtn controlPlayBtn"
                        type="button"
                        title="Play or pause"
                        aria-label="Play or pause"
                      >
                        <span class="controlIcon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play-icon lucide-play"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></span>
                      </button>
                      <button
                        id="controlSkipForwardBtn"
                        class="miniBtn controlBtn controlIconBtn controlSkipBtn"
                        type="button"
                        title="Skip forward"
                        aria-label="Skip forward"
                      >
                        <span class="controlIcon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-fast-forward-icon lucide-fast-forward"><path d="M12 6a2 2 0 0 1 3.414-1.414l6 6a2 2 0 0 1 0 2.828l-6 6A2 2 0 0 1 12 18z"/><path d="M2 6a2 2 0 0 1 3.414-1.414l6 6a2 2 0 0 1 0 2.828l-6 6A2 2 0 0 1 2 18z"/></svg></span>
                      </button>
                      <button
                        id="controlNextItemBtn"
                        class="miniBtn controlBtn controlIconBtn controlTransportBtn"
                        type="button"
                        title="Next item"
                        aria-label="Next item"
                      >
                        <span class="controlIcon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-skip-forward-icon lucide-skip-forward"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg></span>
                      </button>
                      <button
                        id="controlMuteBtn"
                        class="miniBtn controlBtn controlIconBtn"
                        type="button"
                        title="Video audio"
                        aria-label="Video audio"
                      >
                        <span class="controlIcon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume2-icon lucide-volume-2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
                      </button>
                    </div>
                    <input
                      id="controlProgressRange"
                      type="range"
                      min="0"
                      max="0"
                      step="0.01"
                      value="0"
                      aria-label="Video progress"
                    />
                    <div id="controlTimecode" aria-live="off">
                      00:00 / 00:00
                    </div>
                  </div>
                </div>
              </div>
              </div>
            </div>
            <div id="previewActionMenu" class="dropdownMenu"></div>
            <div id="appActionMenu" class="dropdownMenu appMenu"></div>
          </div>
        </div>
      </div>

      <!-- Divider (for resizing panes) -->
      <div id="divider" title="Drag to resize"></div>

      <!-- =========================================================
          Gallery Mode (Overlay)
          ========================================================= -->
      <div id="overlay">
        <div id="viewerInner">
          <button id="closeBtn" type="button" title="Close" aria-label="Close">
            <span class="controlIcon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
          </button>
          <div id="viewerViewport"></div>
          <div id="filename"></div>
        </div>
      </div>

      <!-- =========================================================
         Busy (Overlay)
         ========================================================= -->
      <div id="busyOverlay" role="status" aria-live="polite" aria-busy="false">
        <div class="busySpinner" aria-hidden="true"></div>
        <div id="busyLabel">Loading</div>
        <div id="busyDetail" hidden></div>
      </div>

      <!-- =========================================================
         Confirm / Alert Dialog (Overlay)
         ========================================================= -->
      <div
        id="confirmOverlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirmMessage"
        aria-hidden="true"
      >
        <div id="confirmCard">
          <div id="confirmMessage"></div>
          <div id="confirmButtons">
            <button id="confirmCancelBtn" type="button" class="miniBtn">
              Cancel
            </button>
            <button
              id="confirmOkBtn"
              type="button"
              class="miniBtn confirmPrimary"
            >
              OK
            </button>
          </div>
        </div>
      </div>

      <!-- =========================================================
         Keyboard Shortcuts Help (read-only overlay)
         ========================================================= -->
      <div id="keybindHelpOverlay" aria-hidden="true">
        <section
          id="keybindHelpCard"
          role="dialog"
          aria-modal="true"
          aria-labelledby="keybindHelpTitle"
        >
          <header id="keybindHelpHeader">
            <div>
              <h2 id="keybindHelpTitle">Keyboard shortcuts</h2>
              <p id="keybindHelpHint">Press / again or Escape to close.</p>
            </div>
            <button
              id="keybindHelpCloseBtn"
              type="button"
              aria-label="Close keyboard shortcuts"
              title="Close"
            >
              ×
            </button>
          </header>
          <div id="keybindHelpBody"></div>
        </section>
      </div>
    </div>

    <!-- =========================================================
       Palm Tree Filter
       ========================================================= -->
    <svg
      width="0"
      height="0"
      aria-hidden="true"
      style="position: absolute; left: -9999px; top: -9999px"
    >
      <filter id="crt-chroma">
        <feOffset in="SourceGraphic" dx="-1.2" dy="0" result="r" />
        <feOffset in="SourceGraphic" dx="1.2" dy="0" result="b" />
        <feBlend in="r" in2="b" mode="screen" />
        <feGaussianBlur in="r" stdDeviation="0.6" result="rBlur" />
        <feGaussianBlur in="b" stdDeviation="0.6" result="bBlur" />

        <feBlend in="rBlur" in2="bBlur" mode="screen" />
      </filter>
    </svg>

    <!-- =========================================================
     Kodak Film Filter
     ========================================================= -->
    <svg
      width="0"
      height="0"
      style="position: absolute; left: -9999px; top: -9999px"
    >
      <!-- Tone curve + slight warm grade + subtle halation -->
      <filter
        id="kodak-film"
        x="-10%"
        y="-10%"
        width="120%"
        height="120%"
        color-interpolation-filters="sRGB"
      >
        <!-- Lift blacks and add a gentle curve -->
        <feComponentTransfer in="SourceGraphic" result="tone">
          <feFuncR type="table" tableValues="0.03 0.10 0.26 0.50 0.78 0.95 1" />
          <feFuncG type="table" tableValues="0.03 0.10 0.26 0.50 0.78 0.95 1" />
          <feFuncB
            type="table"
            tableValues="0.04 0.11 0.27 0.50 0.76 0.93 0.98"
          />
        </feComponentTransfer>

        <!-- Warm highlights a touch -->
        <feColorMatrix
          in="tone"
          type="matrix"
          values="
      1.02 0    0    0  0.01
      0    1.01 0    0  0.005
      0    0    0.99 0 -0.005
      0    0    0    1  0"
          result="graded"
        />

        <!-- Halation-ish bloom (soft, warm screen) -->
        <feGaussianBlur in="graded" stdDeviation="1.2" result="blur" />
        <feColorMatrix
          in="blur"
          type="matrix"
          values="
      0.18 0    0    0  0
      0    0.14 0    0  0
      0    0    0.10 0  0
      0    0    0    1  0"
          result="bloom"
        />

        <feBlend in="graded" in2="bloom" mode="screen" />
      </filter>

      <!-- Grain generator (applied to the overlay pseudo-element) -->
      <filter
        id="kodak-grain"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%"
        color-interpolation-filters="sRGB"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.85"
          numOctaves="3"
          seed="7"
          result="n"
        />
        <!-- Pull noise toward mid-gray and keep it subtle -->
        <feComponentTransfer in="n">
          <feFuncR type="linear" slope="0.45" intercept="0.28" />
          <feFuncG type="linear" slope="0.45" intercept="0.28" />
          <feFuncB type="linear" slope="0.45" intercept="0.28" />
        </feComponentTransfer>
      </filter>
    </svg>

    <!-- =========================================================
     Polaroid Film Filter
     ========================================================= -->

    <svg
      width="0"
      height="0"
      style="position: absolute; left: -9999px; top: -9999px"
    >
      <!-- Polaroid tone: lifted blacks, muted saturation, slight green shift, softer contrast -->
      <filter
        id="polaroid-film"
        x="-10%"
        y="-10%"
        width="120%"
        height="120%"
        color-interpolation-filters="sRGB"
      >
        <!-- Lift blacks + compress highlights a bit -->
        <feComponentTransfer in="SourceGraphic" result="tone">
          <feFuncR
            type="table"
            tableValues="0.08 0.20 0.40 0.62 0.82 0.94 0.99"
          />
          <feFuncG type="table" tableValues="0.09 0.22 0.42 0.64 0.83 0.95 1" />
          <feFuncB
            type="table"
            tableValues="0.10 0.23 0.43 0.63 0.81 0.93 0.98"
          />
        </feComponentTransfer>

        <!-- Slight vintage/cast: warm + a hint of green/cyan in mids -->
        <feColorMatrix
          in="tone"
          type="matrix"
          values="
      0.99 0.02 0    0  0.02
      0.01 0.98 0.02 0  0.01
      0.00 0.02 0.97 0  0.00
      0    0    0    1  0"
          result="graded"
        />

        <!-- Soft bloom (a bit “washed”) -->
        <feGaussianBlur in="graded" stdDeviation="1.6" result="blur" />
        <feColorMatrix
          in="blur"
          type="matrix"
          values="
      0.22 0    0    0  0
      0    0.18 0    0  0
      0    0    0.16 0  0
      0    0    0    1  0"
          result="bloom"
        />

        <feBlend in="graded" in2="bloom" mode="screen" />
      </filter>

      <!-- Grain generator: chunkier than Kodak -->
      <filter
        id="polaroid-grain"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%"
        color-interpolation-filters="sRGB"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.65"
          numOctaves="2"
          seed="11"
          result="n"
        />
        <feComponentTransfer in="n">
          <feFuncR type="linear" slope="0.55" intercept="0.22" />
          <feFuncG type="linear" slope="0.55" intercept="0.22" />
          <feFuncB type="linear" slope="0.55" intercept="0.22" />
        </feComponentTransfer>
      </filter>
    </svg>

    <!-- Variations, the prompt composer: drawn over the whole window while it
         is open (Cmd+U by default). Its script is js/variations/ and its look
         styles/variations.css. -->
    <div id="variations" tabindex="-1" aria-hidden="true" aria-label="Variations">
      <header class="topbar">
        <span class="mark">Variations</span>
        <span class="topmeta" id="vxStackHint"></span>
        <span class="grow"></span>
        <nav class="menu" aria-label="Variations">
          <button class="menuitem" data-cmd="new-project" title="A new project">New</button>
          <button class="menuitem" data-cmd="import" title="Add projects from a Variations file">Import…</button>
          <button class="menuitem" data-cmd="export" title="Save every project to your Downloads folder">Export</button>
          <span class="menusep" aria-hidden="true"></span>
          <button class="menuitem" data-cmd="toggle-rail" title="Show or hide the Library">Rail</button>
          <button class="menuitem" data-cmd="toggle-output" title="Show or hide the assembled prompt">Prompt</button>
          <button class="menuitem" data-cmd="help" title="How Variations works, and its keys">?</button>
        </nav>
        <span class="searchbox" id="vxSearchBox">
          <!-- autocomplete=off so nothing restores an old query into a field
               Variations deliberately starts empty. -->
          <input class="searchfield" id="vxSearchInput" type="text" spellcheck="false"
                 autocomplete="off" placeholder="Press ⌘F to filter the stack" aria-label="Filter the stack">
          <span class="searchcount" id="vxSearchCount"></span>
          <button class="searchclear" id="vxSearchClear" title="Clear the filter" aria-label="Clear the filter">✕</button>
        </span>
        <span class="hostnote" id="vxHostNote" hidden></span>
        <span class="clock" id="vxClock"></span>
        <button class="menuitem closeitem" data-cmd="close-window" title="Close Variations (Esc)">Close</button>
      </header>

      <div class="shell">
        <!-- Left rail: projects, word banks, takes -->
        <section class="pane" id="vxRail">
          <header>
            <span class="title">Library</span>
            <span class="grow"></span>
            <button class="barbtn" data-cmd="toggle-rail" title="Hide the Library" aria-label="Hide the Library"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </header>
          <div class="body">
            <div class="rail-section">
              <div class="head">
                <span class="label-cap">Projects</span>
                <button class="btn tiny" data-cmd="new-project">+ New</button>
              </div>
              <div class="rowlist" id="vxProjectList"></div>
            </div>
            <div class="rail-section">
              <div class="head">
                <span class="label-cap">Word banks</span>
                <button class="btn tiny" data-cmd="new-bank" title="A named swap you can write into any block">+ New</button>
              </div>
              <div class="rowlist" id="vxBankList"></div>
            </div>
            <div class="rail-section">
              <div class="head">
                <span class="label-cap">Takes</span>
                <button class="btn tiny" data-cmd="save-take" title="Save the current combination">+ Snapshot</button>
              </div>
              <div class="rowlist" id="vxTakeList"></div>
            </div>
          </div>
        </section>

        <!-- Centre: the block stack, or the mixer -->
        <section class="pane" id="vxStack">
          <div class="body" id="vxStackBody"></div>
        </section>

        <!-- Right: the assembled prompt -->
        <section class="pane" id="vxOutput">
          <header>
            <span class="title">Assembled</span>
            <span class="grow"></span>
            <button class="barbtn" data-cmd="toggle-output" title="Hide the prompt" aria-label="Hide the prompt"><svg class="vx-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </header>
          <div class="body">
