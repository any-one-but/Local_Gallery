/* ============================================================
   Variations
   A prompt composer. Every version of every part stays on the
   table at once; you switch parts instead of committing to one.
   Single file: styles here, app logic at the bottom.
   ============================================================ */

:root {
  /* Paper & ink */
  --paper:      #EFE4CC;
  --paper-deep: #E3D5B8;
  --card:       #FBF5E6;
  --card-sunk:  #F5EDD9;
  --ink:        #2A2320;
  --ink-soft:   #6C5F52;
  --ink-faint:  #9C8D7C;
  --rule:       #C4B295;
  --rule-soft:  #DACAAC;

  /* One accent, used sparingly, plus two supporting stains */
  --accent:     #C6452A;
  --accent-ink: #FBF5E6;
  --teal:       #2E6F68;
  --mustard:    #D69A2B;

  --shadow: 3px 3px 0 var(--ink);
  --shadow-sm: 2px 2px 0 var(--ink);

  --font-ui:      "Helvetica Neue", Helvetica, "Lucida Grande", Arial, sans-serif;
  --font-display: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-mono:    Monaco, Menlo, "SF Mono", ui-monospace, "Courier New", monospace;

  --rail-w: 236px;
  --out-w:  400px;
  color-scheme: light;
}

/* Dusk: same paper, held under a lamp. */
body.dusk {
  --paper:      #211D1B;
  --paper-deep: #191614;
  --card:       #2B2523;
  --card-sunk:  #262120;
  --ink:        #EDE0C8;
  --ink-soft:   #B3A48C;
  --ink-faint:  #8A7A64;
  --rule:       #4A403A;
  --rule-soft:  #3A322D;
  --accent:     #E2724F;
  --accent-ink: #211D1B;
  --teal:       #6FB3A6;
  --mustard:    #E0AE50;
  --shadow: 3px 3px 0 #100E0D;
  --shadow-sm: 2px 2px 0 #100E0D;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  background: var(--paper-deep);
  color: var(--ink);
  font: 13px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--ink); color: var(--card); }

/* ---------- Classic chrome primitives ---------- */

/* The pinstripe title bar of an active window. */
.pinstripe {
  background-image: repeating-linear-gradient(
    to bottom, var(--rule) 0 1px, transparent 1px 3px);
}

.btn {
  border: 1.5px solid var(--ink);
  background: var(--card);
  color: var(--ink);
  padding: 3px 10px;
  border-radius: 2px;
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
  transition: transform .04s, box-shadow .04s;
}
.btn:hover { background: var(--card-sunk); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.tiny { padding: 1px 6px; font-size: 11px; box-shadow: none; border-width: 1px; }
.btn.tiny:active { transform: translate(1px, 1px); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-soft); }
.btn.ghost:hover { border-color: var(--rule); background: var(--card-sunk); color: var(--ink); }
.btn[disabled] { opacity: .38; pointer-events: none; }

/* Text fields that only reveal themselves when you touch them. */
.ghost-field {
  border: 1px solid transparent;
  background: transparent;
  border-radius: 2px;
  padding: 1px 4px;
  min-width: 2ch;
  outline: none;
}
.ghost-field:hover { border-color: var(--rule-soft); }
.ghost-field:focus { border-color: var(--ink); background: var(--card); }

.label-cap {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-faint); font-weight: 700;
}

/* ---------- Menu bar ---------- */

#menubar {
  height: 26px;
  display: flex; align-items: center; gap: 2px;
  padding: 0 8px;
  background: var(--card);
  border-bottom: 1.5px solid var(--ink);
  position: relative; z-index: 40;
}
#menubar .mark {
  font-family: var(--font-display);
  font-weight: 700; font-size: 15px; font-style: italic;
  letter-spacing: .01em;
  padding-right: 12px; margin-right: 4px;
  border-right: 1px solid var(--rule);
}
#menubar .mark b { color: var(--accent); font-style: normal; }
.menuitem {
  border: 0; background: transparent; padding: 3px 8px; border-radius: 2px;
  font-size: 12px; color: var(--ink);
}
.menuitem:hover { background: var(--ink); color: var(--card); }
#menubar .spacer { flex: 1; }
#menubar .clock { font-size: 11px; color: var(--ink-faint); padding-left: 8px; font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */

#shell {
  position: absolute; inset: 26px 0 0 0;
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--out-w);
  gap: 10px;
  padding: 10px;
  background: var(--paper-deep);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(0,0,0,.045) 1px, transparent 0);
  background-size: 4px 4px;
}
body.rail-closed #shell { grid-template-columns: 0 minmax(0,1fr) var(--out-w); }
body.rail-closed #rail { display: none; }
body.out-closed #shell { grid-template-columns: var(--rail-w) minmax(0,1fr) 0; }
body.out-closed #output { display: none; }
body.rail-closed.out-closed #shell { grid-template-columns: 0 minmax(0,1fr) 0; }

/* A pane is a little window: hard border, hard shadow, striped bar. */
.pane {
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background: var(--card);
  border: 1.5px solid var(--ink);
  border-radius: 3px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.pane > header {
  display: flex; align-items: center; gap: 6px;
  height: 22px; padding: 0 6px;
  border-bottom: 1.5px solid var(--ink);
  background-image: repeating-linear-gradient(
    to bottom, var(--rule) 0 1px, transparent 1px 3px);
  flex: none;
}
.pane > header .title {
  background: var(--card); padding: 0 8px;
  font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
}
.pane > header .grow { flex: 1; }
.pane > header .barbtn {
  width: 13px; height: 13px; flex: none;
  border: 1.5px solid var(--ink); background: var(--card);
  border-radius: 2px; padding: 0; line-height: 0;
}
.pane > header .barbtn:hover { background: var(--accent); }
.pane .body { flex: 1; min-height: 0; overflow: auto; }

/* ---------- Left rail ---------- */

#rail .body { padding: 0; }
.rail-section { border-bottom: 1px solid var(--rule-soft); }
.rail-section > .head {
  display: flex; align-items: center; gap: 4px;
  padding: 7px 8px 4px;
  position: sticky; top: 0; background: var(--card); z-index: 2;
}
.rail-section > .head .label-cap { flex: 1; }

.rowlist { padding: 0 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.row {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; border-radius: 2px;
  border: 1px solid transparent;
  cursor: pointer; min-width: 0;
}
.row:hover { background: var(--card-sunk); border-color: var(--rule-soft); }
.row .name {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-display); font-size: 14px;
}
.row .sub { font-size: 10px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.row.active { background: var(--ink); border-color: var(--ink); color: var(--card); }
.row.active .sub { color: var(--rule); }
.row.active .btn.ghost { color: var(--rule); }
.row.active .btn.ghost:hover { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.row .rowact { opacity: 0; flex: none; }
.row:hover .rowact, .row.active .rowact { opacity: 1; }

.take-row .name { font-family: var(--font-ui); font-size: 12px; }
.take-row .pip {
  width: 7px; height: 7px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--ink); background: transparent;
}
.take-row.current .pip { background: var(--mustard); }
.row.active .pip { border-color: var(--card); }

.emptynote { padding: 6px 10px 12px; color: var(--ink-faint); font-size: 11px; font-style: italic; }

/* --- Word bank rows --- */
.bank-row { gap: 5px; }
.bankname {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
  color: var(--teal); flex: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%;
}
.bankword {
  flex: 1; min-width: 0; font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bankword::before { content: "→ "; color: var(--ink-faint); }
/* A bank nothing mentions is nearly always a typo in the block text. */
.bank-unused .bankname { color: var(--ink-faint); text-decoration: line-through; }
.row.bankedit { cursor: default; }
.row.bankedit .pipbtn {
  width: 11px; height: 11px; flex: none; padding: 0; border-radius: 50%;
  border: 1.5px solid var(--ink); background: transparent; cursor: pointer;
}
.row.bankedit .pipbtn.on { background: var(--mustard); }
.bankwordinput {
  flex: 1; min-width: 0;
  border: 1px solid var(--rule-soft); border-radius: 2px;
  background: var(--card); padding: 3px 6px; outline: none;
  /* Explicit, not inherited: the selected word's row carries .row.active, which
     inverts to color: var(--card), and `input { color: inherit }` would hand
     that pale colour to a field that keeps its own pale background. */
  color: var(--ink);
}
.bankwordinput::placeholder { color: var(--ink-faint); }
.bankwordinput:focus { border-color: var(--ink); }
/* A run of the prompt that came out of a bank rather than out of the editor. */
.segbank {
  border-bottom: 1px dotted var(--teal);
  background: color-mix(in srgb, var(--teal) 12%, transparent);
  border-radius: 2px;
}

/* ---------- Center: the stack ---------- */

/* The extra left padding is the gutter the group bookmark hangs in. */
/* Positioned, so the drag insertion line can be placed in content space and
   travel with the stack when it scrolls. */
#stack .body { padding: 12px 14px 90px 24px; position: relative; }

.stack-toolbar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 10px; margin-bottom: 12px;
  background: var(--card-sunk);
  border: 1px solid var(--rule-soft); border-radius: 3px;
}
.stack-toolbar .projname {
  font-family: var(--font-display); font-size: 20px; font-weight: 700;
  letter-spacing: -.01em; padding: 0 4px; flex: 1; min-width: 120px;
}
.segbtn { display: flex; border: 1.5px solid var(--ink); border-radius: 2px; overflow: hidden; box-shadow: var(--shadow-sm); }
.segbtn button { border: 0; background: var(--card); padding: 3px 11px; font-size: 12px; }
.segbtn button + button { border-left: 1.5px solid var(--ink); }
.segbtn button.on { background: var(--ink); color: var(--card); }

.togline { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-soft); }
.togline input { accent-color: var(--accent); }

/* --- Block card --- */
.block {
  border: 1.5px solid var(--ink);
  border-radius: 3px;
  background: var(--card);
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  position: relative;
}
.block.focused { box-shadow: var(--shadow); }
.block.focused::before {
  content: ""; position: absolute; left: -7px; top: 8px; bottom: 8px; width: 3px;
  background: var(--accent); border-radius: 2px;
}
.block.off { opacity: .5; }
.block.off .editor { text-decoration: line-through; text-decoration-color: var(--rule); }
.block.lit { outline: 2px solid var(--mustard); outline-offset: 1px; }

.block > .head {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 7px;
  border-bottom: 1px solid var(--rule-soft);
  background: var(--card-sunk);
}
.blocknum {
  font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
  width: 15px; text-align: right; flex: none;
}
.blocklabel {
  font-family: var(--font-display); font-size: 15px; font-weight: 700; flex: 1; min-width: 40px;
}
.blockmeta { font-size: 10px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.switch {
  width: 26px; height: 14px; flex: none; padding: 0;
  border: 1.5px solid var(--ink); border-radius: 8px;
  background: var(--card); position: relative;
}
.switch::after {
  content: ""; position: absolute; top: 1px; left: 1px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--ink-faint); transition: left .1s, background .1s;
}
.switch[aria-pressed="true"] { background: var(--teal); }
.switch[aria-pressed="true"]::after { left: 13px; background: var(--card); }

/* --- Variant chips --- */
.chips {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  padding: 7px 8px 6px;
  border-bottom: 1px dashed var(--rule-soft);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1.5px solid var(--ink);
  background: var(--card);
  padding: 2px 8px; border-radius: 10px;
  font-size: 11px; max-width: 220px;
}
.chip .k { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { background: var(--card-sunk); }
.chip.on { background: var(--ink); color: var(--card); }
.chip.on .k { color: var(--rule); }
.chip.cmp { border-style: dashed; border-color: var(--mustard); box-shadow: inset 0 0 0 1px var(--mustard); }
.chipname {
  border: 0; background: transparent; color: inherit;
  font: inherit; padding: 0; outline: none; min-width: 2ch;
  border-bottom: 1px dotted transparent;
}
.chipname:focus { border-bottom-color: currentColor; }
.chip.add { border-style: dashed; color: var(--ink-soft); padding: 2px 9px; }

/* --- Version chips: a variant's own variants ---
   Kept visible rather than folded into a dropdown. The premise of the app is
   that every version of every part stays on the table, and only the *open*
   variant's versions are drawn, so the row stays short. Mustard, so they never
   read as variant chips (ink) or arrangement chips (teal). */
.vers {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  padding: 5px 8px;
  border-bottom: 1px dashed var(--rule-soft);
  background: color-mix(in srgb, var(--mustard) 5%, var(--card));
}
.vers .label-cap { flex: none; margin-right: 2px; }
.chip.ver { border-color: var(--mustard); font-size: 10.5px; padding: 1px 7px; }
.chip.ver.on { background: var(--mustard); color: var(--ink); }
.chip.ver .k { color: var(--mustard); }
.chip.ver.on .k { color: var(--ink); opacity: .55; }
/* The badge on a variant chip counting the versions folded inside it. */
.vcount {
  font-family: var(--font-mono); font-size: 9px;
  border: 1px solid currentColor; border-radius: 6px;
  padding: 0 3px; opacity: .75;
}

/* --- Editor ---
   The textarea sits over a backdrop that mirrors its text one line per div and
   paints nothing but a band behind the note lines. The real glyphs are still
   the textarea's own — the backdrop's text is transparent and only there to
   make the bands land on the right rows — so a metric mismatch could at worst
   misplace a highlight, never ghost the text. */
.edwrap {
  position: relative;
  background: var(--card);
}
.edwrap:focus-within { background: color-mix(in srgb, var(--mustard) 7%, var(--card)); }
.editor {
  display: block; width: 100%; position: relative; z-index: 1;
  border: 0; outline: 0; resize: none;
  background: transparent;
  padding: 10px 12px;
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
  white-space: pre-wrap; overflow-wrap: break-word;
  min-height: 70px; overflow: hidden;
}
.editor::placeholder { color: var(--ink-faint); font-style: italic; }
.edback {
  position: absolute; inset: 0; z-index: 0; overflow: hidden;
  /* The horizontal padding lives on the lines, not here, so a line's band can
     run the full width of the editor while its text still starts where the
     textarea's does. */
  padding: 10px 0;
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
  white-space: pre-wrap; overflow-wrap: break-word;
  color: transparent; pointer-events: none;
}
.edline { display: block; padding: 0 12px; }
/* A note: kept out of the prompt, so it is marked out of the prose too. */
.edline.note {
  background: color-mix(in srgb, var(--teal) 11%, transparent);
  box-shadow: inset 2px 0 0 var(--teal);
}

.block > .foot {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 4px 8px;
  border-top: 1px dashed var(--rule-soft);
  background: var(--card-sunk);
  font-size: 11px; color: var(--ink-soft);
}
.block > .foot .grow { flex: 1; }
.block > .foot select {
  border: 1px solid var(--rule); background: var(--card); border-radius: 2px;
  font-size: 11px; padding: 1px 3px; max-width: 140px;
}

/* --- A group: blocks wired together, switched together --- */
.group {
  border: 1.5px solid var(--ink);
  border-radius: 3px;
  background: var(--card-sunk);
  margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
  position: relative;
  /* Declared here rather than on :root so the dusk palette reaches it —
     var() in a custom property is substituted where it is declared, so a
     :root copy would keep the light accent forever. */
  --group-ribbon: var(--accent);
}

/* The bookmark. A straight ribbon runs the group's whole height, so where one
   begins and ends is readable at a glance, and the forked tail hangs past the
   bottom edge the way a bookmark hangs out of a book.

   It is built in two pieces for one reason: the tail must not stretch. The
   body is an ordinary bordered box that grows with the group; the tail is a
   fixed-size SVG whose outline is a real stroke, so the ink stays a constant
   band all the way around the fork. (Two offset polygons cannot do this — the
   ink mitres to a spike where the notch closes, and reads as biting into the
   accent. A stroke with a round join simply does not have that problem.)
   The two overlap by 1px so no seam can show between them, and the ribbon's
   right-hand ink band is laid exactly over the card's own left border. */
.gribbon {
  position: absolute; pointer-events: none;
  left: -11.5px; width: 13px; top: -1.5px; bottom: 0;
  background: var(--group-ribbon);
  border: 1.5px solid var(--ink); border-bottom: 0;
  box-sizing: border-box;
}
.gtail { position: absolute; pointer-events: none; left: -11.5px; width: 13px; height: 15px; bottom: -14px; }
.gtail svg { display: block; width: 13px; height: 15px; }
.gtail path {
  fill: var(--group-ribbon); stroke: var(--ink);
  stroke-width: 1.5; stroke-linejoin: round;
}
.group.off { opacity: .52; }
.group.off .editor { text-decoration: line-through; text-decoration-color: var(--rule); }
.group > .ghead {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 7px;
  border-bottom: 1px solid var(--rule-soft);
  background-image: repeating-linear-gradient(to bottom, var(--rule-soft) 0 1px, transparent 1px 4px);
}
.gtag {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--teal); flex: none;
  border: 1px solid var(--teal); border-radius: 2px; padding: 0 3px; line-height: 1.5;
}
.grouplabel {
  font-family: var(--font-display); font-size: 15px; font-weight: 700; flex: 1; min-width: 40px;
}
.groupmeta { font-size: 10px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.switch.teal[aria-pressed="true"] { background: var(--teal); }

/* Arrangement chips — a group's own variants. Teal, so they never read as
   block variants, which are ink-black. */
.arrs {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  padding: 6px 8px;
  border-bottom: 1px dashed var(--rule-soft);
}
.arrs .label-cap { flex: none; margin-right: 2px; }
.chip.arr { border-color: var(--teal); background: var(--card); }
.chip.arr.on { background: var(--teal); color: var(--card); }
.chip.arr.on .k { color: var(--card); opacity: .72; }
.chip.arr .k { color: var(--teal); }

/* Members keep a modest indent for nesting; the ribbon outside does the work
   the old dashed spine in here used to. */
.group > .gbody { position: relative; padding: 10px 10px 1px 14px; }
.group > .gbody .block { margin-bottom: 10px; }
.group.collapsed > .gbody { display: none; }
.group > .gfoot {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 4px 8px; border-top: 1px dashed var(--rule-soft);
  font-size: 11px; color: var(--ink-soft);
}
.group > .gfoot .grow { flex: 1; }

/* A member the arrangement has switched off still shows, struck out. */
.block.mutedbygroup { opacity: .62; }

/* --- Word diff --- */
.diffbox {
  padding: 9px 12px; border-top: 1px solid var(--rule-soft);
  background: var(--card-sunk);
  font-family: var(--font-mono); font-size: 12px; line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
}
.diffbox ins { background: color-mix(in srgb, var(--teal) 28%, transparent); text-decoration: none; border-radius: 2px; }
.diffbox del { background: color-mix(in srgb, var(--accent) 24%, transparent); border-radius: 2px; }
.diffbox .legend { display: block; margin-bottom: 5px; font-family: var(--font-ui); font-size: 10px; color: var(--ink-faint); }

/* --- Mixer --- */
.mixer { border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; box-shadow: var(--shadow-sm); }
.mixrow {
  display: grid; grid-template-columns: 26px minmax(90px, 1.1fr) minmax(150px, 1.3fr) minmax(0, 2fr) auto;
  gap: 8px; align-items: center;
  padding: 5px 8px;
  border-bottom: 1px solid var(--rule-soft);
  background: var(--card);
}
.mixrow:last-child { border-bottom: 0; }
.mixrow:nth-child(even) { background: var(--card-sunk); }
.mixrow.focused { box-shadow: inset 3px 0 0 var(--accent); }
.mixrow.off { opacity: .45; }
.mixrow .mlabel { font-family: var(--font-display); font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mixpick { display: flex; align-items: center; gap: 3px; min-width: 0; }
.mixpick .now {
  flex: 1; min-width: 0; text-align: center;
  border: 1.5px solid var(--ink); background: var(--card); border-radius: 2px;
  padding: 2px 6px; font-size: 11px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mixpick .now:hover { background: var(--ink); color: var(--card); }
.mixpick .arw { border: 0; background: transparent; padding: 0 3px; color: var(--ink-soft); font-size: 12px; }
.mixpick .arw:hover { color: var(--accent); }
.mixrow .snip {
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mixrow .ct { font-size: 10px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.mixrow.ingroup { box-shadow: inset 3px 0 0 var(--teal); }
.mixrow.ingroup.focused { box-shadow: inset 3px 0 0 var(--accent); }
.mixgroup {
  display: grid; grid-template-columns: 26px minmax(90px, 1.1fr) minmax(150px, 1.3fr) minmax(0, 2fr) auto;
  gap: 8px; align-items: center;
  padding: 5px 8px;
  border-bottom: 1px solid var(--rule-soft);
  background: color-mix(in srgb, var(--teal) 13%, var(--card-sunk));
}
.mixgroup.off { opacity: .45; }
.mixgroup .mlabel {
  font-family: var(--font-display); font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 5px; min-width: 0;
}
.mixgroup .mlabel span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mixgroup .snip { font-size: 11px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mixgroup .ct { font-size: 10px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

.addblock {
  width: 100%; padding: 9px; margin-top: 4px;
  border: 1.5px dashed var(--rule); border-radius: 3px;
  background: transparent; color: var(--ink-soft); font-size: 12px;
}
.addblock:hover { border-color: var(--ink); color: var(--ink); background: var(--card-sunk); }

/* ---------- Right: assembled output ---------- */

#output .body { padding: 0; display: flex; flex-direction: column; }
.outbar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 7px 8px;
  border-bottom: 1px solid var(--rule-soft);
  background: var(--card-sunk);
}
.outbar .stat {
  font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.outbar .stat b { color: var(--ink); font-weight: 700; }
#outText {
  flex: 1; min-height: 0; overflow: auto;
  padding: 12px 13px 40px;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.62;
  white-space: pre-wrap; word-break: break-word;
}
/* A paragraph of the prompt: one loose block, or a whole group's members run
   together. `.segpart` is the block inside it, so hover still resolves to a
   single block even when several share the paragraph. */
.seg { display: block; border-left: 2px solid transparent; padding-left: 7px; margin-left: -9px; }
.seg.lit { border-left-color: var(--mustard); background: color-mix(in srgb, var(--mustard) 10%, transparent); }
.segpart { border-radius: 2px; }
.segpart:hover, .segpart.lit { background: color-mix(in srgb, var(--mustard) 22%, transparent); }
.seg .segh { color: var(--ink-faint); }
#outText .placeholder { color: var(--ink-faint); font-style: italic; font-family: var(--font-ui); }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(14px);
  background: var(--ink); color: var(--card);
  border-radius: 3px; padding: 7px 16px; font-size: 12px;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none;
  transition: opacity .16s, transform .16s; z-index: 100;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Modal (help / prompts) ---------- */
#scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(20,16,14,.4);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
#scrim.show { display: flex; }
.dialog {
  width: min(560px, 100%); max-height: 82vh; display: flex; flex-direction: column;
  background: var(--card); border: 1.5px solid var(--ink); border-radius: 3px;
  box-shadow: 6px 6px 0 rgba(20,16,14,.35);
}
.dialog > header {
  display: flex; align-items: center; height: 24px; padding: 0 7px;
  border-bottom: 1.5px solid var(--ink);
  background-image: repeating-linear-gradient(to bottom, var(--rule) 0 1px, transparent 1px 3px);
}
.dialog > header .title { background: var(--card); padding: 0 9px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.dialog .body { padding: 16px 18px; overflow: auto; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--rule-soft); background: var(--card-sunk); }
.dialog h3 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; }
.dialog p { margin: 0 0 12px; color: var(--ink-soft); }
.dialog input[type=text] {
  width: 100%; padding: 6px 8px; border: 1.5px solid var(--ink); border-radius: 2px;
  background: var(--card); outline: none;
}
.keytable { width: 100%; border-collapse: collapse; }
.keytable td { padding: 3px 0; vertical-align: top; }
.keytable td:first-child { width: 108px; white-space: nowrap; }
.keytable tr + tr td { border-top: 1px dotted var(--rule-soft); }
kbd {
  font-family: var(--font-mono); font-size: 10.5px;
  border: 1px solid var(--ink); border-bottom-width: 2px; border-radius: 3px;
  padding: 0 4px; background: var(--card-sunk);
}
.dialog h4 { font-family: var(--font-ui); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin: 16px 0 6px; }
.dialog h4:first-child { margin-top: 0; }

/* ---------- Search / filter ---------- */

/* In the pane header rather than the toolbar, because the toolbar scrolls away
   with the stack and this has to stay reachable. */
.searchbox {
  display: flex; align-items: center; gap: 4px; flex: none;
  background: var(--card); padding: 0 2px;
}
.searchfield {
  width: 148px; height: 16px;
  border: 1px solid var(--rule); border-radius: 2px;
  background: var(--card); color: var(--ink);
  padding: 0 5px; font-size: 11px; outline: none;
}
.searchfield::placeholder { color: var(--ink-faint); }
.searchfield:focus { border-color: var(--ink); }
.searchbox.on .searchfield { border-color: var(--accent); }
.searchcount {
  font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.searchclear {
  border: 0; background: transparent; color: var(--ink-faint);
  font-size: 11px; line-height: 1; padding: 1px 3px; border-radius: 2px;
}
.searchclear:hover { background: var(--accent); color: var(--accent-ink); }
.searchbox:not(.on) .searchclear, .searchbox:not(.on) .searchcount { display: none; }

.emptyfilter {
  padding: 22px 10px; text-align: center;
  color: var(--ink-faint); font-size: 12px; font-style: italic;
}
/* Matches exist inside, but the group is collapsed and search does not open it. */
.matchnote {
  font-size: 10px; color: var(--accent); white-space: nowrap;
  border: 1px solid var(--accent); border-radius: 2px; padding: 0 3px; line-height: 1.5;
}

/* ---------- Drag to reorder ---------- */

/* The block number doubles as the grip; a group is dragged by its header. */
.blocknum { cursor: grab; }
.blocknum:hover { color: var(--accent); }
.group > .ghead { cursor: grab; }
.group > .ghead input, .group > .ghead button { cursor: auto; }
.group > .ghead button { cursor: pointer; }
body.dragging { cursor: grabbing; }
body.dragging * { cursor: grabbing !important; user-select: none; }
.block.dragsrc, .group.dragsrc { opacity: .4; }
/* Absolutely positioned inside the scrolling stack body, so it travels with
   the content rather than sitting still while the list scrolls under it. */
.dropline {
  position: absolute; height: 0; z-index: 30; pointer-events: none;
  border-top: 2px solid var(--accent);
}
.dropline::before {
  content: ""; position: absolute; left: -3px; top: -4px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
}

/* ---------- Dependencies ---------- */

.depbadge {
  font-family: var(--font-mono); font-size: 9px; flex: none;
  border: 1px solid var(--accent); color: var(--accent); background: transparent;
  border-radius: 6px; padding: 0 4px; line-height: 1.5;
}
.depbadge:hover { background: var(--accent); color: var(--accent-ink); }
/* An item its conditions have switched off. It keeps its own on/off setting —
   nothing is rewritten — so this is a lock over the top, not a mute. The lock
   is on the item's own switch only: a member of a held-off group can still be
   switched, because that is the group's arrangement being edited, not the
   condition being overruled. */
.block.depoff, .group.depoff { opacity: .5; }
.block.depoff .editor, .group.depoff .editor { text-decoration: line-through; text-decoration-color: var(--rule); }
.block.depoff > .head .switch, .group.depoff > .ghead .switch { pointer-events: none; opacity: .6; }
.chip.depoff { opacity: .4; border-style: dotted; pointer-events: none; }
.mixrow.depoff, .mixgroup.depoff { opacity: .45; }
.mixrow.depoff .mlabel, .mixgroup.depoff .mlabel { color: var(--accent); }
.deplock {
  font-size: 10px; color: var(--accent); white-space: nowrap;
  border: 1px dashed var(--accent); border-radius: 2px; padding: 0 3px; line-height: 1.5;
}
.depcond {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 6px 8px; border: 1px solid var(--rule-soft); border-radius: 2px;
  background: var(--card-sunk); margin-bottom: 5px;
}
.depcond .txt { flex: 1; min-width: 0; font-size: 12px; }
.depcond .txt b { font-weight: 700; }
.depform { border: 1px solid var(--rule); border-radius: 2px; padding: 9px 10px; margin-top: 8px; background: var(--card-sunk); }
.depform label.line { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; font-size: 12px; }
.depform label.line > span:first-child { width: 74px; flex: none; color: var(--ink-faint); font-size: 11px; }
.depform select { flex: 1; min-width: 0; border: 1px solid var(--rule); background: var(--card); border-radius: 2px; padding: 2px 4px; }
.depstates {
  max-height: 190px; overflow: auto;
  border: 1px solid var(--rule-soft); border-radius: 2px; background: var(--card); padding: 5px 7px;
}
.depstates .sv { display: block; padding: 2px 0; font-size: 12px; }
.depstates .ss { display: block; padding: 1px 0 1px 18px; font-size: 11px; color: var(--ink-soft); }
.depstates input { accent-color: var(--accent); margin-right: 5px; }
.dephint { font-size: 11px; color: var(--ink-faint); margin: 0 0 8px; }
.depscope { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }

/* ---------- Narrow layouts ---------- */
@media (max-width: 1080px) {
  #shell, body.rail-closed #shell, body.out-closed #shell,
  body.rail-closed.out-closed #shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(120px, .8fr) minmax(0, 1.6fr) minmax(120px, 1fr);
    overflow: auto;
  }
  body.rail-closed #rail, body.out-closed #output { display: none; }
}
</style>
</head>
<body>

<div id="menubar">
  <span class="mark">Varia<b>t</b>ions</span>
  <button class="menuitem" data-cmd="new-project">New</button>
  <button class="menuitem" data-cmd="toggle-rail">Rail</button>
  <button class="menuitem" data-cmd="toggle-output">Prompt</button>
  <button class="menuitem" data-cmd="import">Import…</button>
  <button class="menuitem" data-cmd="export">Export</button>
  <span class="spacer"></span>
  <button class="menuitem" data-cmd="dusk">Dusk</button>
  <button class="menuitem" data-cmd="help">?</button>
  <span class="clock" id="clock"></span>
</div>

<div id="shell">

  <!-- Left rail: projects + saved takes -->
  <section class="pane" id="rail">
    <header>
      <button class="barbtn" data-cmd="toggle-rail" title="Close rail"></button>
      <span class="title">Library</span>
      <span class="grow"></span>
    </header>
    <div class="body">
      <div class="rail-section">
        <div class="head">
          <span class="label-cap">Projects</span>
          <button class="btn tiny" data-cmd="new-project">+ New</button>
        </div>
        <div class="rowlist" id="projectList"></div>
      </div>
      <div class="rail-section">
        <div class="head">
          <span class="label-cap">Word banks</span>
          <button class="btn tiny" data-cmd="new-bank" title="A named swap you can write into any block">+ New</button>
        </div>
        <div class="rowlist" id="bankList"></div>
      </div>
      <div class="rail-section">
        <div class="head">
          <span class="label-cap">Takes</span>
          <button class="btn tiny" data-cmd="save-take" title="Save the current combination">+ Snapshot</button>
        </div>
        <div class="rowlist" id="takeList"></div>
      </div>
    </div>
  </section>

  <!-- Center: the block stack / mixer -->
  <section class="pane" id="stack">
    <header>
      <span class="title">Composer</span>
      <span class="searchbox" id="searchBox">
        <!-- autocomplete=off so a reload does not restore the last query into a
             field the app has deliberately reset: the browser's restore fires an
             input event, and the stack would come back filtered. -->
        <input class="searchfield" id="searchInput" type="text" spellcheck="false"
               autocomplete="off" placeholder="Find…" aria-label="Filter the stack">
        <span class="searchcount" id="searchCount"></span>
        <button class="searchclear" id="searchClear" title="Clear the filter">✕</button>
      </span>
      <span class="grow"></span>
      <span class="label-cap" id="stackHint"></span>
    </header>
    <div class="body" id="stackBody"></div>
  </section>

  <!-- Right: assembled prompt -->
  <section class="pane" id="output">
    <header>
      <button class="barbtn" data-cmd="toggle-output" title="Close prompt"></button>
      <span class="title">Assembled</span>
      <span class="grow"></span>
    </header>
    <div class="body">
      <div class="outbar">
        <button class="btn primary" data-cmd="copy">Copy prompt</button>
        <span class="grow" style="flex:1"></span>
        <span class="stat" id="outStats"></span>
      </div>
      <div id="outText"></div>
    </div>
  </section>

</div>

<div id="toast"></div>

<div id="scrim">
  <div class="dialog" id="dialog" role="dialog" aria-modal="true">
    <header><span class="title" id="dlgTitle">Variations</span></header>
    <div class="body" id="dlgBody"></div>
    <div class="foot" id="dlgFoot"></div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script>
"use strict";

/* ============================================================
   1. State
   ------------------------------------------------------------
   A project is one prompt. A prompt is an ordered stack of
   blocks. A block holds many variants; exactly one is active.

   Adjacent blocks can be wired into a group. A group switches
   its members on and off as one, and holds its own variants —
   arrangements — where an arrangement records which members are
   on and which variant each of them is showing. So the nesting
   is: block variants inside arrangements inside the stack.

   A variant is itself a slot rather than a leaf: it holds
   **versions**, and the text lives on the version. That is what
   lets one idea ("concise") keep three degrees of itself
   without spending three variant slots on the same concept.
   So the ladder is version inside variant inside arrangement
   inside the stack.

   A **word bank** is the one project-wide knob. It is named in
   SCREAMING_SNAKE, holds any number of words with one selected,
   and every occurrence of its name in block text is replaced by
   that word when the prompt is assembled.

   A take is a saved snapshot of the whole rig: every block's
   variant, version *and* on/off state, every group's arrangement
   and on/off state, and every bank's selected word. Anything a
   take never saw is off when it is applied — a snapshot cannot
   vouch for a block that did not exist when it was taken.
   ============================================================ */

const STORE_KEY = "variations.state.v1";
const UI_KEY    = "variations.ui.v1";

let state = null;   // { projects: [...], activeProjectId }
let ui = {
  view: "edit",       // "edit" | "mixer"
  railOpen: true,
  outputOpen: true,
  dusk: false,
  focusBlockId: null, // keyboard cursor
  /* Purely a view filter over the stack. It is deliberately blanked on load —
     ui is persisted wholesale, and opening the app into a filtered stack with
     most of the project missing would read as data loss. */
  searchQuery: "",
};

const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const now = () => Date.now();

/* A version is where the text actually lives. A variant is a named slot that
   holds one or more of them, so "concise" can have three degrees of concise
   without spending three variant slots on one idea. A variant with a single
   version behaves exactly like a variant used to. */
function makeVersion(name, text) {
  return { id: uid("s"), name: name || "1", text: text || "", conditions: [], createdAt: now(), updatedAt: now() };
}
function makeVariant(name, text) {
  const s = makeVersion("1", text || "");
  return { id: uid("v"), name: name || "v1", versions: [s], activeVersionId: s.id, conditions: [], createdAt: now(), updatedAt: now() };
}

/* A word bank is a project-wide swap. Its name is written into block text and
   replaced by the selected word when the prompt is assembled. The naming rule
   is the whole safety mechanism: SCREAMING_SNAKE never turns up by accident in
   ordinary prose, so no escaping syntax is needed. */
function bankNameFrom(raw) {
  return String(raw || "")
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .slice(0, 48);
}
function makeWord(text) {
  return { id: uid("w"), text: text || "" };
}
function makeBank(name, words) {
  const ws = (words && words.length) ? words : [makeWord("")];
  return { id: uid("k"), name: bankNameFrom(name) || "BANK", words: ws, activeWordId: ws[0].id, createdAt: now() };
}
function makeBlock(label, variants) {
  const vs = (variants && variants.length) ? variants : [makeVariant("v1", "")];
  return {
    id: uid("b"), label: label || "Untitled", enabled: true,
    variants: vs, activeVariantId: vs[0].id, compareId: null,
    groupId: null, conditions: [],
  };
}

/* An arrangement is a group's variant: which members are on, and which
   variant *and version* each of them shows. `picks` and `off` only ever mention
   members the arrangement knows about — a member added later is simply absent,
   and absent means off, the same rule takes use.

   picks is keyed by block id and holds { v, ver }. A version of null means the
   arrangement predates versions and has no opinion, so the variant keeps
   whichever version it is already on. */
function makeArrangement(name) {
  return { id: uid("a"), name: name || "a1", picks: {}, off: [], createdAt: now(), updatedAt: now() };
}
function makeGroup(label) {
  const a = makeArrangement("a1");
  return { id: uid("g"), label: label || "Group", enabled: true, collapsed: false, variants: [a], activeVariantId: a.id, conditions: [] };
}
function makeProject(name, blocks, groups) {
  return {
    id: uid("p"), name: name || "Untitled prompt",
    createdAt: now(), updatedAt: now(),
    includeLabels: false,
    blocks: blocks || [makeBlock("Section", null)],
    groups: groups || [],
    banks: [],
    takes: [],
  };
}

/* A seed project, so the app opens with something to touch — including one
   group, so the idea is visible rather than only documented. */
function seedState() {
  const role = makeBlock("Role", [
    makeVariant("plain", "You are a research assistant."),
    makeVariant("expert", "You are a senior research analyst with fifteen years of experience synthesising primary sources."),
    makeVariant("terse", "Act as a research analyst."),
  ]);
  const task = makeBlock("Task", [
    makeVariant("broad", "Read the material below and write a brief that captures what matters."),
    makeVariant("specific", "Read the material below and write a brief covering: the central claim, the evidence behind it, and the strongest objection to it."),
  ]);
  const tone = makeBlock("Tone", [
    makeVariant("neutral", "Write plainly. No hedging, no filler, no summary of your own process."),
    makeVariant("warm", "Write plainly but warmly, as if explaining to a colleague you respect."),
    makeVariant("blunt", "Be blunt. If the evidence is thin, say so in the first sentence."),
  ]);
  const constraints = makeBlock("Constraints", [
    makeVariant("tight", "Stay under 300 words. Do not invent citations. If a fact is not in the material, leave it out."),
    makeVariant("loose", "Length is up to you. Do not invent citations."),
  ]);
  /* "tight" is one idea held at three strengths, which is what versions are
     for: the alternative was three variants all meaning the same thing. */
  const tightVariant = constraints.variants[0];
  tightVariant.versions[0].name = "300";
  tightVariant.versions.push(
    makeVersion("150", "Stay under 150 words. Do not invent citations. If a fact is not in the material, leave it out."),
    makeVersion("no cap", "Do not pad. Stop when the point is made. Do not invent citations."),
  );
  const out = makeBlock("Output", [
    makeVariant("prose", "Return the brief as continuous prose with no headings."),
    makeVariant("sections", "Return the brief with three headings: Claim, Evidence, Objection."),
    makeVariant("json", 'Return JSON: {"claim": string, "evidence": string[], "objection": string}'),
  ]);

  /* Tone and Constraints travel together: two ways of sounding, each one a
     pairing of the two blocks. */
  const voice = makeGroup("Voice");
  tone.groupId = voice.id;
  constraints.groupId = voice.id;
  const house = voice.variants[0];
  house.name = "house";
  house.picks = { [tone.id]: tone.variants[0].id, [constraints.id]: constraints.variants[0].id };
  const unsparing = makeArrangement("unsparing");
  unsparing.picks = { [tone.id]: tone.variants[2].id, [constraints.id]: constraints.variants[1].id };
  voice.variants.push(unsparing);

  const p = makeProject("Research brief", [role, task, tone, constraints, out], [voice]);

  /* One bank, wired into two blocks, so the swap is visible from the start. */
  const audience = makeBank("AUDIENCE", [makeWord("a colleague"), makeWord("a sceptical editor"), makeWord("a newcomer to the field")]);
  p.banks.push(audience);
  tone.variants[1].versions[0].text =
    "Write plainly but warmly, as if explaining to AUDIENCE you respect.";
  task.variants[1].versions[0].text =
    "Read the material below and write a brief for AUDIENCE covering: the central claim, the evidence behind it, and the strongest objection to it.";

  return { version: 1, projects: [p], activeProjectId: p.id };
}

/* ------------------------------------------------------------
   The host.

   This same file runs in two places. In a plain browser it is a
   standalone app: localStorage, with Import/Export as the way data
   moves. Inside Local Gallery it is the embedded Variations webview
   (src-tauri/src/variations.rs), and it stores its document in the
   library's own metadata folder instead — so there is nothing to
   import or export, and those buttons are removed rather than left
   to do something misleading.

   Rust injects `__lgVariationsEmbedded` before any page script runs.
   Both signals are required: the flag says which webview this is,
   the invoke handle says the IPC bridge is actually there.
   ------------------------------------------------------------ */

const DOC_NAME = "variations.json";

const HOST = {
  mode: "browser",  // "browser" | "app"
  invoke: null,
  file: "",
  note: "",         // shown when app mode was wanted but is unavailable
};

const isApp = () => HOST.mode === "app";

async function hostInit() {
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
  if (!window.__lgVariationsEmbedded || typeof invoke !== "function") return;
  try {
    const meta = String(await invoke("get_metadata_root") || "").replace(/\/+$/, "");
    if (!meta) throw new Error("empty metadata root");
    HOST.invoke = invoke;
    HOST.file = meta + "/" + DOC_NAME;
    HOST.mode = "app";
  } catch (e) {
    /* No library is open, so there is no metadata folder to write into.
       Degrade to the browser store rather than dropping edits on the floor,
       and say so — silently saving somewhere else would be worse. */
    HOST.note = "No library open — saving to this window's local store for now.";
  }
}

async function hostRead() {
  if (!isApp()) {
    const out = {};
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) out.state = JSON.parse(raw);
    } catch (e) { console.warn("Could not read saved state:", e); }
    try {
      const rawUi = localStorage.getItem(UI_KEY);
      if (rawUi) out.ui = JSON.parse(rawUi);
    } catch (e) { /* defaults are fine */ }
    return out;
  }
  try {
    const bytes = await HOST.invoke("read_file_bytes", { path: HOST.file });
    const doc = JSON.parse(new TextDecoder().decode(new Uint8Array(bytes)));
    return { state: doc && doc.state, ui: doc && doc.ui };
  } catch (e) {
    /* First run in this library: the file simply does not exist yet. */
    return {};
  }
}

function hostWrite() {
  if (!isApp()) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      localStorage.setItem(UI_KEY, JSON.stringify(ui));
    } catch (e) { toast("Could not save to this browser's storage"); }
    return Promise.resolve();
  }
  const json = JSON.stringify({ version: 1, savedAt: now(), state, ui }, null, 2);
  const bytes = Array.from(new TextEncoder().encode(json));
  // write_file_bytes is temp-file + rename, so a crash mid-write cannot
  // truncate the document that is already there.
  return HOST.invoke("write_file_bytes", { path: HOST.file, bytes })
    .catch((e) => { toast("Could not save: " + e); });
}

async function load() {
  await hostInit();
  const doc = await hostRead();
  try {
    if (doc.state && Array.isArray(doc.state.projects) && doc.state.projects.length) {
      state = normalize(doc.state);
    }
  } catch (e) { console.warn("Saved document was unreadable:", e); }
  if (!state) state = seedState();
  if (doc.ui) Object.assign(ui, doc.ui);
  /* A filter is a thing you are doing, not a thing you have set. */
  ui.searchQuery = "";
}

/* Defensive: a hand-edited or older export should never wedge the app.
   This is also where documents written before groups existed are brought
   forward — they have no `groups`, and their takes carry the old
   picks/disabled pair instead of a per-block record. */
function normalize(s) {
  s.projects = s.projects.filter(Boolean).map((p) => {
    p.id = p.id || uid("p");
    p.name = typeof p.name === "string" ? p.name : "Untitled prompt";
    p.includeLabels = !!p.includeLabels;
    p.takes = Array.isArray(p.takes) ? p.takes : [];
    p.blocks = (Array.isArray(p.blocks) ? p.blocks : []).filter(Boolean).map((b) => {
      b.id = b.id || uid("b");
      b.label = typeof b.label === "string" ? b.label : "Untitled";
      b.enabled = b.enabled !== false;
      b.groupId = typeof b.groupId === "string" ? b.groupId : null;
      b.conditions = normalizeConditions(b.conditions);
      b.variants = (Array.isArray(b.variants) ? b.variants : []).filter(Boolean).map((v) => {
        /* Before versions existed the text sat on the variant. Lift it into a
           single version, which is exactly what a one-version variant means. */
        let versions = Array.isArray(v.versions) ? v.versions.filter(Boolean) : null;
        if (!versions || !versions.length) {
          versions = [makeVersion("1", typeof v.text === "string" ? v.text : "")];
        } else {
          versions = versions.map((s) => ({
            id: s.id || uid("s"),
            name: typeof s.name === "string" ? s.name : "1",
            text: typeof s.text === "string" ? s.text : "",
            conditions: normalizeConditions(s.conditions),
            createdAt: s.createdAt || now(), updatedAt: s.updatedAt || now(),
          }));
        }
        const out = {
          id: v.id || uid("v"),
          name: typeof v.name === "string" ? v.name : "v",
          versions,
          activeVersionId: v.activeVersionId,
          conditions: normalizeConditions(v.conditions),
          createdAt: v.createdAt || now(), updatedAt: v.updatedAt || now(),
        };
        if (!versions.some((s) => s.id === out.activeVersionId)) out.activeVersionId = versions[0].id;
        return out;
      });
      if (!b.variants.length) b.variants = [makeVariant("v1", "")];
      if (!b.variants.some((v) => v.id === b.activeVariantId)) b.activeVariantId = b.variants[0].id;
      if (b.compareId && !b.variants.some((v) => v.id === b.compareId)) b.compareId = null;
      return b;
    });
    if (!p.blocks.length) p.blocks = [makeBlock("Section", null)];

    /* Groups. A group with no members left is not a group. */
    p.groups = (Array.isArray(p.groups) ? p.groups : []).filter(Boolean).map((g) => {
      g.id = g.id || uid("g");
      g.label = typeof g.label === "string" ? g.label : "Group";
      g.enabled = g.enabled !== false;
      g.collapsed = !!g.collapsed;
      g.conditions = normalizeConditions(g.conditions);
      g.variants = (Array.isArray(g.variants) ? g.variants : []).filter(Boolean).map((a) => ({
        id: a.id || uid("a"),
        name: typeof a.name === "string" ? a.name : "a",
        picks: (a.picks && typeof a.picks === "object") ? a.picks : {},
        off: Array.isArray(a.off) ? a.off.filter((x) => typeof x === "string") : [],
        createdAt: a.createdAt || now(), updatedAt: a.updatedAt || now(),
      }));
      if (!g.variants.length) g.variants = [makeArrangement("a1")];
      if (!g.variants.some((a) => a.id === g.activeVariantId)) g.activeVariantId = g.variants[0].id;
      return g;
    });
    const groupIds = new Set(p.groups.map((g) => g.id));
    p.blocks.forEach((b) => { if (b.groupId && !groupIds.has(b.groupId)) b.groupId = null; });
    p.groups = p.groups.filter((g) => p.blocks.some((b) => b.groupId === g.id));
    const liveGroups = new Set(p.groups.map((g) => g.id));
    p.blocks.forEach((b) => { if (b.groupId && !liveGroups.has(b.groupId)) b.groupId = null; });

    /* An arrangement may only speak about blocks that are still its members.
       A pick used to be a bare variant id; it is now { v, ver }. An old pick
       has no opinion about the version, which is what ver: null means. */
    p.groups.forEach((g) => {
      const members = new Set(p.blocks.filter((b) => b.groupId === g.id).map((b) => b.id));
      g.variants.forEach((a) => {
        const picks = {};
        for (const bid in a.picks) {
          if (!members.has(bid)) continue;
          const b = p.blocks.find((x) => x.id === bid);
          if (!b) continue;
          const raw = a.picks[bid];
          const vid = typeof raw === "string" ? raw : (raw && raw.v);
          const variant = b.variants.find((v) => v.id === vid);
          if (!variant) continue;
          const verRaw = (raw && typeof raw === "object") ? raw.ver : null;
          picks[bid] = {
            v: variant.id,
            ver: variant.versions.some((s) => s.id === verRaw) ? verRaw : null,
          };
        }
        a.picks = picks;
        a.off = a.off.filter((bid) => members.has(bid));
      });
    });
    normalizeGroupOrder(p);
    pruneConditionSources(p);

    /* Word banks. A bank with no words cannot substitute anything, but it is
       kept rather than dropped — an empty bank is a bank you have not filled
       in yet, and deleting the user's work to tidy up would be worse. */
    const seenBankNames = new Set();
    p.banks = (Array.isArray(p.banks) ? p.banks : []).filter(Boolean).map((k) => {
      k.id = k.id || uid("k");
      k.name = bankNameFrom(k.name) || "BANK";
      /* Names are the lookup key, so they have to be unique within a project. */
      let name = k.name, n = 2;
      while (seenBankNames.has(name)) name = k.name + "_" + n++;
      k.name = name;
      seenBankNames.add(name);
      k.words = (Array.isArray(k.words) ? k.words : []).filter(Boolean).map((w) => ({
        id: w.id || uid("w"),
        text: typeof w.text === "string" ? w.text : "",
      }));
      if (!k.words.length) k.words = [makeWord("")];
      if (!k.words.some((w) => w.id === k.activeWordId)) k.activeWordId = k.words[0].id;
      k.createdAt = k.createdAt || now();
      return k;
    });

    /* Takes: bring the old shape forward, then drop what no longer exists. */
    p.takes = p.takes.filter(Boolean).map((t) => {
      t.id = t.id || uid("t");
      t.name = typeof t.name === "string" ? t.name : "Take";
      t.createdAt = t.createdAt || now();
      if (!t.blocks || typeof t.blocks !== "object") {
        const picks = (t.picks && typeof t.picks === "object") ? t.picks : {};
        const disabled = Array.isArray(t.disabled) ? t.disabled : [];
        const blocks = {};
        /* The old format only listed blocks that existed when it was saved,
           so its key set is exactly what this take is entitled to speak for. */
        for (const bid in picks) blocks[bid] = { v: picks[bid], on: !disabled.includes(bid) };
        disabled.forEach((bid) => { if (!blocks[bid]) blocks[bid] = { v: null, on: false }; });
        t.blocks = blocks;
      }
      delete t.picks; delete t.disabled;
      if (!t.groups || typeof t.groups !== "object") t.groups = {};
      if (!t.banks || typeof t.banks !== "object") t.banks = {};
      const keptBlocks = {};
      p.blocks.forEach((b) => {
        const r = t.blocks[b.id];
        if (!r || typeof r !== "object") return;
        const variant = b.variants.find((v) => v.id === r.v) || null;
        keptBlocks[b.id] = {
          v: variant ? variant.id : null,
          /* A take saved before versions has no opinion about which one. */
          ver: variant && variant.versions.some((s) => s.id === r.ver) ? r.ver : null,
          on: !!r.on,
        };
      });
      t.blocks = keptBlocks;
      const keptGroups = {};
      p.groups.forEach((g) => {
        const r = t.groups[g.id];
        if (!r || typeof r !== "object") return;
        keptGroups[g.id] = { v: g.variants.some((a) => a.id === r.v) ? r.v : null, on: !!r.on };
      });
      t.groups = keptGroups;
      const keptBanks = {};
      p.banks.forEach((k) => {
        const wid = t.banks[k.id];
        if (typeof wid !== "string") return;
        if (k.words.some((w) => w.id === wid)) keptBanks[k.id] = wid;
      });
      t.banks = keptBanks;
      return t;
    });
    return p;
  });
  if (!s.projects.some((p) => p.id === s.activeProjectId)) s.activeProjectId = s.projects[0].id;
  return s;
}

/* A group is drawn as one container, so its members have to be contiguous.
   Each group is pulled together at the position of its first member; every
   grouping mutation ends by calling this. */
function normalizeGroupOrder(p) {
  const out = [];
  const done = new Set();
  for (const b of p.blocks) {
    if (!b.groupId) { out.push(b); continue; }
    if (done.has(b.groupId)) continue;
    done.add(b.groupId);
    for (const m of p.blocks) if (m.groupId === b.groupId) out.push(m);
  }
  p.blocks = out;
}

/* ---------- Conditions: the stored half of the dependency system ----------
   A condition is owned by the *dependent* item. The source knows nothing about
   what hangs off it, which is what keeps deleting a source cheap: nothing has
   to be unwired, and an orphaned condition simply passes. */

function makeCondition(sourceType, sourceId) {
  return {
    id: uid("c"),
    sourceType: sourceType === "group" ? "group" : "block",
    sourceId: sourceId || "",
    require: { variantIds: [], versionIds: [], arrangementIds: [], enabled: null },
  };
}

const idList = (x) => (Array.isArray(x) ? x.filter((s) => typeof s === "string") : []);

function normalizeConditions(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter((c) => c && typeof c === "object" && typeof c.sourceId === "string" && c.sourceId).map((c) => {
    const req = (c.require && typeof c.require === "object") ? c.require : {};
    return {
      id: typeof c.id === "string" && c.id ? c.id : uid("c"),
      sourceType: c.sourceType === "group" ? "group" : "block",
      sourceId: c.sourceId,
      require: {
        variantIds: idList(req.variantIds),
        versionIds: idList(req.versionIds),
        arrangementIds: idList(req.arrangementIds),
        enabled: typeof req.enabled === "boolean" ? req.enabled : null,
      },
      /* A condition used to carry an effect, and one of the two was to remove
         the item from the stack entirely. That is dropped rather than migrated:
         content you cannot see is content you cannot switch back on, and a
         section that vanishes takes the way to bring it back with it. */
    };
  });
}

/* Every item that can carry conditions, so the load-time prune and the id
   remap of a duplicate both have one list to walk. */
function conditionHosts(p) {
  const out = [];
  p.blocks.forEach((b) => {
    out.push(b);
    b.variants.forEach((v) => { out.push(v); v.versions.forEach((s) => out.push(s)); });
  });
  (p.groups || []).forEach((g) => out.push(g));
  return out;
}

/* Conditions carried into a copy. Every id in one is a reference, so each has
   to be looked up in the map for its own kind; an id with no entry is left as
   it is, which is right for a block duplicated inside its own project, where
   the sources have not moved. */
function remapConditions(list, maps) {
  if (!Array.isArray(list)) return [];
  return list.map((c) => ({
    id: uid("c"),
    sourceType: c.sourceType,
    sourceId: ((c.sourceType === "group" ? maps.g : maps.b)[c.sourceId]) || c.sourceId,
    require: {
      variantIds: (c.require.variantIds || []).map((id) => maps.v[id] || id),
      versionIds: (c.require.versionIds || []).map((id) => maps.s[id] || id),
      arrangementIds: (c.require.arrangementIds || []).map((id) => maps.a[id] || id),
      enabled: c.require.enabled,
    },
  }));
}

/* A condition whose source is gone is dropped outright, so a deleted
   controller cannot leave content hidden for good. Ids *inside* the condition
   are left alone on purpose: a condition naming a variant that has since been
   deleted is a condition that no longer passes, and saying so is more honest
   than quietly widening what it accepts. */
function pruneConditionSources(p) {
  const blocks = new Set(p.blocks.map((b) => b.id));
  const groups = new Set((p.groups || []).map((g) => g.id));
  conditionHosts(p).forEach((item) => {
    if (!item.conditions || !item.conditions.length) return;
    item.conditions = item.conditions.filter((c) =>
      c.sourceType === "group" ? groups.has(c.sourceId) : blocks.has(c.sourceId));
  });
}

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; hostWrite(); }, 180);
}

/* Write now rather than at the end of the debounce.
   Called when the window loses focus or is hidden — which, in the app, is
   exactly what the toggle key does, so the pending edit must not wait. */
function flushSave() {
  if (!saveTimer) return;
  clearTimeout(saveTimer);
  saveTimer = null;
  hostWrite();
}

window.addEventListener("blur", flushSave);
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });

const project = () => state.projects.find((p) => p.id === state.activeProjectId) || state.projects[0];
const blockById = (id) => project().blocks.find((b) => b.id === id) || null;
const activeVariant = (b) => b.variants.find((v) => v.id === b.activeVariantId) || b.variants[0];
const activeVersion = (v) => (v ? v.versions.find((s) => s.id === v.activeVersionId) || v.versions[0] : null);

/* The text a variant currently shows. Everything that reads block text goes
   through this rather than reaching for a `.text` that no longer exists. */
function variantText(v) {
  const s = activeVersion(v);
  return s ? s.text : "";
}
const blockText = (b) => variantText(activeVariant(b));

/* ---------- Word banks ---------- */

const banksOf = () => project().banks || [];
const activeWord = (k) => k.words.find((w) => w.id === k.activeWordId) || k.words[0];

/* Split text into plain runs and bank hits. One pass, longest name first, so
   TONE never eats the front of TONE_STRICT. The guards on either side are
   character classes rather than \b because an underscore is a word character:
   \bTONE\b would already refuse to match inside TONE_STRICT, but spelling the
   rule out keeps it true if the naming rule is ever loosened.

   A bank with no usable word is deliberately left unsubstituted, so an
   unfilled bank shows up in the prompt as its own name instead of silently
   deleting itself. */
function bankSegments(text) {
  const banks = banksOf();
  if (!banks.length || !text) return [{ text: text || "" }];
  const byName = new Map();
  banks.forEach((k) => byName.set(k.name, k));
  const names = banks.map((k) => k.name).filter(Boolean).sort((a, b) => b.length - a.length);
  if (!names.length) return [{ text }];
  const re = new RegExp(
    "(^|[^A-Z0-9_])(" + names.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(?![A-Z0-9_])",
    "g",
  );
  const out = [];
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    const bank = byName.get(m[2]);
    const word = bank ? activeWord(bank) : null;
    const hitAt = m.index + m[1].length;
    if (!word || !word.text.trim()) continue;   // unfilled: leave the name in place
    if (hitAt > last) out.push({ text: text.slice(last, hitAt) });
    out.push({ text: word.text, bankId: bank.id, bankName: bank.name });
    last = hitAt + m[2].length;
  }
  if (last < text.length) out.push({ text: text.slice(last) });
  return out.length ? out : [{ text }];
}

const substituteBanks = (text) => bankSegments(text).map((s) => s.text).join("");

/* ---------- Inline notes ----------

   A note is commentary that lives with the text and never reaches the prompt:
   "works better after scene 2", "only use with the psychic thoughts block".
   Putting that in the prompt itself is the alternative, and it pollutes the
   output; putting it in a separate field is the other alternative, and then it
   is nowhere near the sentence it is about.

   A line beginning with // is a note. A line that is *only* // opens a note
   that runs until the next line that is only //, so a paragraph of commentary
   does not need a marker per line. An unclosed multi-line note runs to the end
   of the version, which is what the marker literally says; the editor bands
   every note line, so a stray opener is visible rather than mysterious.

   This is a parse, not a store: the raw string with the notes in it is what is
   saved, edited, forked, exported and diffed. Only the readers that feed the
   prompt strip them, and they all come through here. */
function splitNotes(text) {
  const lines = String(text == null ? "" : text).split("\n");
  const prompt = [], notes = [], lineFlags = new Array(lines.length).fill(false);
  let open = false, buf = null;
  const closeBuf = () => { if (buf && buf.join("\n").trim()) notes.push(buf.join("\n")); buf = null; };
  lines.forEach((line, i) => {
    const solo = line.trim() === "//";
    if (open) {
      lineFlags[i] = true;
      if (solo) { closeBuf(); open = false; return; }
      buf.push(line);
      return;
    }
    if (solo) { lineFlags[i] = true; open = true; buf = []; return; }
    if (/^\s*\/\//.test(line)) {
      lineFlags[i] = true;
      const body = line.replace(/^\s*\/\/\s?/, "");
      if (body.trim()) notes.push(body);   // an empty note is not a note
      return;
    }
    prompt.push(line);
  });
  closeBuf();
  return { prompt: prompt.join("\n"), notes, lineFlags };
}

const stripNotes = (text) => splitNotes(text).prompt;
const hasNotes = (text) => /(^|\n)\s*\/\//.test(String(text || ""));

/* ---------- Groups ---------- */

const groupById = (id) => (id ? project().groups.find((g) => g.id === id) || null : null);
const groupOf = (b) => (b && b.groupId ? groupById(b.groupId) : null);
const membersOf = (g) => project().blocks.filter((b) => b.groupId === g.id);
const activeArrangement = (g) => g.variants.find((a) => a.id === g.activeVariantId) || g.variants[0];

/* ---------- Dependencies: the live half ----------

   A block, variant, version or group can declare that it only makes sense when
   something else is in a particular state. The declaration is evaluated on
   every render against the current picks, exactly like an arrangement, and it
   never writes anything back: an item a condition has switched off keeps its
   own on/off setting, its variant and its version, and gets them all back the
   moment the condition passes again.

   **A condition holds an item off; it never takes it out of the stack.** That
   is the one behaviour, and there is nothing to choose. The alternative — a
   dependent that disappears — loses whole sections behind a controller you
   then have to remember, and the way back is exactly the thing that is no
   longer on screen. Held off, it is struck through with its switch locked and
   the reason on it, and it is plainly out of the prompt.

   Three rules make it safe to leave lying around:
     · a condition whose source is missing passes, so deleting a controller
       cannot leave content stuck off;
     · a cycle is broken by treating the re-entered item as passing, rather
       than by refusing to evaluate either end;
     · the result is cached per render pass, so switching a controlling block
       that fifty items hang off is still one walk of the stack. */

const DEP = { cache: new Map(), busy: new Set(), warned: new Set() };

function invalidateDeps() { DEP.cache.clear(); }

/* True when one of the item's conditions is currently holding it off. */
function depOff(item) {
  if (!item || !item.conditions || !item.conditions.length) return false;
  if (DEP.cache.has(item.id)) return DEP.cache.get(item.id);
  if (DEP.busy.has(item.id)) {
    if (!DEP.warned.has(item.id)) {
      DEP.warned.add(item.id);
      console.warn("Variations: dependency cycle through", item.id, "— treating it as satisfied");
    }
    return false;
  }
  DEP.busy.add(item.id);
  let out = false;
  try {
    out = !item.conditions.every(conditionPasses);
  } finally { DEP.busy.delete(item.id); }
  DEP.cache.set(item.id, out);
  return out;
}

/* Within one condition the id lists are OR — any of these states will do —
   and the enabled constraint is a separate AND on top. Several conditions on
   one item are AND. */
function conditionPasses(c) {
  const p = project();
  if (c.sourceType === "group") {
    const g = p.groups.find((x) => x.id === c.sourceId);
    if (!g) return true;                                  // fail-open
    const want = c.require.arrangementIds;
    if (want.length && !want.includes(g.activeVariantId)) return false;
    if (typeof c.require.enabled === "boolean" && groupIncluded(g) !== c.require.enabled) return false;
    return true;
  }
  const b = p.blocks.find((x) => x.id === c.sourceId);
  if (!b) return true;
  const wantV = c.require.variantIds, wantS = c.require.versionIds;
  if (wantV.length || wantS.length) {
    /* Against what the source is actually showing, which is its effective
       variant — if its own active variant is switched off by a condition, the
       text on screen and in the prompt is the fallback, and that is the state
       a dependent should be reading. */
    const v = effectiveVariant(b);
    const s = v ? effectiveVersion(v) : null;
    const ok = (wantV.length && v && wantV.includes(v.id)) ||
               (wantS.length && s && wantS.includes(s.id));
    if (!ok) return false;
  }
  if (typeof c.require.enabled === "boolean" && blockIncluded(b) !== c.require.enabled) return false;
  return true;
}

/* The variant a block is really showing. Normally the active one; when a
   condition has switched that one off, the first one still available — chosen
   for the render and the prompt only, never written back to activeVariantId. */
function effectiveVariant(b) {
  const av = activeVariant(b);
  if (!av || !depOff(av)) return av;
  return b.variants.find((v) => !depOff(v)) || null;
}
function effectiveVersion(v) {
  if (!v) return null;
  const s = activeVersion(v);
  if (!s || !depOff(s)) return s;
  return v.versions.find((x) => !depOff(x)) || null;
}
function effectiveText(b) {
  const v = effectiveVariant(b);
  const s = effectiveVersion(v);
  return s ? s.text : "";
}

/* What actually reaches the prompt: a block must be on, its conditions must be
   satisfied, and the group holding it must pass both tests too. The switches
   are independent — muting a group does not forget which of its members were
   on, and a condition does not forget either. */
function groupIncluded(g) {
  return !!g && g.enabled && !depOff(g);
}
function blockIncluded(b) {
  if (!b.enabled || depOff(b)) return false;
  const g = groupOf(b);
  return !g || groupIncluded(g);
}

/* The stack, read as a sequence of units: a loose block, or a whole group and
   its run of members. Everything that reorders or renders the stack goes
   through this rather than walking p.blocks directly. */
function stackUnits(p) {
  const units = [];
  for (let i = 0; i < p.blocks.length; ) {
    const b = p.blocks[i];
    const g = b.groupId ? p.groups.find((x) => x.id === b.groupId) : null;
    if (!g) { units.push({ kind: "block", block: b }); i++; continue; }
    const blocks = [];
    while (i < p.blocks.length && p.blocks[i].groupId === g.id) blocks.push(p.blocks[i++]);
    units.push({ kind: "group", group: g, blocks });
  }
  return units;
}

/* Switching to an arrangement replays it onto the members. A member the
   arrangement has never heard of is off — the same rule takes use for blocks
   that postdate them, so "added since" behaves identically at both levels. */
function applyArrangement(g) {
  const a = activeArrangement(g);
  if (!a) return;
  membersOf(g).forEach((b) => {
    const want = a.picks[b.id];
    if (want && want.v) {
      const variant = b.variants.find((v) => v.id === want.v);
      if (variant) {
        b.activeVariantId = variant.id;
        /* ver null means the arrangement predates versions and has no opinion,
           so the variant keeps whichever version it is already showing. */
        if (want.ver && variant.versions.some((s) => s.id === want.ver)) {
          variant.activeVersionId = want.ver;
        }
      }
    }
    b.enabled = Object.prototype.hasOwnProperty.call(a.picks, b.id) && !a.off.includes(b.id);
  });
}

/* …and the reverse: whatever the members are doing now *is* what the active
   arrangement means. Block variants work this way — typing edits the active
   variant rather than drifting away from it — and arrangements match, so
   there is never a stale "modified" state to reconcile.

   Called from touch(), so no mutation can forget to do it. Writes only on a
   real change, so an ordinary keystroke does not churn timestamps. */
function syncActiveArrangements(p) {
  p.groups.forEach((g) => {
    const a = activeArrangement(g);
    if (!a) return;
    const picks = {};
    const off = [];
    membersOf(g).forEach((b) => {
      const variant = activeVariant(b);
      picks[b.id] = { v: b.activeVariantId, ver: variant ? variant.activeVersionId : null };
      if (!b.enabled) off.push(b.id);
    });
    const same = JSON.stringify(a.picks) === JSON.stringify(picks) &&
                 JSON.stringify(a.off) === JSON.stringify(off);
    if (same) return;
    a.picks = picks; a.off = off; a.updatedAt = now();
  });
}

function touch() {
  const p = project();
  /* Any mutation can change what a condition sees, and the cache is only good
     for as long as nothing has moved. */
  invalidateDeps();
  syncActiveArrangements(p);
  p.updatedAt = now();
  save();
}

/* ============================================================
   2. Assembling the prompt
   ============================================================ */

/* What separates two members of the same group. A group is one passage, so its
   blocks run together into a single paragraph instead of being held apart by a
   blank line the way loose blocks are. */
const GROUP_JOIN = " ";

/* A part carries both forms of its text: `raw` is what is written in the
   editor, `segs` is the same thing with the word banks resolved, split so the
   output pane can mark which runs came from a bank. `text` is the resolved
   string, and it is what assemble() and every count use — so the banks are
   applied in exactly one place and the pane cannot disagree with the clipboard. */
function blockPart(b) {
  /* Notes come out before the banks go in: a bank named inside a note must not
     be substituted, because the note is not going anywhere. */
  const raw = stripNotes(effectiveText(b)).trim();
  const segs = bankSegments(raw);
  return {
    blockId: b.id, label: b.label,
    raw, segs,
    text: segs.map((s) => s.text).join(""),
  };
}

/* The prompt as a list of paragraphs. A loose block is its own paragraph; a
   group is one paragraph made of all its included members. Both the assembled
   text and the output pane are built from this, so what you read and what you
   copy can never disagree. */
function promptUnits() {
  const p = project();
  const out = [];
  stackUnits(p).forEach((u) => {
    if (u.kind === "group") {
      if (!groupIncluded(u.group)) return;
      const parts = u.blocks.filter(blockIncluded).map(blockPart).filter((x) => x.text);
      if (!parts.length) return;
      /* With labels on, the group speaks for its members: one heading over the
         paragraph, rather than per-member headings that would split it again. */
      out.push({
        kind: "group", id: u.group.id, label: u.group.label,
        heading: p.includeLabels ? "## " + u.group.label : "", parts,
      });
      return;
    }
    const b = u.block;
    if (!blockIncluded(b)) return;
    const part = blockPart(b);
    const heading = p.includeLabels ? "## " + b.label : "";
    if (!part.text && !heading) return;
    out.push({ kind: "block", id: b.id, label: b.label, heading, parts: [part] });
  });
  return out;
}

function assemble() {
  return promptUnits()
    .map((u) => (u.heading ? u.heading + "\n" : "") + u.parts.map((x) => x.text).join(GROUP_JOIN))
    .join("\n\n");
}

const countWords = (t) => (t.trim() ? t.trim().split(/\s+/).length : 0);

/* ============================================================
   3. Word-level diff (LCS) — for comparing two phrasings
   ============================================================ */

const MAX_DIFF_TOKENS = 900;

function tokenize(s) { return s.match(/\s+|[^\s]+/g) || []; }

function diffTokens(aTokens, bTokens) {
  const n = aTokens.length, m = bTokens.length;
  // Trim the shared head and tail first; most edits are local.
  let head = 0;
  while (head < n && head < m && aTokens[head] === bTokens[head]) head++;
  let tail = 0;
  while (tail < n - head && tail < m - head &&
         aTokens[n - 1 - tail] === bTokens[m - 1 - tail]) tail++;

  const a = aTokens.slice(head, n - tail);
  const b = bTokens.slice(head, m - tail);
  const out = [];
  for (let i = 0; i < head; i++) out.push({ op: "=", t: aTokens[i] });

  if (a.length > MAX_DIFF_TOKENS || b.length > MAX_DIFF_TOKENS) {
    if (a.length) out.push({ op: "-", t: a.join("") });
    if (b.length) out.push({ op: "+", t: b.join("") });
  } else {
    const dp = [];
    for (let i = 0; i <= a.length; i++) dp.push(new Int32Array(b.length + 1));
    for (let i = a.length - 1; i >= 0; i--) {
      for (let j = b.length - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    let i = 0, j = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { out.push({ op: "=", t: a[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ op: "-", t: a[i] }); i++; }
      else { out.push({ op: "+", t: b[j] }); j++; }
    }
    while (i < a.length) { out.push({ op: "-", t: a[i] }); i++; }
    while (j < b.length) { out.push({ op: "+", t: b[j] }); j++; }
  }

  for (let k = m - tail; k < m; k++) out.push({ op: "=", t: bTokens[k] });
  return out;
}

function renderDiffHtml(oldText, newText) {
  const parts = diffTokens(tokenize(oldText), tokenize(newText));
  let html = "", run = null, buf = "";
  const flush = () => {
    if (!buf) return;
    const e = esc(buf);
    html += run === "+" ? "<ins>" + e + "</ins>" : run === "-" ? "<del>" + e + "</del>" : e;
    buf = "";
  };
  for (const part of parts) {
    if (part.op !== run) { flush(); run = part.op; }
    buf += part.t;
  }
  flush();
  return html;
}

/* ============================================================
   4. Small helpers
   ============================================================ */

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let toastTimer = null;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1700);
}

function el(tag, attrs, children) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    const val = attrs[k];
    if (val === null || val === undefined || val === false) continue;
    if (k === "class") n.className = val;
