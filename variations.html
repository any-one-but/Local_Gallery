    else if (k === "text") n.textContent = val;
    else if (k === "html") n.innerHTML = val;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), val);
    else n.setAttribute(k, val === true ? "" : val);
  }
  for (const c of (children || [])) if (c) n.appendChild(c);
  return n;
}

/* Modal dialogs — one place, so nothing calls window.prompt/confirm. */
function closeDialog() { $("#scrim").classList.remove("show"); $("#dlgBody").innerHTML = ""; $("#dlgFoot").innerHTML = ""; }

function askText(title, labelText, initial, onOk) {
  $("#dlgTitle").textContent = title;
  const input = el("input", { type: "text", value: initial || "" });
  $("#dlgBody").innerHTML = "";
  $("#dlgBody").append(el("h3", { text: labelText }), input);
  $("#dlgFoot").innerHTML = "";
  const ok = el("button", { class: "btn primary", text: "OK", onclick: () => { const v = input.value.trim(); closeDialog(); if (v) onOk(v); } });
  $("#dlgFoot").append(el("button", { class: "btn", text: "Cancel", onclick: closeDialog }), ok);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); ok.click(); } });
  $("#scrim").classList.add("show");
  setTimeout(() => { input.focus(); input.select(); }, 10);
}

function askConfirm(title, message, okLabel, onOk) {
  $("#dlgTitle").textContent = title;
  $("#dlgBody").innerHTML = "";
  $("#dlgBody").append(el("h3", { text: message }));
  $("#dlgFoot").innerHTML = "";
  const ok = el("button", { class: "btn primary", text: okLabel || "Delete", onclick: () => { closeDialog(); onOk(); } });
  $("#dlgFoot").append(el("button", { class: "btn", text: "Cancel", onclick: closeDialog }), ok);
  $("#scrim").classList.add("show");
  setTimeout(() => ok.focus(), 10);
}

/* ============================================================
   5. Rendering — rail
   ============================================================ */

function renderRail() {
  invalidateDeps();
  const list = $("#projectList");
  list.innerHTML = "";
  for (const p of state.projects) {
    const isActive = p.id === state.activeProjectId;
    const row = el("div", { class: "row" + (isActive ? " active" : ""), onclick: () => selectProject(p.id) }, [
      el("span", { class: "name", text: p.name, title: p.name }),
      el("span", { class: "sub", text: p.blocks.length + "×" + p.blocks.reduce((n, b) => n + b.variants.length, 0) }),
      el("button", {
        class: "btn ghost tiny rowact", text: "⋯", title: "Rename, duplicate or delete",
        onclick: (e) => { e.stopPropagation(); projectMenu(p); },
      }),
    ]);
    list.appendChild(row);
  }

  const p = project();
  renderBankList(p);

  const takes = $("#takeList");
  takes.innerHTML = "";
  const sig = currentSignature();
  if (!p.takes.length) {
    takes.appendChild(el("div", { class: "emptynote", text: "No takes yet. Snapshot a combination you like and jump back to it in one click." }));
  }
  for (const t of p.takes) {
    const isCurrent = takeSignature(t) === sig;
    const res = resolveTake(t, p);
    const on = p.blocks.filter((b) => {
      const g = b.groupId ? p.groups.find((x) => x.id === b.groupId) : null;
      return res.blocks[b.id].on && (!g || res.groups[g.id].on);
    }).length;
    const row = el("div", { class: "row take-row" + (isCurrent ? " current" : ""), onclick: () => applyTake(t.id) }, [
      el("span", { class: "pip" }),
      el("span", { class: "name", text: t.name, title: t.name }),
      el("span", { class: "sub", text: on + "/" + p.blocks.length, title: on + " of " + p.blocks.length + " blocks reach the prompt in this take" }),
      el("button", {
        class: "btn ghost tiny rowact", text: "⋯", title: "Update, rename or delete",
        onclick: (e) => { e.stopPropagation(); takeMenu(t); },
      }),
    ]);
    takes.appendChild(row);
  }
}

/* Word banks live in the rail because they are project-wide: one row per bank,
   showing the name exactly as you must type it and the word it currently
   resolves to. Clicking the row advances to the next word, which is the same
   cycle-button idiom the rest of the app uses. */
function renderBankList(p) {
  const host = $("#bankList");
  host.innerHTML = "";
  const banks = p.banks || [];
  if (!banks.length) {
    host.appendChild(el("div", {
      class: "emptynote",
      text: "No word banks. A bank is a name like TONE that you write into any block; the prompt gets the word you picked.",
    }));
    return;
  }
  const usage = bankUsageCounts(p);
  banks.forEach((k) => {
    const w = activeWord(k);
    const uses = usage[k.id] || 0;
    const row = el("div", {
      class: "row bank-row", title: "Click to advance · " + k.name + " → " + ((w && w.text) || "(empty)") +
        " · used in " + uses + " version" + (uses === 1 ? "" : "s"),
      onclick: () => cycleBankWord(k.id, 1),
    }, [
      el("span", { class: "bankname", text: k.name }),
      el("span", { class: "bankword", text: (w && w.text.trim()) || "—" }),
      el("span", { class: "sub", text: k.words.length + (uses ? "" : " ·0") }),
      el("button", {
        class: "btn ghost tiny rowact", text: "⋯", title: "Edit words, rename or delete",
        onclick: (e) => { e.stopPropagation(); bankMenu(k); },
      }),
    ]);
    if (!uses) row.classList.add("bank-unused");
    host.appendChild(row);
  });
}

/* How many versions actually mention each bank. A bank nothing references is
   almost always a typo in the block text, so it is worth showing. */
function bankUsageCounts(p) {
  const counts = {};
  (p.banks || []).forEach((k) => { counts[k.id] = 0; });
  const names = (p.banks || []).map((k) => k.name).filter(Boolean);
  if (!names.length) return counts;
  p.blocks.forEach((b) => b.variants.forEach((v) => v.versions.forEach((s) => {
    (p.banks || []).forEach((k) => {
      if (!k.name) return;
      const re = new RegExp("(^|[^A-Z0-9_])" + k.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Z0-9_])");
      /* Only mentions that can actually substitute count — a bank named inside
         a note is a bank nothing uses, and the strike-through should say so. */
      if (re.test(stripNotes(s.text))) counts[k.id]++;
    });
  })));
  return counts;
}

function cycleBankWord(bankId, dir) {
  const p = project();
  const k = (p.banks || []).find((x) => x.id === bankId);
  if (!k || k.words.length < 2) return;
  const i = k.words.findIndex((w) => w.id === k.activeWordId);
  k.activeWordId = k.words[(i + dir + k.words.length) % k.words.length].id;
  touch(); renderStack(); renderOutput(); renderRail();
}

function newBank() {
  askText("New word bank", "Name it — capitals and underscores, so it never turns up by accident", "TONE", (raw) => {
    const p = project();
    const name = bankNameFrom(raw);
    if (!name) { toast("That name has no letters or digits in it"); return; }
    if ((p.banks || []).some((k) => k.name === name)) { toast("“" + name + "” already exists"); return; }
    const k = makeBank(name, null);
    p.banks.push(k);
    touch(); renderAll();
    bankMenu(k);
  });
}

/* One dialog for the whole bank: its words, which is selected, and the
   destructive actions. Editing a word writes straight through, the way the
   block editor writes straight through to its version. */
function bankMenu(k) {
  const p = project();
  const draw = () => {
    $("#dlgTitle").textContent = "Word bank";
    $("#dlgBody").innerHTML = "";
    $("#dlgBody").append(
      el("h3", { text: k.name }),
      el("p", { html: "Write <code>" + esc(k.name) + "</code> anywhere in a block and the prompt gets the selected word." }),
    );
    const list = el("div", { class: "rowlist" });
    k.words.forEach((w) => {
      const isOn = w.id === k.activeWordId;
      const input = el("input", { type: "text", class: "bankwordinput", value: w.text, placeholder: "a word or phrase" });
      input.addEventListener("input", () => { w.text = input.value; touch(); renderStack(); renderOutput(); renderRail(); });
      const row = el("div", { class: "row bankedit" + (isOn ? " active" : "") }, [
        el("button", {
          class: "pip pipbtn" + (isOn ? " on" : ""), title: isOn ? "Selected" : "Use this word",
          onclick: () => { k.activeWordId = w.id; touch(); renderStack(); renderOutput(); renderRail(); draw(); },
        }),
        input,
        el("button", {
          class: "btn ghost tiny", text: "✕", title: "Remove this word", disabled: k.words.length < 2,
          onclick: () => {
            const i = k.words.indexOf(w);
            k.words.splice(i, 1);
            if (k.activeWordId === w.id) k.activeWordId = k.words[Math.max(0, i - 1)].id;
            p.takes.forEach((t) => { if (t.banks && t.banks[k.id] === w.id) delete t.banks[k.id]; });
            touch(); renderStack(); renderOutput(); renderRail(); draw();
          },
        }),
      ]);
      list.appendChild(row);
    });
    $("#dlgBody").append(list);
    $("#dlgBody").append(el("button", {
      class: "btn tiny", text: "+ Add a word",
      onclick: () => { const w = makeWord(""); k.words.push(w); k.activeWordId = w.id; touch(); renderRail(); draw(); },
    }));

    $("#dlgFoot").innerHTML = "";
    $("#dlgFoot").append(
      el("button", { class: "btn", text: "Close", onclick: closeDialog }),
      el("button", {
        class: "btn", text: "Rename",
        onclick: () => askText("Rename bank", "New name", k.name, (raw) => {
          const name = bankNameFrom(raw);
          if (!name) { toast("That name has no letters or digits in it"); return; }
          if (name !== k.name && (p.banks || []).some((x) => x.name === name)) { toast("“" + name + "” already exists"); return; }
          /* Renaming rewrites every mention, or the bank would silently stop
             resolving everywhere it was already used. */
          const old = k.name;
          const re = new RegExp("(^|[^A-Z0-9_])" + old.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Z0-9_])", "g");
          let rewritten = 0;
          p.blocks.forEach((b) => b.variants.forEach((v) => v.versions.forEach((s) => {
            const next = s.text.replace(re, (m, pre) => pre + name);
            if (next !== s.text) { s.text = next; rewritten++; }
          })));
          k.name = name;
          touch(); renderAll();
          toast(rewritten ? "Renamed, and rewrote " + rewritten + " version" + (rewritten === 1 ? "" : "s") : "Renamed");
          draw();
        }),
      }),
      el("button", {
        class: "btn primary", text: "Delete",
        onclick: () => {
          closeDialog();
          askConfirm("Delete word bank", "Delete “" + k.name + "”? Blocks that mention it will show the bare name instead.", "Delete", () => {
            p.banks = p.banks.filter((x) => x.id !== k.id);
            p.takes.forEach((t) => { if (t.banks) delete t.banks[k.id]; });
            touch(); renderAll();
          });
        },
      }),
    );
    $("#scrim").classList.add("show");
  };
  draw();
}

function takeMenu(t) {
  const p = project();
  const res = resolveTake(t, p);
  $("#dlgTitle").textContent = "Take";
  $("#dlgBody").innerHTML = "";

  /* Read out in stack order, so it matches what applying it will do —
     including the blocks and groups this take predates. */
  const lines = [];
  stackUnits(p).forEach((u) => {
    if (u.kind === "group") {
      const g = u.group, r = res.groups[g.id];
      const a = g.variants.find((x) => x.id === r.v);
      lines.push("<b>" + esc(g.label) + "</b> (group) → " +
        (r.on ? esc(a ? a.name : "—") : "off") + (r.known ? "" : " <i>· not yet made</i>"));
      u.blocks.forEach((b) => {
        const rb = res.blocks[b.id];
        const v = b.variants.find((x) => x.id === rb.v);
        lines.push("&nbsp;&nbsp;↳ " + esc(b.label) + " → " + (rb.on ? esc(v ? v.name : "—") : "off") +
          (rb.known ? "" : " <i>· added since, so off</i>"));
      });

    }

/* ---------- The dependency editor ---------- */

/* One line of English per condition, used for the badges, the tooltips and the
   list in the dialog, so the same sentence describes a condition everywhere. */
function conditionText(c) {
  const p = project();
  if (c.sourceType === "group") {
    const g = p.groups.find((x) => x.id === c.sourceId);
    if (!g) return "an unknown group (so this passes)";
    const names = c.require.arrangementIds
      .map((id) => { const a = g.variants.find((x) => x.id === id); return a ? a.name : "a deleted arrangement"; });
    const bits = [];
    if (names.length) bits.push("is on " + names.map((n) => "“" + n + "”").join(" or "));
    if (typeof c.require.enabled === "boolean") bits.push(c.require.enabled ? "is included" : "is muted");
    return "group “" + g.label + "” " + (bits.length ? bits.join(" and ") : "exists");
  }
  const b = p.blocks.find((x) => x.id === c.sourceId);
  if (!b) return "an unknown block (so this passes)";
  const names = [];
  c.require.variantIds.forEach((id) => {
    const v = b.variants.find((x) => x.id === id);
    names.push(v ? "“" + v.name + "”" : "a deleted variant");
  });
  c.require.versionIds.forEach((id) => {
    let found = null, owner = null;
    b.variants.forEach((v) => v.versions.forEach((s) => { if (s.id === id) { found = s; owner = v; } }));
    names.push(found ? "“" + owner.name + " / " + found.name + "”" : "a deleted version");
  });
  const bits = [];
  if (names.length) bits.push("is showing " + names.join(" or "));
  if (typeof c.require.enabled === "boolean") bits.push(c.require.enabled ? "is included" : "is muted");
  return "“" + b.label + "” " + (bits.length ? bits.join(" and ") : "exists");
}

function depReasonText(item) {
  if (!item || !item.conditions || !item.conditions.length) return "";
  return item.conditions.map((c) => "Held off unless " + conditionText(c)).join(" · ");
}

const depItemName = (scope) =>
  scope.kind === "group" ? "Group “" + scope.group.label + "”"
  : scope.kind === "block" ? "Block “" + scope.block.label + "”"
  : scope.kind === "variant" ? "Variant “" + scope.variant.name + "”"
  : "Version “" + scope.version.name + "” of “" + scope.variant.name + "”";

const depItemOf = (scope) =>
  scope.kind === "group" ? scope.group
  : scope.kind === "block" ? scope.block
  : scope.kind === "variant" ? scope.variant
  : scope.version;

/* Blocks, variants and versions share one dialog with a scope switch at the
   top, rather than three entry points that would each need finding. A group
   has only itself to talk about, so its dialog opens with no switch. */
function openDependsDialog(target) {
  const p = project();
  const isGroup = target.kind === "group";
  const b = target.block || null;
  let scope = isGroup ? { kind: "group", group: target.group } : { kind: target.kind || "block", block: b };
  if (!isGroup) {
    scope.variant = activeVariant(b);
    scope.version = activeVersion(scope.variant);
  }
  let editing = null;   // the condition being added or changed, or null

  const draw = () => {
    const item = depItemOf(scope);
    $("#dlgTitle").textContent = "Depends on";
    $("#dlgBody").innerHTML = "";
    $("#dlgBody").append(el("h3", { text: depItemName(scope) }));

    if (!isGroup) {
      const pick = el("div", { class: "depscope" });
      [["block", "Block"], ["variant", "Variant “" + scope.variant.name + "”"],
       ["version", "Version “" + scope.version.name + "”"]].forEach(([kind, label]) => {
        const n = (depItemOf(Object.assign({}, scope, { kind })).conditions || []).length;
        pick.appendChild(el("button", {
          class: "btn tiny" + (scope.kind === kind ? " primary" : ""),
          text: label + (n ? " (" + n + ")" : ""),
          onclick: () => { scope.kind = kind; editing = null; draw(); },
        }));
      });
      $("#dlgBody").append(pick);
    }

    $("#dlgBody").append(el("p", {
      class: "dephint",
      text: "While a condition fails, this item is held off: it stays where it is, struck through with its " +
            "switch locked, and takes no part in the prompt. It is never taken out of the stack — content " +
            "you cannot see is content you cannot switch back on. Nothing is rewritten either: its variant, " +
            "version and switch are all waiting where you left them.",
    }));

    if (!item.conditions.length) {
      $("#dlgBody").append(el("div", { class: "emptynote", text: "No conditions — this item is always available." }));
    }
    item.conditions.forEach((c) => {
      $("#dlgBody").append(el("div", { class: "depcond" }, [
        el("span", { class: "txt", html: "<b>Held off</b> unless " + esc(conditionText(c)) }),
        el("button", { class: "btn ghost tiny", text: "Edit", onclick: () => { editing = c; draw(); } }),
        el("button", {
          class: "btn ghost tiny", text: "✕", title: "Remove this condition",
          onclick: () => {
            item.conditions = item.conditions.filter((x) => x.id !== c.id);
            if (editing && editing.id === c.id) editing = null;
            touch(); renderStack(); renderOutput(); draw();
          },
        }),
      ]));
    });

    if (editing) $("#dlgBody").append(drawConditionForm(item));
    else {
      $("#dlgBody").append(el("button", {
        class: "btn tiny", text: "+ Add a condition",
        onclick: () => {
          const first = p.blocks.find((x) => x.id !== (b && b.id)) || p.blocks[0];
          if (!first) { toast("Nothing to depend on yet"); return; }
          editing = makeCondition("block", first.id);
          editing.__isNew = true;
          draw();
        },
      }));
    }

    $("#dlgFoot").innerHTML = "";
    $("#dlgFoot").append(el("button", { class: "btn primary", text: "Done", onclick: closeDialog }));
    $("#scrim").classList.add("show");
  };

  const drawConditionForm = (item) => {
    const form = el("div", { class: "depform" });
    const sources = []
      .concat(p.blocks.filter((x) => !b || x.id !== b.id).map((x) => ({ type: "block", id: x.id, label: x.label })))
      .concat((p.groups || []).filter((g) => !(isGroup && g.id === target.group.id))
        .map((g) => ({ type: "group", id: g.id, label: "Group: " + g.label })));

    const srcSelect = el("select", {});
    sources.forEach((s) => srcSelect.appendChild(el("option", { value: s.type + ":" + s.id, text: s.label })));
    srcSelect.value = editing.sourceType + ":" + editing.sourceId;
    if (!srcSelect.value && sources.length) {
      editing.sourceType = sources[0].type; editing.sourceId = sources[0].id;
      srcSelect.value = sources[0].type + ":" + sources[0].id;
    }
    srcSelect.addEventListener("change", () => {
      const [type, id] = srcSelect.value.split(":");
      editing.sourceType = type; editing.sourceId = id;
      editing.require = { variantIds: [], versionIds: [], arrangementIds: [], enabled: editing.require.enabled };
      draw();
    });

    const states = el("div", { class: "depstates" });
    if (editing.sourceType === "group") {
      const g = (p.groups || []).find((x) => x.id === editing.sourceId);
      (g ? g.variants : []).forEach((a) => {
        const cb = el("input", { type: "checkbox", checked: editing.require.arrangementIds.includes(a.id) });
        cb.addEventListener("change", () => {
          editing.require.arrangementIds = cb.checked
            ? editing.require.arrangementIds.concat([a.id])
            : editing.require.arrangementIds.filter((x) => x !== a.id);
        });
        states.appendChild(el("label", { class: "sv" }, [cb, el("span", { text: a.name })]));
      });
    } else {
      const src = p.blocks.find((x) => x.id === editing.sourceId);
      (src ? src.variants : []).forEach((v) => {
        const cb = el("input", { type: "checkbox", checked: editing.require.variantIds.includes(v.id) });
        cb.addEventListener("change", () => {
          editing.require.variantIds = cb.checked
            ? editing.require.variantIds.concat([v.id])
            : editing.require.variantIds.filter((x) => x !== v.id);
        });
        states.appendChild(el("label", { class: "sv" }, [cb, el("span", { text: v.name })]));
        if (v.versions.length < 2) return;
        v.versions.forEach((s) => {
          const scb = el("input", { type: "checkbox", checked: editing.require.versionIds.includes(s.id) });
          scb.addEventListener("change", () => {
            editing.require.versionIds = scb.checked
              ? editing.require.versionIds.concat([s.id])
              : editing.require.versionIds.filter((x) => x !== s.id);
          });
          states.appendChild(el("label", { class: "ss" }, [scb, el("span", { text: s.name })]));
        });
      });
    }
    if (!states.children.length) states.appendChild(el("div", { class: "emptynote", text: "Nothing to pick." }));

    const onSelect = el("select", {});
    [["", "no constraint"], ["on", "must be included"], ["off", "must be muted"]].forEach(([v, t]) =>
      onSelect.appendChild(el("option", { value: v, text: t })));
    onSelect.value = editing.require.enabled === true ? "on" : editing.require.enabled === false ? "off" : "";
    onSelect.addEventListener("change", () => {
      editing.require.enabled = onSelect.value === "on" ? true : onSelect.value === "off" ? false : null;
    });

    /* There is no effect to choose: a condition that fails holds its item off,
       and that is the only thing it can do. */
    form.append(
      el("label", { class: "line" }, [el("span", { text: "Depends on" }), srcSelect]),
      el("label", { class: "line" }, [el("span", { text: "In any of" })]),
      states,
      el("div", { style: "height:8px" }),
      el("label", { class: "line" }, [el("span", { text: "And it" }), onSelect]),
      el("div", {}, [
        el("button", { class: "btn tiny", text: "Cancel", onclick: () => { editing = null; draw(); } }),
        el("button", {
          class: "btn tiny primary", text: "Save condition",
          onclick: () => {
            const c = editing;
            const empty = !c.require.variantIds.length && !c.require.versionIds.length &&
                          !c.require.arrangementIds.length && typeof c.require.enabled !== "boolean";
            if (empty) { toast("Pick a state, or the condition asks for nothing"); return; }
            delete c.__isNew;
            if (!item.conditions.some((x) => x.id === c.id)) item.conditions.push(c);
            editing = null;
            touch(); renderStack(); renderOutput(); draw();
          },
        }),
      ]),
    );
    return form;
  };

  draw();
}

/* ============================================================
   5b. The filter
   ------------------------------------------------------------
   A view over the stack and nothing more: it hides rows, it never
   touches the document. Switching a variant, muting a block or
   saving a take while a filter is up all operate on the real data,
   so what you snapshot is the whole rig rather than the part of it
   you can currently see. The Assembled pane is likewise untouched —
   the prompt is always the whole prompt.
   ============================================================ */

const NO_FILTER = {
  active: false, query: "", shown: 0, total: 0,
  blockShown: () => true, groupShown: () => true, groupHit: () => false,
  variantShown: () => true, versionShown: () => true, matchesIn: () => 0,
};

function stackFilter(p) {
  const q = String(ui.searchQuery || "").trim().toLowerCase();
  if (!q) return Object.assign({}, NO_FILTER, { total: p.blocks.length });

  const hit = (s) => String(s == null ? "" : s).toLowerCase().includes(q);
  /* A bank is a piece of the text as much as the typed words are, so a version
     that mentions one is found by the bank's name, by the word it currently
     resolves to, and by any other word the bank holds — the text a version
     will say under a different pick is still text this version owns. */
  const hotBanks = (p.banks || [])
    .filter((k) => hit(k.name) || k.words.some((w) => hit(w.text)))
    .map((k) => new RegExp("(^|[^A-Z0-9_])" + k.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Z0-9_])"));
  const versionHit = (s) =>
    hit(s.name) || hit(s.text) || hit(substituteBanks(s.text)) ||
    hotBanks.some((re) => re.test(s.text));
  const variantHit = (v) => hit(v.name) || v.versions.some(versionHit);
  const groupHit = (g) => hit(g.label) || g.variants.some((a) => hit(a.name));

  const blocks = new Map();     // block id -> { shown, ownHit, variants:Set|null }
  const groups = new Map();     // group id -> { shown, hit, inside }
  (p.groups || []).forEach((g) => groups.set(g.id, { shown: false, hit: groupHit(g), inside: 0 }));

  p.blocks.forEach((b) => {
    const g = b.groupId ? groups.get(b.groupId) : null;
    const matched = b.variants.filter(variantHit);
    const ownHit = hit(b.label);
    const shown = ownHit || matched.length > 0 || !!(g && g.hit);
    /* Chips narrow only when the search actually found something inside this
       block. A block matched by its own label is shown whole — nothing in it
       was asked for in particular. The active variant always stays, or the
       editor below would be showing text whose chip is missing. */
    blocks.set(b.id, {
      shown,
      variants: matched.length ? new Set(matched.map((v) => v.id)) : null,
      versions: matched.length ? new Set(
        b.variants.flatMap((v) => v.versions.filter(versionHit).map((s) => s.id))) : null,
    });
    if (shown && g) { g.shown = true; g.inside++; }
  });
  /* A group is drawn if any member survived, or if the group itself matched —
     in which case its members are all shown, since the match was the group. */
  groups.forEach((r) => { if (r.hit) r.shown = true; });

  const shown = p.blocks.filter((b) => blocks.get(b.id).shown).length;
  return {
    active: true, query: q, shown, total: p.blocks.length,
    blockShown: (b) => !!(blocks.get(b.id) || {}).shown,
    groupShown: (g) => !!(groups.get(g.id) || {}).shown,
    groupHit: (g) => !!(groups.get(g.id) || {}).hit,
    matchesIn: (g) => ((groups.get(g.id) || {}).inside) || 0,
    variantShown: (b, v) => {
      const r = blocks.get(b.id);
      if (!r || !r.variants) return true;
      return r.variants.has(v.id) || v.id === b.activeVariantId;
    },
    versionShown: (b, v, s) => {
      const r = blocks.get(b.id);
      if (!r || !r.versions) return true;
      return r.versions.has(s.id) || s.id === v.activeVersionId;
    },
  };
}

/* The blocks the stack is currently drawing, in order — what j/k walk and what
   the result count reports. The filter is the only thing that takes a block
   out of this list: a condition holds a block off, it never removes it, so a
   held-off block is still somewhere the cursor can land. */
function visibleBlocks() {
  const p = project();
  const flt = stackFilter(p);
  return p.blocks.filter((b) => !flt.active || flt.blockShown(b));
}

function setSearchQuery(q) {
  const next = String(q == null ? "" : q);
  if (next === ui.searchQuery) return;
  ui.searchQuery = next;
  renderStack();
}

function syncSearchChrome(flt) {
  const box = $("#searchBox");
  const input = $("#searchInput");
  if (!box || !input) return;
  box.classList.toggle("on", !!flt.active);
  if (input.value !== ui.searchQuery) input.value = ui.searchQuery;
  $("#searchCount").textContent = flt.active ? flt.shown + " of " + flt.total : "";
}

/* ============================================================
   6. Rendering — the stack (edit view and mixer view)
   ============================================================ */

function renderStack() {
  const body = $("#stackBody");
  const scroll = body.scrollTop;
  body.innerHTML = "";
  const p = project();
  invalidateDeps();
  const flt = stackFilter(p);

  /* Toolbar */
  const nameInput = el("input", { class: "ghost-field projname", value: p.name, spellcheck: "false", "aria-label": "Project name" });
  nameInput.addEventListener("input", () => { p.name = nameInput.value; touch(); renderRail(); });

  const seg = el("div", { class: "segbtn" }, [
    el("button", { class: ui.view === "edit" ? "on" : "", text: "Edit", onclick: () => setView("edit") }),
    el("button", { class: ui.view === "mixer" ? "on" : "", text: "Mixer", onclick: () => setView("mixer") }),
  ]);

  const labelsToggle = el("label", { class: "togline" }, [
    el("input", { type: "checkbox", checked: p.includeLabels, onchange: (e) => { p.includeLabels = e.target.checked; touch(); renderOutput(); } }),
    el("span", { text: "Emit labels" }),
  ]);

  body.appendChild(el("div", { class: "stack-toolbar" }, [
    nameInput, seg, labelsToggle,
    el("button", { class: "btn tiny", text: "Shuffle", title: "Random combination", onclick: shuffleMix }),
    el("button", { class: "btn tiny", text: "Snapshot", title: "Save this combination as a take", onclick: saveTake }),
  ]));

  /* Which units survive the filter — the only thing that removes a row. A
     condition never does; it holds its item off in place. The unit's real
     index travels with it, so ↑↓ and a drop still address the stack itself
     rather than the slice of it on screen. */
  const units = stackUnits(p);
  const drawn = [];
  units.forEach((u, i) => {
    const shown = u.kind === "group" ? flt.groupShown(u.group) : flt.blockShown(u.block);
    if (flt.active && !shown) return;
    drawn.push({ u, i, dep: depOff(u.kind === "group" ? u.group : u.block) });
  });

  /* Counted over the blocks rather than the units, so a member held off inside
     a group it is still sitting in is counted too. */
  const depHeld = p.blocks.filter((b) => {
    const g = groupOf(b);
    return depOff(b) || (!!g && depOff(g));
  }).length;

  if (ui.view === "mixer") body.appendChild(renderMixer(p, drawn, units.length, flt));
  else if (!drawn.length) {
    body.appendChild(el("div", { class: "emptyfilter", text: "Nothing matches “" + ui.searchQuery.trim() + "”." }));
  } else drawn.forEach((d) => {
    body.appendChild(d.u.kind === "group"
      ? renderGroup(d.u, d.i, units.length, p, { dep: d.dep, filter: flt })
      : renderBlock(d.u.block, p, { unitIndex: d.i, unitCount: units.length, dep: d.dep, filter: flt }));
  });

  body.appendChild(el("button", { class: "addblock", text: "+  Add a block", onclick: () => addBlock() }));
  /* Height first, then scroll — see growEditors. */
  growEditors(body);
  body.scrollTop = scroll;

  syncSearchChrome(flt);

  const arrs = p.groups.reduce((n, g) => n + g.variants.length, 0);
  $("#stackHint").textContent = p.blocks.length + " blocks · " +
    p.blocks.reduce((n, b) => n + b.variants.length, 0) + " variants" +
    (p.groups.length ? " · " + p.groups.length + (p.groups.length > 1 ? " groups · " : " group · ") +
      arrs + (arrs > 1 ? " arrangements" : " arrangement") : "") +
    (depHeld ? " · " + depHeld + " held off by dependencies" : "");
}

/* ---------- A group container ---------- */

/* The bookmark's two pieces. The tail is drawn as a stroked path rather than
   clipped shapes so the ink stays an even band through the fork; it is a fixed
   size, and the body above it is what stretches to the group's height. */
const GROUP_TAIL_SVG =
  '<svg viewBox="0 0 13 15" aria-hidden="true" focusable="false">' +
  '<path d="M0.75 0 L0.75 14.25 L6.5 8.5 L12.25 14.25 L12.25 0"/></svg>';

function groupBookmarkNodes() {
  const tail = el("span", { class: "gtail" });
  tail.innerHTML = GROUP_TAIL_SVG;
  return [el("span", { class: "gribbon" }), tail];
}

function renderGroup(unit, unitIndex, unitCount, p, opts) {
  opts = opts || {};
  const flt = opts.filter || NO_FILTER;
  const dep = !!opts.dep;
  const g = unit.group;
  const a = activeArrangement(g);
  const onCount = unit.blocks.filter((b) => b.enabled).length;

  const labelInput = el("input", { class: "ghost-field grouplabel", value: g.label, spellcheck: "false", "aria-label": "Group label" });
  labelInput.addEventListener("input", () => { g.label = labelInput.value; touch(); renderRail(); });

  const head = el("div", { class: "ghead" }, [
    el("span", { class: "gtag", text: "Group" }),
    el("button", {
      class: "switch teal", "aria-pressed": String(g.enabled),
      title: dep ? "A dependency is holding this group off"
        : g.enabled ? "The whole group is included — click to mute all of it" : "The whole group is muted — click to include it",
      onclick: () => { if (!dep) toggleGroup(g.id); },
    }),
    labelInput,
    dep ? el("span", { class: "deplock", text: "held off", title: depReasonText(g) }) : null,
    g.conditions.length ? el("button", {
      class: "depbadge", text: "⋔ " + g.conditions.length,
      title: depReasonText(g), onclick: () => openDependsDialog({ kind: "group", group: g }),
    }) : null,
    flt.active && g.collapsed && flt.matchesIn(g)
      ? el("span", { class: "matchnote", text: flt.matchesIn(g) + " inside", title: "Matches are inside this collapsed group" })
      : null,
    el("span", { class: "groupmeta", text: onCount + "/" + unit.blocks.length + " on · " + g.variants.length + " arr" }),
    el("button", {
      class: "btn ghost tiny", text: g.collapsed ? "▸" : "▾", title: g.collapsed ? "Expand" : "Collapse",
      onclick: () => { g.collapsed = !g.collapsed; touch(); renderStack(); },
    }),
    el("button", { class: "btn ghost tiny", text: "↑", title: "Move the whole group up", disabled: unitIndex === 0, onclick: () => moveUnit(unitIndex, -1) }),
    el("button", { class: "btn ghost tiny", text: "↓", title: "Move the whole group down", disabled: unitIndex === unitCount - 1, onclick: () => moveUnit(unitIndex, 1) }),
    el("button", { class: "btn ghost tiny", text: "✕", title: "Disband — the blocks stay, the wiring goes", onclick: () => disbandGroup(g.id) }),
  ]);

  /* Arrangement chips: the group's own variants. */
  const arrs = el("div", { class: "arrs" }, [el("span", { class: "label-cap", text: "Arrangements" })]);
  g.variants.forEach((av, i) => {
    const isOn = av.id === g.activeVariantId;
    const chip = el("button", {
      class: "chip arr" + (isOn ? " on" : ""),
      title: isOn ? "Active arrangement — click the name to rename it"
                  : "Switch this group to “" + av.name + "”",
      onclick: () => { if (!isOn) pickArrangement(g.id, av.id); },
    });
    chip.appendChild(el("span", { class: "k", text: i < 9 ? String(i + 1) : "·" }));
    if (isOn) {
      const nameInput = el("input", { class: "chipname", value: av.name, size: Math.max(2, av.name.length), spellcheck: "false", "aria-label": "Arrangement name" });
      nameInput.addEventListener("input", () => {
        av.name = nameInput.value; nameInput.size = Math.max(2, nameInput.value.length);
        av.updatedAt = now(); touch();
      });
      nameInput.addEventListener("click", (e) => e.stopPropagation());
      chip.appendChild(nameInput);
    } else {
      const missing = unit.blocks.filter((b) => !Object.prototype.hasOwnProperty.call(av.picks, b.id)).length;
      const onHere = unit.blocks.filter((b) => Object.prototype.hasOwnProperty.call(av.picks, b.id) && !av.off.includes(b.id)).length;
      chip.appendChild(el("span", { class: "t", text: av.name || "—" }));
      chip.title += " · " + onHere + " of " + unit.blocks.length + " on" +
        (missing ? " · " + missing + " added since (off here)" : "");
    }
    arrs.appendChild(chip);
  });
  arrs.appendChild(el("button", {
    class: "chip add arr", text: "+",
    title: "New arrangement, starting from how the group looks right now",
    onclick: () => addArrangement(g.id),
  }));
  if (g.variants.length > 1) {
    arrs.appendChild(el("button", {
      class: "chip add arr", text: "✕",
      title: "Delete the active arrangement",
      onclick: () => deleteArrangement(g.id, g.activeVariantId),
    }));
  }

  const body = el("div", { class: "gbody" });
  unit.blocks.forEach((b, i) => {
    if (flt.active && !flt.blockShown(b) && !flt.groupHit(g)) return;
    body.appendChild(renderBlock(b, p, {
      inGroup: g, memberIndex: i, memberCount: unit.blocks.length, dep: depOff(b), filter: flt,
    }));
  });

  const foot = el("div", { class: "gfoot" }, [
    el("span", { text: "“" + (a ? a.name : "—") + "” · " + onCount + " of " + unit.blocks.length + " blocks on" }),
    el("span", { class: "grow" }),
    el("button", {
      class: "btn ghost tiny", text: "Depends…", title: "Make this group conditional on another block or group",
      onclick: () => openDependsDialog({ kind: "group", group: g }),
    }),
    el("button", { class: "btn ghost tiny", text: "+ Block in group", title: "Add a new block to this group", onclick: () => addBlock(g.id) }),
  ]);

  const wrap = el("section", {
    class: "group" + (g.enabled ? "" : " off") + (g.collapsed ? " collapsed" : "") + (dep ? " depoff" : ""),
    "data-group": g.id, "data-unit-index": String(unitIndex),
  }, [head, arrs, body, foot].concat(groupBookmarkNodes()));
  /* On the head, not the container — the members light their own slices. */
  head.addEventListener("mouseenter", () => litGroupSegment(g.id, true));
  head.addEventListener("mouseleave", () => litGroupSegment(g.id, false));
  /* The header is the group's grip: the whole run travels together. */
  head.addEventListener("pointerdown", (e) => beginUnitDrag(e, wrap, unitIndex));
  return wrap;
}

function renderBlock(b, p, opts) {
  opts = opts || {};
  const flt = opts.filter || NO_FILTER;
  const dep = !!opts.dep;
  const idx = p.blocks.indexOf(b);
  const focused = ui.focusBlockId === b.id;
  const av = activeVariant(b);
  /* What the block is really showing. It differs from the active variant only
     when a condition has switched that one off, and the foot says so. */
  const eff = effectiveVariant(b);
  const grp = opts.inGroup || null;

  /* Head */
  const labelInput = el("input", { class: "ghost-field blocklabel", value: b.label, spellcheck: "false", "aria-label": "Block label" });
  labelInput.addEventListener("input", () => { b.label = labelInput.value; touch(); if (p.includeLabels) renderOutput(); });

  /* ↑↓ move within the group when the block is in one, and move the whole
     unit when it is loose — so a loose block hops over a group rather than
     tunnelling into the middle of it. */
  const upDisabled  = grp ? opts.memberIndex === 0 : opts.unitIndex === 0;
  const dnDisabled  = grp ? opts.memberIndex === opts.memberCount - 1 : opts.unitIndex === opts.unitCount - 1;
  const move = (dir) => (grp ? moveBlockWithinGroup(b.id, dir) : moveUnit(opts.unitIndex, dir));

  const grip = el("span", { class: "blocknum", text: String(idx + 1), title: "Drag to reorder" });
  grip.addEventListener("pointerdown", (e) => {
    if (grp) beginMemberDrag(e, card, grp, opts.memberIndex);
    else beginUnitDrag(e, card, opts.unitIndex);
  });

  const head = el("div", { class: "head" }, [
    grip,
    el("button", {
      class: "switch", "aria-pressed": String(b.enabled),
      title: dep ? "A dependency is holding this block off"
        : grp && !grp.enabled
        ? (b.enabled ? "On in this arrangement, but the group is muted" : "Off in this arrangement")
        : (b.enabled ? "Included — click to mute" : "Muted — click to include"),
      onclick: () => {
        if (dep) return;
        b.enabled = !b.enabled; touch(); renderStack(); renderOutput(); renderRail();
      },
    }),
    labelInput,
    dep ? el("span", { class: "deplock", text: "held off", title: depReasonText(b) }) : null,
    b.conditions.length ? el("button", {
      class: "depbadge", text: "⋔ " + b.conditions.length,
      title: depReasonText(b), onclick: () => openDependsDialog({ kind: "block", block: b }),
    }) : null,
    el("span", { class: "blockmeta", text: blockMetaText(b) }),
    el("button", { class: "btn ghost tiny", text: "↑", title: grp ? "Move up inside the group" : "Move up", disabled: upDisabled, onclick: () => move(-1) }),
    el("button", { class: "btn ghost tiny", text: "↓", title: grp ? "Move down inside the group" : "Move down", disabled: dnDisabled, onclick: () => move(1) }),
    el("button", { class: "btn ghost tiny", text: "⧉", title: "Duplicate block", onclick: () => duplicateBlock(b.id) }),
    el("button", { class: "btn ghost tiny", text: "✕", title: "Delete block", onclick: () => deleteBlock(b.id) }),
  ]);

  /* Chips — every variant, always visible. The active one is renameable in place. */
  const chips = el("div", { class: "chips" });
  b.variants.forEach((v, i) => {
    if (!flt.variantShown(b, v)) return;
    const vdep = depOff(v);
    const isOn = v.id === b.activeVariantId;
    const isCmp = b.compareId === v.id;
    const chip = el("button", {
      class: "chip" + (isOn ? " on" : "") + (isCmp ? " cmp" : "") + (vdep ? " depoff" : ""),
      title: vdep ? "A dependency is holding this variant off · " + depReasonText(v)
           : isOn ? "Active — click the name to rename. Shift-click another chip to compare."
                  : "Click to use · Shift-click to compare with the active variant",
      onclick: (e) => {
        if (vdep) return;
        if (e.shiftKey && !isOn) { b.compareId = isCmp ? null : v.id; touch(); renderStack(); return; }
        if (!isOn) pickVariant(b.id, v.id);
      },
    });
    chip.appendChild(el("span", { class: "k", text: i < 9 ? String(i + 1) : "·" }));
    if (isOn) {
      const nameInput = el("input", { class: "chipname", value: v.name, size: Math.max(2, v.name.length), spellcheck: "false", "aria-label": "Variant name" });
      nameInput.addEventListener("input", () => {
        v.name = nameInput.value; nameInput.size = Math.max(2, nameInput.value.length);
        v.updatedAt = now(); touch();
      });
      nameInput.addEventListener("click", (e) => e.stopPropagation());
      chip.appendChild(nameInput);
    } else {
      chip.appendChild(el("span", { class: "t", text: v.name || "—" }));
    }
    /* How many versions are folded inside, so a variant never hides its depth
       just because it is not the one currently open. */
    if (v.versions.length > 1) {
      chip.appendChild(el("span", { class: "vcount", text: String(v.versions.length) }));
      chip.title += " · " + v.versions.length + " versions";
    }
    if (v.conditions.length) {
      chip.appendChild(el("span", { class: "vcount", text: "⋔" + v.conditions.length }));
      chip.title += " · " + depReasonText(v);
    }
    chips.appendChild(chip);
  });
  chips.appendChild(el("button", { class: "chip add", text: "+", title: "New empty variant", onclick: () => addVariant(b.id, false) }));
  chips.appendChild(el("button", { class: "chip add", text: "⧉", title: "Fork the active variant", onclick: () => addVariant(b.id, true) }));

  /* The active variant's versions, one row down. They are shown rather than
     tucked into a dropdown because the whole premise of this app is that every
     version of every part stays on the table; burying them would contradict it.
     Only the open variant's versions appear, so the row stays short. */
  const vers = el("div", { class: "vers" }, [el("span", { class: "label-cap", text: "Versions" })]);
  av.versions.forEach((s, i) => {
    if (!flt.versionShown(b, av, s)) return;
    const sdep = depOff(s);
    const isNow = s.id === av.activeVersionId;
    const vchip = el("button", {
      class: "chip ver" + (isNow ? " on" : "") + (sdep ? " depoff" : ""),
      title: sdep ? "A dependency is holding this version off · " + depReasonText(s)
           : isNow ? "Showing this version — click the name to rename it"
                   : "Show “" + (s.name || "—") + "” of “" + av.name + "”",
      onclick: () => { if (!sdep && !isNow) pickVersion(b.id, av.id, s.id); },
    });
    vchip.appendChild(el("span", { class: "k", text: i < 9 ? String(i + 1) : "·" }));
    if (isNow) {
      const nameInput = el("input", { class: "chipname", value: s.name, size: Math.max(2, s.name.length), spellcheck: "false", "aria-label": "Version name" });
      nameInput.addEventListener("input", () => {
        s.name = nameInput.value; nameInput.size = Math.max(2, nameInput.value.length);
        s.updatedAt = now(); touch();
      });
      nameInput.addEventListener("click", (e) => e.stopPropagation());
      vchip.appendChild(nameInput);
    } else {
      vchip.appendChild(el("span", { class: "t", text: s.name || "—" }));
      vchip.title += " · " + countWords(stripNotes(s.text)) + "w";
    }
    if (s.conditions.length) {
      vchip.appendChild(el("span", { class: "vcount", text: "⋔" + s.conditions.length }));
      vchip.title += " · " + depReasonText(s);
    }
    vers.appendChild(vchip);
  });
  vers.appendChild(el("button", { class: "chip add ver", text: "+", title: "New empty version of “" + av.name + "”", onclick: () => addVersion(b.id, av.id, false) }));
  vers.appendChild(el("button", { class: "chip add ver", text: "⧉", title: "Fork this version", onclick: () => addVersion(b.id, av.id, true) }));
  if (av.versions.length > 1) {
    vers.appendChild(el("button", { class: "chip add ver", text: "✕", title: "Delete this version", onclick: () => deleteVersion(b.id, av.id, av.activeVersionId) }));
  }

  /* Editor — typing must never re-render this card, or the caret jumps. */
  const cur = activeVersion(av);
  const ta = el("textarea", {
    class: "editor", spellcheck: "true",
    placeholder: "Write this part of the prompt…  (a line starting with // is a note and never ships)",
    "data-block": b.id,
  });
  ta.value = cur ? cur.text : "";
  const edback = el("div", { class: "edback", "aria-hidden": "true" });
  const edwrap = el("div", { class: "edwrap" }, [edback, ta]);
  paintNoteBands(edback, ta.value);
  ta.addEventListener("input", () => {
    if (cur) { cur.text = ta.value; cur.updatedAt = now(); }
    av.updatedAt = now(); touch();
    autoGrow(ta);
    paintNoteBands(edback, ta.value);
    head.querySelector(".blockmeta").textContent = blockMetaText(b);
    renderOutput();
    if (b.compareId) refreshDiff(card, b);
  });
  ta.addEventListener("focus", () => setFocusBlock(b.id, false));

  /* Foot: compare picker + counts */
  const cmpSelect = el("select", { title: "Compare the active variant against another" });
  cmpSelect.appendChild(el("option", { value: "", text: "Compare with…" }));
  b.variants.filter((v) => v.id !== b.activeVariantId).forEach((v) => {
    cmpSelect.appendChild(el("option", { value: v.id, text: v.name, selected: b.compareId === v.id }));
  });
  cmpSelect.value = b.compareId || "";
  cmpSelect.addEventListener("change", () => { b.compareId = cmpSelect.value || null; touch(); renderStack(); });

  /* Which group this block is wired into. Choosing one moves the block next
     to its group-mates, because a group is drawn as one container. */
  const grpSelect = el("select", { title: "Wire this block into a group" });
  grpSelect.appendChild(el("option", { value: "", text: "No group" }));
  p.groups.forEach((g2) => grpSelect.appendChild(el("option", { value: g2.id, text: "Group: " + (g2.label || "—") })));
  grpSelect.appendChild(el("option", { value: "__new", text: "New group…" }));
  grpSelect.value = b.groupId || "";
  grpSelect.addEventListener("change", () => {
    const v = grpSelect.value;
    if (v === "__new") { grpSelect.value = b.groupId || ""; newGroupFrom(b.id); return; }
    setBlockGroup(b.id, v || null);
  });

  /* Counts are of the text that actually ships: the notes are out and the
     banks are in. */
  const noteInfo = splitNotes(cur ? cur.text : "");
  const resolved = substituteBanks(noteInfo.prompt);
  const foot = el("div", { class: "foot" }, [
    cmpSelect,
    grpSelect,
    el("span", { class: "grow" }),
    noteInfo.notes.length
      ? el("span", { class: "deplock", text: noteInfo.notes.length + (noteInfo.notes.length === 1 ? " note" : " notes"),
                     title: noteInfo.notes.join("\n\n") })
      : null,
    eff && eff.id !== b.activeVariantId
      ? el("span", { class: "deplock", text: "shipping “" + eff.name + "”",
                     title: "A dependency has switched off the variant this block is set to, so it is showing the first one still available. Nothing has been rewritten." })
      : null,
    el("span", { text: resolved.length + " ch · " + countWords(resolved) + " words" }),
    el("button", { class: "btn ghost tiny", text: "Copy part", onclick: () => copyText(resolved, "Copied “" + b.label + "”") }),
    el("button", {
      class: "btn ghost tiny", text: "Depends…", title: "Make this block, variant or version conditional on another",
      onclick: () => openDependsDialog({ kind: "block", block: b }),
    }),
    el("button", {
      class: "btn ghost tiny", text: "Delete variant", disabled: b.variants.length < 2,
      onclick: () => deleteVariant(b.id, b.activeVariantId),
    }),
  ]);

  const card = el("section", {
    class: "block" + (focused ? " focused" : "") + (b.enabled ? "" : " off") +
           (b.enabled && grp && !grp.enabled ? " mutedbygroup" : "") + (dep ? " depoff" : ""),
    "data-block": b.id,
    "data-unit-index": grp ? null : String(opts.unitIndex),
    "data-member-index": grp ? String(opts.memberIndex) : null,
  }, [head, chips, vers, edwrap, foot]);

  card.addEventListener("mouseenter", () => litSegment(b.id, true));
  card.addEventListener("mouseleave", () => litSegment(b.id, false));
  card.addEventListener("mousedown", () => setFocusBlock(b.id, false));

  if (b.compareId) refreshDiff(card, b);
  /* No autoGrow here: the card is still detached, so it cannot be measured.
     renderStack grows the whole stack at once once everything is in the DOM. */
  return card;
}

/* "3 var · 2 ver · 41w" — the version count only shows when there is one to
   report, so a plain block reads exactly as it did before versions existed. */
function blockMetaText(b) {
  const av = activeVariant(b);
  const words = countWords(substituteBanks(stripNotes(variantText(av))));
  return b.variants.length + " var" +
    (av && av.versions.length > 1 ? " · " + av.versions.length + " ver" : "") +
    " · " + words + "w";
}

const mixSnippet = (v) => substituteBanks(stripNotes(variantText(v))).replace(/\s+/g, " ").trim() || "—";

function refreshDiff(card, b) {
  let box = card.querySelector(".diffbox");
  const other = b.variants.find((v) => v.id === b.compareId);
  if (!other) { if (box) box.remove(); return; }
  if (!box) {
    box = el("div", { class: "diffbox" });
    card.insertBefore(box, card.querySelector(".foot"));
  }
  const av = activeVariant(b);
  box.innerHTML =
    '<span class="legend">' + esc(other.name) + " → " + esc(av.name) +
    "  ·  <del>removed</del> <ins>added</ins></span>" +
    renderDiffHtml(variantText(other), variantText(av));
}

function autoGrow(ta) {
  ta.style.height = "auto";
  ta.style.height = Math.max(70, ta.scrollHeight) + "px";
}

/* The band behind each note line. One div per line, mirroring the textarea's
   own wrapping, with transparent text — the visible glyphs are always the
   textarea's, so this can only ever be a rectangle in the wrong place, never a
   second copy of the text. Built only when the version actually contains a
   note, so ordinary editing carries none of it.

   The zero-width space keeps an empty line one row tall; a div with nothing in
   it would collapse and every band below it would slide up a line. */
function paintNoteBands(host, text) {
  if (!host) return;
  if (!hasNotes(text)) { if (host.firstChild) host.textContent = ""; return; }
  const flags = splitNotes(text).lineFlags;
  host.innerHTML = String(text).split("\n").map((line, i) =>
    '<div class="edline' + (flags[i] ? " note" : "") + '">' + esc(line) + "\u200b</div>").join("");
}

/* Grow every editor at once, synchronously.

   This has to happen before renderStack restores the scroll position. A freshly
   built editor has no height yet, so the whole stack sits at its 70px-per-block
   minimum; write scrollTop against that and the browser clamps it to the short
   content, and the position is gone for good — the view jumps upward. Growing
   them a tick later (which is what used to happen) is far too late.

   Batched into one read pass and one write pass, so measuring a long stack
   costs a single layout rather than one per block. */
function growEditors(root) {
  const list = $$(".editor", root);
  list.forEach((ta) => { ta.style.height = "auto"; });
  const heights = list.map((ta) => Math.max(70, ta.scrollHeight));
  list.forEach((ta, i) => { ta.style.height = heights[i] + "px"; });
}

/* The mixer draws the same surviving units the edit view does — a row the
   filter or a dependency has taken out of one is out of the other. */
function renderMixer(p, drawn, unitCount, flt) {
  flt = flt || NO_FILTER;
  const wrap = el("div", { class: "mixer" });
  if (!drawn.length) {
    wrap.appendChild(el("div", { class: "emptyfilter", text: "Nothing matches “" + ui.searchQuery.trim() + "”." }));
    return wrap;
  }
  drawn.forEach((d) => {
    const u = d.u;
    if (u.kind === "group") {
      wrap.appendChild(renderMixerGroupRow(u, d.dep));
      u.blocks.forEach((b) => {
        if (flt.active && !flt.blockShown(b) && !flt.groupHit(u.group)) return;
        wrap.appendChild(renderMixerRow(b, u.group, depOff(b)));
      });
      return;
    }
    wrap.appendChild(renderMixerRow(u.block, null, d.dep));
  });
  return wrap;
}

function renderMixerGroupRow(unit, dep) {
  dep = !!dep;
  const g = unit.group;
  const a = activeArrangement(g);
  const ai = g.variants.indexOf(a);
  const onCount = unit.blocks.filter((b) => b.enabled).length;
  const row = el("div", { class: "mixgroup" + (g.enabled ? "" : " off") + (dep ? " depoff" : ""), "data-group": g.id }, [
    el("button", {
      class: "switch teal", "aria-pressed": String(g.enabled),
      title: dep ? "A dependency is holding this group off" : "Include or mute the whole group",
      onclick: () => { if (!dep) toggleGroup(g.id); },
    }),
    el("div", { class: "mlabel" }, [
      el("span", { class: "gtag", text: "Grp" }),
      el("span", { text: g.label, title: g.label }),
      dep ? el("span", { class: "deplock", text: "⋔", title: depReasonText(g) }) : null,
    ]),
    el("div", { class: "mixpick" }, [
      el("button", { class: "arw", text: "◀", title: "Previous arrangement", onclick: () => cycleArrangement(g.id, -1) }),
      el("button", {
        class: "now", text: a ? a.name : "—",
        title: "Click to advance · " + (ai + 1) + " of " + g.variants.length,
        onclick: () => cycleArrangement(g.id, 1),
      }),
      el("button", { class: "arw", text: "▶", title: "Next arrangement", onclick: () => cycleArrangement(g.id, 1) }),
    ]),
    el("span", { class: "snip", text: onCount + " of " + unit.blocks.length + " blocks on" }),
    el("span", { class: "ct", text: (ai + 1) + "/" + g.variants.length }),
  ]);
  row.addEventListener("mouseenter", () => litGroupSegment(g.id, true));
  row.addEventListener("mouseleave", () => litGroupSegment(g.id, false));
  return row;
}

function renderMixerRow(b, grp, dep) {
  dep = !!dep;
  const av = activeVariant(b);
  const vi = b.variants.indexOf(av);
  const row = el("div", {
    class: "mixrow" + (b.enabled ? "" : " off") + (grp ? " ingroup" : "") +
           (dep ? " depoff" : "") + (ui.focusBlockId === b.id ? " focused" : ""),
    "data-block": b.id,
  }, [
    el("button", {
      class: "switch", "aria-pressed": String(b.enabled),
      title: dep ? "A dependency is holding this block off"
           : grp && !grp.enabled ? "On in this arrangement, but the group is muted" : "Include or mute",
      onclick: () => {
        if (dep) return;
        b.enabled = !b.enabled; touch(); renderStack(); renderOutput(); renderRail();
      },
    }),
    el("span", { class: "mlabel", text: b.label + (dep ? " ⋔" : ""), title: dep ? depReasonText(b) : b.label }),
    el("div", { class: "mixpick" }, [
      el("button", { class: "arw", text: "◀", title: "Previous variant", onclick: () => cycleVariant(b.id, -1) }),
      el("button", {
        class: "now", text: av.name, title: "Click to advance · " + (vi + 1) + " of " + b.variants.length,
        onclick: () => cycleVariant(b.id, 1),
      }),
      el("button", { class: "arw", text: "▶", title: "Next variant", onclick: () => cycleVariant(b.id, 1) }),
    ]),
    el("span", { class: "snip", text: mixSnippet(av), title: variantText(av) }),
    el("span", { class: "ct", text: (vi + 1) + "/" + b.variants.length }),
  ]);
  row.addEventListener("mouseenter", () => litSegment(b.id, true));
  row.addEventListener("mouseleave", () => litSegment(b.id, false));
  row.addEventListener("mousedown", () => setFocusBlock(b.id, false));
  return row;
}

/* ============================================================
   6b. Drag to reorder
   ------------------------------------------------------------
   A pointer drag, not HTML5 drag-and-drop: this page runs as a
   child webview of the gallery, where the native drag handler is
   the thing everything else has to work around, and a plain
   pointer gesture is the same code in both hosts.

   It moves the same things the ↑↓ buttons move, through the same
   two primitives, so nothing here can invent an ordering the
   keyboard could not produce. A loose block and a whole group are
   the units of the top level; a member moves only within its own
   group. There is deliberately no drop position that would split a
   group or move a block across one: the insertion line simply is
   not offered there, and grouping stays a thing you say out loud
   through the picker or `g`.

   Positions are read once, when the drag starts, because nothing
   moves until the drop.
   ============================================================ */

let dragState = null;

function beginUnitDrag(e, node, unitIndex) {
  beginDrag(e, node, { mode: "unit", unitIndex: unitIndex });
}
function beginMemberDrag(e, node, group, memberIndex) {
  beginDrag(e, node, { mode: "member", group: group, memberIndex: memberIndex });
}

function beginDrag(e, node, info) {
  if (e.button !== 0 || ui.view !== "edit" || dragState) return;
  /* The head is full of controls; only the bare handle starts a drag. */
  if (e.target.closest("button, input, select, textarea, a")) return;
  if ($("#scrim").classList.contains("show")) return;
  /* Suppresses the text selection and the native image drag. It also
     suppresses the compatibility mousedown, which is what would normally move
     the focus ring here, so that is done by hand. */
  e.preventDefault();
  const blockId = node.getAttribute("data-block");
  if (blockId) setFocusBlock(blockId, false);
  dragState = {
    info, node, body: $("#stackBody"),
    startY: e.clientY, startX: e.clientX, lastY: e.clientY,
    active: false, slots: null, line: null, target: null, scroller: null,
  };
  window.addEventListener("pointermove", onDragMove, true);
  window.addEventListener("pointerup", onDragEnd, true);
  window.addEventListener("pointercancel", cancelDrag, true);
  window.addEventListener("keydown", onDragKey, true);
}

/* Every legal insertion point, as a y in the stack's own scrolled coordinate
   space and the index it would drop at. The indices are the *real* ones, taken
   off the rendered nodes, so a filtered view still moves things in the whole
   stack rather than in the slice on screen. */
function collectDropSlots(st) {
  const body = st.body;
  const bodyRect = body.getBoundingClientRect();
  const toContent = (clientY) => clientY - bodyRect.top + body.scrollTop;
  const attr = st.info.mode === "unit" ? "data-unit-index" : "data-member-index";
  const nodes = st.info.mode === "unit"
    ? $$("#stackBody > [data-unit-index]")
    : $$('.group[data-group="' + st.info.group.id + '"] > .gbody > [data-member-index]');
  if (!nodes.length) return null;
  const slots = [];
  let left = 0, width = 0;
  nodes.forEach((n) => {
    const r = n.getBoundingClientRect();
    left = r.left - bodyRect.left + body.scrollLeft;
    width = r.width;
    slots.push({ y: toContent(r.top), index: Number(n.getAttribute(attr)) });
  });
  const lastRect = nodes[nodes.length - 1].getBoundingClientRect();
  slots.push({
    y: toContent(lastRect.bottom),
    index: Number(nodes[nodes.length - 1].getAttribute(attr)) + 1,
  });
  return { slots, left, width, toContent };
}

function onDragMove(e) {
  const st = dragState;
  if (!st) return;
  st.lastY = e.clientY;
  if (!st.active) {
    if (Math.abs(e.clientY - st.startY) < 4 && Math.abs(e.clientX - st.startX) < 4) return;
    const geo = collectDropSlots(st);
    if (!geo) { cancelDrag(); return; }
    st.geo = geo;
    st.active = true;
    document.body.classList.add("dragging");
    st.node.classList.add("dragsrc");
    st.line = el("div", { class: "dropline" });
    st.line.style.left = geo.left + "px";
    st.line.style.width = geo.width + "px";
    st.body.appendChild(st.line);
    st.scroller = setInterval(() => edgeScroll(st), 40);
  }
  e.preventDefault();
  paintDropTarget(st);
}

/* Near the top or bottom edge the stack creeps, so a block can be dragged
   somewhere that was off screen when the drag began. */
function edgeScroll(st) {
  if (!st.active) return;
  const r = st.body.getBoundingClientRect();
  const margin = 44;
  let dy = 0;
  if (st.lastY < r.top + margin) dy = -Math.ceil((r.top + margin - st.lastY) / 4);
  else if (st.lastY > r.bottom - margin) dy = Math.ceil((st.lastY - (r.bottom - margin)) / 4);
  if (!dy) return;
  const before = st.body.scrollTop;
  st.body.scrollTop = Math.max(0, before + dy);
  if (st.body.scrollTop !== before) paintDropTarget(st);
}

function paintDropTarget(st) {
  const y = st.geo.toContent(st.lastY);
  let best = st.geo.slots[0];
  st.geo.slots.forEach((s) => { if (Math.abs(s.y - y) < Math.abs(best.y - y)) best = s; });
  st.target = best.index;
  st.line.style.top = best.y + "px";
}

function onDragKey(e) {
  if (e.key !== "Escape" || !dragState) return;
  e.preventDefault(); e.stopPropagation();
  cancelDrag();
}

function onDragEnd() {
  const st = dragState;
  if (!st) return;
  const info = st.info, target = st.target, moved = st.active;
  const blockId = st.node.getAttribute("data-block");
  cancelDrag();
  if (!moved || target === null || target === undefined) return;
  if (info.mode === "unit") moveUnitTo(info.unitIndex, target);
  else if (blockId) moveBlockWithinGroupTo(blockId, target);
}

function cancelDrag() {
  const st = dragState;
  if (!st) return;
  dragState = null;
  clearInterval(st.scroller);
  window.removeEventListener("pointermove", onDragMove, true);
  window.removeEventListener("pointerup", onDragEnd, true);
  window.removeEventListener("pointercancel", cancelDrag, true);
  window.removeEventListener("keydown", onDragKey, true);
  document.body.classList.remove("dragging");
  st.node.classList.remove("dragsrc");
  if (st.line) st.line.remove();
}

/* ============================================================
   7. Rendering — assembled output
   ============================================================ */

function renderOutput() {
  const host = $("#outText");
  invalidateDeps();
  const units = promptUnits();
  host.innerHTML = "";
  if (!units.length) {
    host.appendChild(el("div", { class: "placeholder", text: "Nothing to assemble yet. Write into a block, or un-mute one." }));
    $("#outStats").textContent = "";
    return;
  }
  units.forEach((u, i) => {
    /* One node per paragraph, and inside it one node per block, so a group's
       members read as continuous text while each still lights up on its own. */
    const para = el("span", { class: "seg", title: u.label }, []);
    if (u.kind === "group") para.setAttribute("data-group", u.id);
    if (u.heading) para.appendChild(el("span", { class: "segh", text: u.heading + "\n" }));
    u.parts.forEach((part, j) => {
      const piece = el("span", { class: "segpart", "data-block": part.blockId, title: part.label });
      /* One node per run, so a word that came from a bank is visibly a swap
         rather than something someone typed. */
      part.segs.forEach((sg) => {
        if (!sg.bankId) { piece.appendChild(document.createTextNode(sg.text)); return; }
        piece.appendChild(el("span", {
          class: "segbank", text: sg.text,
          title: sg.bankName + " → " + sg.text,
          "data-bank": sg.bankId,
        }));
      });
      piece.addEventListener("mouseenter", () => litBlock(part.blockId, true));
      piece.addEventListener("mouseleave", () => litBlock(part.blockId, false));
      para.appendChild(piece);
      if (j < u.parts.length - 1) para.appendChild(document.createTextNode(GROUP_JOIN));
    });
    if (i < units.length - 1) para.appendChild(document.createTextNode("\n\n"));
    host.appendChild(para);
  });
  const text = assemble();
  $("#outStats").innerHTML =
    "<b>" + countWords(text) + "</b> words · <b>" + text.length + "</b> ch · ~<b>" +
    Math.ceil(text.length / 4) + "</b> tok";
}

/* Hovering a block lights its slice of the prompt, and the reverse. A group's
   head lights the whole paragraph its members were folded into. */
function litSegment(blockId, on) {
  const n = $('#outText [data-block="' + blockId + '"]');
  if (n) n.classList.toggle("lit", on);
}
function litGroupSegment(groupId, on) {
  const n = $('#outText .seg[data-group="' + groupId + '"]');
  if (n) n.classList.toggle("lit", on);
}
function litBlock(blockId, on) {
  const n = $('#stackBody [data-block="' + blockId + '"]');
  if (n && n.classList.contains("block")) n.classList.toggle("lit", on);
}

function renderAll() {
  document.body.classList.toggle("rail-closed", !ui.railOpen);
  document.body.classList.toggle("out-closed", !ui.outputOpen);
  document.body.classList.toggle("dusk", !!ui.dusk);
  const p = project();
  if (!p.blocks.some((b) => b.id === ui.focusBlockId)) ui.focusBlockId = p.blocks.length ? p.blocks[0].id : null;
  renderRail();
  renderStack();
  renderOutput();
  save();
}

/* ============================================================
   8. Mutations
   ============================================================ */

function selectProject(id) {
  if (id === state.activeProjectId) return;
  state.activeProjectId = id;
  ui.focusBlockId = null;
  renderAll();
}

function newProject() {
  askText("New project", "Name this prompt", "Untitled prompt", (name) => {
    const p = makeProject(name, [makeBlock("Role", null), makeBlock("Task", null)]);
    state.projects.unshift(p);
    state.activeProjectId = p.id;
    ui.focusBlockId = null;
    renderAll();
    toast("Created “" + name + "”");
  });
}

function duplicateProject(id) {
  const src = state.projects.find((p) => p.id === id);
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid("p");
  copy.name = src.name + " copy";
  copy.createdAt = copy.updatedAt = now();
  /* Fresh ids throughout, and re-point actives/groups/takes at them. */
  const vmap = {}, bmap = {}, gmap = {}, amap = {};
  copy.groups = Array.isArray(copy.groups) ? copy.groups : [];
  copy.groups.forEach((g) => {
    const oldG = g.id; g.id = uid("g"); gmap[oldG] = g.id;
    g.variants.forEach((a) => { const oldA = a.id; a.id = uid("a"); amap[oldA] = a.id; });
    g.activeVariantId = amap[g.activeVariantId] || g.variants[0].id;
  });
  const smap = {}, kmap = {}, wmap = {};
  copy.banks = Array.isArray(copy.banks) ? copy.banks : [];
  copy.banks.forEach((k) => {
    const oldK = k.id; k.id = uid("k"); kmap[oldK] = k.id;
    k.words.forEach((w) => { const oldW = w.id; w.id = uid("w"); wmap[oldW] = w.id; });
    k.activeWordId = wmap[k.activeWordId] || k.words[0].id;
  });
  copy.blocks.forEach((b) => {
    const oldB = b.id; b.id = uid("b"); bmap[oldB] = b.id;
    b.variants.forEach((v) => {
      const oldV = v.id; v.id = uid("v"); vmap[oldV] = v.id;
      v.versions.forEach((sv) => { const oldS = sv.id; sv.id = uid("s"); smap[oldS] = sv.id; });
      v.activeVersionId = smap[v.activeVersionId] || v.versions[0].id;
    });
    b.activeVariantId = vmap[b.activeVariantId] || b.variants[0].id;
    b.compareId = b.compareId ? (vmap[b.compareId] || null) : null;
    b.groupId = b.groupId ? (gmap[b.groupId] || null) : null;
  });
  copy.groups.forEach((g) => g.variants.forEach((a) => {
    const picks = {};
    for (const k in a.picks) {
      const pick = a.picks[k];
      if (!bmap[k] || !pick || !vmap[pick.v]) continue;
      picks[bmap[k]] = { v: vmap[pick.v], ver: pick.ver ? (smap[pick.ver] || null) : null };
    }
    a.picks = picks;
    a.off = (a.off || []).map((k) => bmap[k]).filter(Boolean);
  }));
  /* Conditions point at ids too, and a copy has to depend on its own blocks
     rather than reaching back into the project it was copied from. */
  const condMaps = { b: bmap, v: vmap, s: smap, g: gmap, a: amap };
  conditionHosts(copy).forEach((item) => { item.conditions = remapConditions(item.conditions, condMaps); });
  copy.takes.forEach((t) => {
    t.id = uid("t");
    const blocks = {};
    for (const k in (t.blocks || {})) {
      if (!bmap[k]) continue;
      blocks[bmap[k]] = {
        v: vmap[t.blocks[k].v] || null,
        ver: t.blocks[k].ver ? (smap[t.blocks[k].ver] || null) : null,
        on: !!t.blocks[k].on,
      };
    }
    t.blocks = blocks;
    const groups = {};
    for (const k in (t.groups || {})) {
      if (!gmap[k]) continue;
      groups[gmap[k]] = { v: amap[t.groups[k].v] || null, on: !!t.groups[k].on };
    }
    t.groups = groups;
    const banks = {};
    for (const k in (t.banks || {})) {
      if (kmap[k] && wmap[t.banks[k]]) banks[kmap[k]] = wmap[t.banks[k]];
    }
    t.banks = banks;
  });
  state.projects.splice(state.projects.indexOf(src) + 1, 0, copy);
  state.activeProjectId = copy.id;
  renderAll();
  toast("Duplicated");
}

function deleteProject(id) {
  state.projects = state.projects.filter((p) => p.id !== id);
  if (!state.projects.length) state.projects.push(makeProject("Untitled prompt", null));
  if (!state.projects.some((p) => p.id === state.activeProjectId)) state.activeProjectId = state.projects[0].id;
  ui.focusBlockId = null;
  renderAll();
  toast("Deleted");
}

function addBlock(groupId) {
  const p = project();
  const b = makeBlock("New block", null);
  if (groupId && p.groups.some((g) => g.id === groupId)) {
    b.groupId = groupId;
    /* Land it at the end of its group's run rather than the end of the stack. */
    let last = -1;
    p.blocks.forEach((x, i) => { if (x.groupId === groupId) last = i; });
    p.blocks.splice(last + 1, 0, b);
  } else {
    p.blocks.push(b);
  }
  normalizeGroupOrder(p);
  ui.focusBlockId = b.id;
  touch(); renderAll();
  const node = $('#stackBody .block[data-block="' + b.id + '"]');
  if (node) { node.scrollIntoView({ block: "center" }); const inp = node.querySelector(".blocklabel"); if (inp) { inp.focus(); inp.select(); } }
}

function duplicateBlock(id) {
  const p = project();
  const src = blockById(id);
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid("b");
  copy.label = src.label + " copy";
  const vmap = {}, smap = {};
  copy.variants.forEach((v) => {
    const old = v.id; v.id = uid("v"); vmap[old] = v.id;
    v.versions.forEach((s) => { const oldS = s.id; s.id = uid("s"); smap[oldS] = s.id; });
    v.activeVersionId = smap[v.activeVersionId] || v.versions[0].id;
  });
  copy.activeVariantId = vmap[copy.activeVariantId] || copy.variants[0].id;
  copy.compareId = copy.compareId ? (vmap[copy.compareId] || null) : null;
  /* The copy's own conditions still point at the same *sources* — those blocks
     and groups are right where they were. Only the ids inside this block have
     moved, and nothing in a condition names them. */
  const selfMaps = { b: {}, v: {}, s: {}, g: {}, a: {} };
  conditionHosts({ blocks: [copy], groups: [] })
    .forEach((item) => { item.conditions = remapConditions(item.conditions, selfMaps); });
  p.blocks.splice(p.blocks.indexOf(src) + 1, 0, copy);
  ui.focusBlockId = copy.id;
  touch(); renderAll();
}

function deleteBlock(id) {
  const p = project();
  const b = blockById(id);
  if (!b) return;
  const run = () => {
    p.blocks = p.blocks.filter((x) => x.id !== id);
    if (!p.blocks.length) p.blocks.push(makeBlock("Section", null));
    p.takes.forEach((t) => { delete t.blocks[id]; });
    p.groups.forEach((g) => g.variants.forEach((a) => {
      delete a.picks[id];
      a.off = a.off.filter((x) => x !== id);
    }));
    /* A group that has lost its last member is not a group any more. */
    dropEmptyGroups(p);
    /* Conditions naming the block that just went are dropped rather than left
       to fail open forever — they would read as live rules in the dialog. */
    pruneConditionSources(p);
    ui.focusBlockId = p.blocks[0].id;
    touch(); renderAll();
  };
  const hasContent = b.variants.some((v) => v.versions.some((s) => s.text.trim()));
  if (hasContent) askConfirm("Delete block", "Delete “" + b.label + "” and its " + b.variants.length + " variants?", "Delete", run);
  else run();
}

/* Reordering happens between units, so a loose block steps over an entire
   group instead of landing inside it. */
function moveUnit(index, dir) {
  const p = project();
  const units = stackUnits(p);
  const j = index + dir;
  if (index < 0 || index >= units.length || j < 0 || j >= units.length) return;
  const [u] = units.splice(index, 1);
  units.splice(j, 0, u);
  p.blocks = units.flatMap((x) => (x.kind === "group" ? x.blocks : [x.block]));
  touch(); renderStack(); renderOutput();
}

function moveBlockWithinGroup(id, dir) {
  const p = project();
  const b = blockById(id);
  if (!b || !b.groupId) return;
  const run = p.blocks.filter((x) => x.groupId === b.groupId);
  const i = run.indexOf(b);
  const j = i + dir;
  if (j < 0 || j >= run.length) return;
  const start = p.blocks.indexOf(run[0]);
  run.splice(i, 1);
  run.splice(j, 0, b);
  p.blocks.splice(start, run.length, ...run);
  ui.focusBlockId = id;
  touch(); renderStack(); renderOutput();
}

/* The two the drop lands on. A slot index is where the item would be inserted
   *before* it is lifted out, so once it is out everything after it has shifted
   down by one and the target has to follow. */
function moveUnitTo(from, to) {
  const p = project();
  const units = stackUnits(p);
  if (from < 0 || from >= units.length) return;
  let target = to > from ? to - 1 : to;
  target = Math.max(0, Math.min(units.length - 1, target));
  if (target === from) return;
  const [u] = units.splice(from, 1);
  units.splice(target, 0, u);
  p.blocks = units.flatMap((x) => (x.kind === "group" ? x.blocks : [x.block]));
  normalizeGroupOrder(p);
  touch(); renderStack(); renderOutput();
}

function moveBlockWithinGroupTo(id, to) {
  const p = project();
  const b = blockById(id);
  if (!b || !b.groupId) return;
  const run = p.blocks.filter((x) => x.groupId === b.groupId);
  const i = run.indexOf(b);
  if (i < 0) return;
  let target = to > i ? to - 1 : to;
  target = Math.max(0, Math.min(run.length - 1, target));
  if (target === i) return;
  const start = p.blocks.indexOf(run[0]);
  run.splice(i, 1);
  run.splice(target, 0, b);
  p.blocks.splice(start, run.length, ...run);
  normalizeGroupOrder(p);
  ui.focusBlockId = id;
  touch(); renderStack(); renderOutput();
}

/* ---------- Groups ---------- */

function dropEmptyGroups(p) {
  const dead = p.groups.filter((g) => !p.blocks.some((b) => b.groupId === g.id)).map((g) => g.id);
  if (!dead.length) return;
  p.groups = p.groups.filter((g) => !dead.includes(g.id));
  p.takes.forEach((t) => dead.forEach((gid) => { delete t.groups[gid]; }));
  pruneConditionSources(p);
}

function newGroupFrom(blockId) {
  const p = project();
  const b = blockById(blockId);
  if (!b) return;
  askText("New group", "Name this group", "Group " + (p.groups.length + 1), (label) => {
    const g = makeGroup(label);
    p.groups.push(g);
    setBlockGroup(blockId, g.id, { silent: true });
    toast("“" + label + "” created — set other blocks to it to wire them in");
  });
}

/* Joining a group moves the block next to its group-mates: a group is one
   container on screen, so its members have to be a contiguous run. */
function setBlockGroup(blockId, groupId, opts) {
  const p = project();
  const b = blockById(blockId);
  if (!b || b.groupId === groupId) return;
  const from = b.groupId;

  if (from) {
    p.groups.forEach((g) => {
      if (g.id !== from) return;
      g.variants.forEach((a) => { delete a.picks[blockId]; a.off = a.off.filter((x) => x !== blockId); });
    });
  }
  b.groupId = groupId || null;

  if (groupId) {
    /* Sit at the end of the target group's run — but a group that has no
       members yet (one just made for this block) has no run to join, and the
       block should stay exactly where it is rather than jump to the top. */
    const at = p.blocks.indexOf(b);
    const others = p.blocks.filter((x) => x.id !== blockId);
    let last = -1;
    others.forEach((x, i) => { if (x.groupId === groupId) last = i; });
    others.splice(last < 0 ? at : last + 1, 0, b);
    p.blocks = others;
  }
  normalizeGroupOrder(p);
  dropEmptyGroups(p);
  ui.focusBlockId = blockId;
  touch(); renderAll();
  if (!opts || !opts.silent) {
    const g = groupById(groupId);
    toast(g ? "Wired “" + b.label + "” into “" + g.label + "”" : "“" + b.label + "” left its group");
  }
}

function toggleGroup(id) {
  const g = groupById(id);
  if (!g) return;
  g.enabled = !g.enabled;
  touch(); renderStack(); renderOutput(); renderRail();
}

/* Disbanding keeps every block and whatever it is currently showing; only the
   wiring goes. The arrangements go with it — they described this group. */
function disbandGroup(id) {
  const p = project();
  const g = groupById(id);
  if (!g) return;
  const run = () => {
    p.blocks.forEach((b) => { if (b.groupId === id) b.groupId = null; });
    p.groups = p.groups.filter((x) => x.id !== id);
    p.takes.forEach((t) => { delete t.groups[id]; });
    pruneConditionSources(p);
    touch(); renderAll();
    toast("Disbanded “" + g.label + "”");
  };
  if (g.variants.length > 1) {
    askConfirm("Disband group", "Disband “" + g.label + "”? Its " + g.variants.length +
      " arrangements are lost; the blocks stay exactly as they are now.", "Disband", run);
  } else run();
}

/* ---------- Arrangements (a group's own variants) ---------- */

function pickArrangement(groupId, arrangementId) {
  const g = groupById(groupId);
  if (!g || g.activeVariantId === arrangementId) return;
  /* touch() syncs the *active* arrangement from the members, so the switch has
     to happen first — otherwise the outgoing one is overwritten. */
  g.activeVariantId = arrangementId;
  applyArrangement(g);
  touch(); renderStack(); renderOutput(); renderRail();
}

function cycleArrangement(groupId, dir) {
  const g = groupById(groupId);
  if (!g || g.variants.length < 2) return;
  const i = g.variants.findIndex((a) => a.id === g.activeVariantId);
  const next = (i + dir + g.variants.length) % g.variants.length;
  pickArrangement(groupId, g.variants[next].id);
}

/* A new arrangement starts as a copy of how the group looks right now — the
   useful default, since you make one in order to vary from here. */
function addArrangement(groupId) {
  const g = groupById(groupId);
  if (!g) return;
  const src = activeArrangement(g);
  const a = makeArrangement(nextArrangementName(g, src ? src.name : "a"));
  a.picks = Object.assign({}, src ? src.picks : {});
  a.off = (src ? src.off : []).slice();
  g.variants.splice(g.variants.indexOf(src) + 1, 0, a);
  g.activeVariantId = a.id;
  touch(); renderStack(); renderOutput(); renderRail();
  const node = $('#stackBody .group[data-group="' + g.id + '"] .chip.arr.on .chipname');
  if (node) { node.focus(); node.select(); }
}

function nextArrangementName(g, name) {
  const base = String(name || "a").replace(/\s+\d+$/, "");
  let n = 2;
  const taken = new Set(g.variants.map((a) => a.name));
  while (taken.has(base + " " + n)) n++;
  return base + " " + n;
}
