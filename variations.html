function deleteArrangement(groupId, arrangementId) {
  const g = groupById(groupId);
  if (!g || g.variants.length < 2) return;
  const a = g.variants.find((x) => x.id === arrangementId);
  if (!a) return;
  const run = () => {
    const i = g.variants.indexOf(a);
    g.variants.splice(i, 1);
    project().takes.forEach((t) => {
      const rec = t.groups[groupId];
      if (rec && rec.v === arrangementId) rec.v = null;
    });
    if (g.activeVariantId === arrangementId) {
      g.activeVariantId = g.variants[Math.max(0, i - 1)].id;
      applyArrangement(g);
    }
    touch(); renderStack(); renderOutput(); renderRail();
  };
  askConfirm("Delete arrangement", "Delete “" + a.name + "”? The blocks stay; only this pairing of them goes.", "Delete", run);
}

function addVariant(blockId, fork) {
  const b = blockById(blockId);
  if (!b) return;
  const src = activeVariant(b);
  const base = fork ? variantText(src) : "";
  const name = fork ? nextForkName(b, src.name) : "v" + (b.variants.length + 1);
  const v = makeVariant(name, base);
  b.variants.splice(b.variants.indexOf(src) + 1, 0, v);
  b.activeVariantId = v.id;
  ui.focusBlockId = b.id;
  touch(); renderStack(); renderOutput(); renderRail();
  const ta = $('#stackBody .block[data-block="' + b.id + '"] .editor');
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

/* "tight" forks to "tight 2", then "tight 3"… */
function nextForkName(b, name) {
  const base = name.replace(/\s+\d+$/, "");
  let n = 2;
  const taken = new Set(b.variants.map((v) => v.name));
  while (taken.has(base + " " + n)) n++;
  return base + " " + n;
}

function deleteVariant(blockId, variantId) {
  const b = blockById(blockId);
  if (!b || b.variants.length < 2) return;
  const v = b.variants.find((x) => x.id === variantId);
  const run = () => {
    const i = b.variants.indexOf(v);
    b.variants.splice(i, 1);
    if (b.activeVariantId === variantId) b.activeVariantId = b.variants[Math.max(0, i - 1)].id;
    if (b.compareId === variantId) b.compareId = null;
    const p = project();
    p.takes.forEach((t) => {
      const rec = t.blocks[blockId];
      if (rec && rec.v === variantId) rec.v = b.activeVariantId;
    });
    /* Arrangements that pointed at the deleted variant fall back to whatever
       the block shows now, rather than silently dropping the member. */
    p.groups.forEach((g) => g.variants.forEach((a) => {
      const pick = a.picks[blockId];
      if (pick && pick.v === variantId) a.picks[blockId] = { v: b.activeVariantId, ver: null };
    }));
    touch(); renderStack(); renderOutput(); renderRail();
  };
  if (v.versions.some((s) => s.text.trim())) askConfirm("Delete variant", "Delete “" + v.name + "” and its " + v.versions.length + " version(s)? Other variants of this block stay.", "Delete", run);
  else run();
}

/* ---------- Versions (a variant's own variants) ---------- */

function variantIn(b, variantId) {
  return b ? b.variants.find((v) => v.id === variantId) || null : null;
}

function pickVersion(blockId, variantId, versionId) {
  const b = blockById(blockId);
  const v = variantIn(b, variantId);
  if (!v || v.activeVersionId === versionId) return;
  if (!v.versions.some((s) => s.id === versionId)) return;
  v.activeVersionId = versionId;
  v.updatedAt = now();
  ui.focusBlockId = blockId;
  touch(); renderStack(); renderOutput(); renderRail();
}

function cycleVersion(blockId, dir) {
  const b = blockById(blockId);
  const v = activeVariant(b);
  if (!v || v.versions.length < 2) return;
  const n = v.versions.length;
  const i = v.versions.findIndex((s) => s.id === v.activeVersionId);
  for (let step = 1; step <= n; step++) {
    const s = v.versions[(((i + dir * step) % n) + n) % n];
    if (!depOff(s)) { pickVersion(blockId, v.id, s.id); return; }
  }
}

function addVersion(blockId, variantId, fork) {
  const b = blockById(blockId);
  const v = variantIn(b, variantId);
  if (!v) return;
  const src = activeVersion(v);
  const s = makeVersion(
    fork ? nextVersionName(v, src ? src.name : "1") : String(v.versions.length + 1),
    fork && src ? src.text : "",
  );
  v.versions.splice(v.versions.indexOf(src) + 1, 0, s);
  v.activeVersionId = s.id;
  v.updatedAt = now();
  ui.focusBlockId = blockId;
  touch(); renderStack(); renderOutput(); renderRail();
  const ta = $('#stackBody .block[data-block="' + b.id + '"] .editor');
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

function nextVersionName(v, name) {
  const base = String(name || "1").replace(/\s+\d+$/, "");
  let n = 2;
  const taken = new Set(v.versions.map((s) => s.name));
  while (taken.has(base + " " + n)) n++;
  return base + " " + n;
}

function deleteVersion(blockId, variantId, versionId) {
  const b = blockById(blockId);
  const v = variantIn(b, variantId);
  if (!v || v.versions.length < 2) return;
  const s = v.versions.find((x) => x.id === versionId);
  if (!s) return;
  const run = () => {
    const i = v.versions.indexOf(s);
    v.versions.splice(i, 1);
    if (v.activeVersionId === versionId) v.activeVersionId = v.versions[Math.max(0, i - 1)].id;
    v.updatedAt = now();
    /* Snapshots that named this version fall back to "no opinion", which means
       the variant keeps whatever version it is on rather than being blanked. */
    const p = project();
    p.takes.forEach((t) => {
      const rec = t.blocks[blockId];
      if (rec && rec.ver === versionId) rec.ver = null;
    });
    p.groups.forEach((g) => g.variants.forEach((a) => {
      const pick = a.picks[blockId];
      if (pick && pick.ver === versionId) pick.ver = null;
    }));
    touch(); renderStack(); renderOutput(); renderRail();
  };
  if (s.text.trim()) {
    askConfirm("Delete version", "Delete version “" + s.name + "” of “" + v.name + "”? The variant's other versions stay.", "Delete", run);
  } else run();
}

function pickVariant(blockId, variantId) {
  const b = blockById(blockId);
  if (!b || b.activeVariantId === variantId) return;
  b.activeVariantId = variantId;
  if (b.compareId === variantId) b.compareId = null;
  ui.focusBlockId = blockId;
  touch(); renderStack(); renderOutput(); renderRail();
}

/* Cycling steps over anything a condition has switched off, the way it steps
   over a chip that is not on screen — the keys move between the variants you
   could have clicked. */
function cycleVariant(blockId, dir) {
  const b = blockById(blockId);
  if (!b || b.variants.length < 2) return;
  const n = b.variants.length;
  const i = b.variants.findIndex((v) => v.id === b.activeVariantId);
  for (let step = 1; step <= n; step++) {
    const v = b.variants[(((i + dir * step) % n) + n) % n];
    if (!depOff(v)) { pickVariant(blockId, v.id); return; }
  }
}

function pickVariantByIndex(blockId, index) {
  const b = blockById(blockId);
  if (!b || !b.variants[index]) return;
  if (depOff(b.variants[index])) { toast("A dependency is holding that variant off"); return; }
  pickVariant(blockId, b.variants[index].id);
}

/* Shuffle rolls the groups first and lets their arrangements land, then rolls
   whatever is still loose — otherwise the arrangement would immediately
   overwrite the members it had just randomised. */
function shuffleMix() {
  const p = project();
  invalidateDeps();
  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  p.groups.forEach((g) => {
    g.activeVariantId = pick(g.variants).id;
    applyArrangement(g);
  });
  p.blocks.forEach((b) => {
    if (b.groupId) return;
    /* Rolling a variant a condition has switched off would land the block on
       something it cannot show, so the roll is over what is available. */
    const open = b.variants.filter((v) => !depOff(v));
    b.activeVariantId = pick(open.length ? open : b.variants).id;
  });
  touch(); renderStack(); renderOutput(); renderRail();
  toast("Shuffled");
}

function setView(v) { ui.view = v; save(); renderStack(); }

function setFocusBlock(id, scroll) {
  if (ui.focusBlockId === id) return;
  const prev = ui.focusBlockId;
  ui.focusBlockId = id;
  save();
  /* Cheap: just move the marker classes rather than rebuilding the stack. */
  $$('#stackBody [data-block]').forEach((n) => {
    if (!n.classList.contains("block") && !n.classList.contains("mixrow")) return;
    n.classList.toggle("focused", n.getAttribute("data-block") === id);
  });
  if (scroll) {
    const n = $('#stackBody [data-block="' + id + '"]');
    if (n) n.scrollIntoView({ block: "nearest" });
  }
  void prev;
}

/* ---------- Takes ----------
   A take records the whole rig, not just the picks: every block's variant
   *and* whether it was on, every group's arrangement *and* whether it was on.

   The rule for anything a take never saw — a block or group added after it
   was saved — is that it is off. A snapshot can only vouch for what existed
   when it was taken, and silently switching on a block written weeks later
   would put text into the prompt that the take never approved.

   One deliberate exception, at the group level. Grouping two blocks that an
   older take had on would otherwise hide them both, because the group the
   take never saw would come back off. So an unknown *group* takes its state
   from its members: on if the take had any of them on. Nothing the take
   actually said is contradicted, and nothing appears that it had off. */

function resolveTake(t, p) {
  const blocks = {}, groups = {}, banks = {};
  p.blocks.forEach((b) => {
    const r = t.blocks ? t.blocks[b.id] : null;
    const variant = (r && r.v && b.variants.some((v) => v.id === r.v))
      ? b.variants.find((v) => v.id === r.v)
      : activeVariant(b);
    blocks[b.id] = {
      known: !!r,
      on: !!(r && r.on),
      v: variant ? variant.id : null,
      /* A take from before versions existed, or one whose version has since
         been deleted, has no opinion: the variant keeps the version it is on. */
      ver: (r && r.ver && variant && variant.versions.some((s) => s.id === r.ver))
        ? r.ver
        : (variant ? variant.activeVersionId : null),
    };
  });
  p.groups.forEach((g) => {
    const r = t.groups ? t.groups[g.id] : null;
    groups[g.id] = {
      known: !!r,
      on: r ? !!r.on : p.blocks.some((b) => b.groupId === g.id && blocks[b.id] && blocks[b.id].on),
      v: (r && r.v && g.variants.some((a) => a.id === r.v)) ? r.v : g.activeVariantId,
    };
  });
  /* Banks have no on/off, so the "absent means off" rule cannot apply to them.
     A bank the take never saw simply keeps its current word. */
  (p.banks || []).forEach((k) => {
    const wid = t.banks ? t.banks[k.id] : null;
    const known = !!(wid && k.words.some((w) => w.id === wid));
    banks[k.id] = { known, w: known ? wid : k.activeWordId };
  });
  return { blocks, groups, banks };
}

/* Two states are the same take only if every switch and every pick agrees —
   including the groups, so muting a group alone breaks the match. */
function signatureFrom(p, res) {
  return p.blocks.map((b) => {
    const r = res.blocks[b.id];
    return b.id + ":" + (r.on ? r.v + "/" + r.ver : "off");
  }).join("|") +
    " || " + p.groups.map((g) => g.id + ":" + (res.groups[g.id].on ? res.groups[g.id].v : "off")).join("|") +
    " || " + (p.banks || []).map((k) => k.id + ":" + res.banks[k.id].w).join("|");
}

function currentSignature() {
  const p = project();
  const res = { blocks: {}, groups: {}, banks: {} };
  p.blocks.forEach((b) => {
    const v = activeVariant(b);
    res.blocks[b.id] = { on: b.enabled, v: b.activeVariantId, ver: v ? v.activeVersionId : null };
  });
  p.groups.forEach((g) => { res.groups[g.id] = { on: g.enabled, v: g.activeVariantId }; });
  (p.banks || []).forEach((k) => { res.banks[k.id] = { w: k.activeWordId }; });
  return signatureFrom(p, res);
}

function takeSignature(t) {
  const p = project();
  return signatureFrom(p, resolveTake(t, p));
}

function captureTakeState(p) {
  const blocks = {}, groups = {}, banks = {};
  p.blocks.forEach((b) => {
    const v = activeVariant(b);
    blocks[b.id] = { v: b.activeVariantId, ver: v ? v.activeVersionId : null, on: !!b.enabled };
  });
  p.groups.forEach((g) => { groups[g.id] = { v: g.activeVariantId, on: !!g.enabled }; });
  (p.banks || []).forEach((k) => { banks[k.id] = k.activeWordId; });
  return { blocks, groups, banks };
}

function saveTake() {
  const p = project();
  const suggested = "Take " + (p.takes.length + 1);
  askText("Save take", "Name this combination", suggested, (name) => {
    const snap = captureTakeState(p);
    p.takes.unshift({ id: uid("t"), name, createdAt: now(), blocks: snap.blocks, groups: snap.groups, banks: snap.banks });
    touch(); renderRail();
    toast("Saved “" + name + "”");
  });
}

function updateTake(id) {
  const p = project();
  const t = p.takes.find((x) => x.id === id);
  if (!t) return;
  const snap = captureTakeState(p);
  t.blocks = snap.blocks;
  t.groups = snap.groups;
  t.banks = snap.banks;
  touch(); renderRail();
  toast("Updated “" + t.name + "”");
}

function applyTake(id) {
  const p = project();
  const t = p.takes.find((x) => x.id === id);
  if (!t) return;
  const res = resolveTake(t, p);
  p.groups.forEach((g) => {
    const r = res.groups[g.id];
    g.enabled = r.on;
    g.activeVariantId = r.v;
  });
  /* Blocks are restored *after* the groups, and literally: the take's own
     record wins over what the arrangement would have replayed. The two agree
     whenever the take was saved from a settled state, and where an
     arrangement has been redefined since, what the user asked for back is the
     take. touch() then writes that restored state into the active
     arrangements, so a group never sits half-way between two definitions. */
  p.blocks.forEach((b) => {
    const r = res.blocks[b.id];
    b.enabled = r.on;
    if (r.v && b.variants.some((v) => v.id === r.v)) b.activeVariantId = r.v;
    const variant = activeVariant(b);
    if (variant && r.ver && variant.versions.some((s) => s.id === r.ver)) {
      variant.activeVersionId = r.ver;
    }
  });
  (p.banks || []).forEach((k) => {
    const r = res.banks[k.id];
    if (r && r.w && k.words.some((w) => w.id === r.w)) k.activeWordId = r.w;
  });
  touch(); renderStack(); renderOutput(); renderRail();

  const unseen = p.blocks.filter((b) => !res.blocks[b.id].known).length;
  toast("“" + t.name + "”" + (unseen ? " · " + unseen + " newer block" + (unseen > 1 ? "s" : "") + " left off" : ""));
}

/* ---------- Clipboard, import, export ---------- */

async function copyText(text, msg) {
  if (!text.trim()) { toast("Nothing to copy"); return; }
  try {
    await navigator.clipboard.writeText(text);
    toast(msg || "Copied");
  } catch (e) {
    /* Clipboard API needs a secure context; fall back to a scratch textarea. */
    const ta = el("textarea", { style: "position:fixed;opacity:0;left:-9999px" });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
    toast(ok ? (msg || "Copied") : "Copy blocked by the browser");
  }
}

/* Export takes a copy out; it never changes where the live document is kept.
   The two hosts need different mechanics for the same act: an anchor with a
   blob URL is how a browser saves a file, but a WKWebView has no download UI to
   drive, so in the app the bytes go through the same native
   `write_download_file` the gallery already uses for its own exports (it
   sanitizes the name and avoids collisions, Finder-style). */
function exportFileName() {
  return "variations-" + new Date().toISOString().slice(0, 10) + ".json";
}

function exportJson() {
  const json = JSON.stringify(state, null, 2);
  const name = exportFileName();

  if (isApp()) {
    HOST.invoke("write_download_file", {
      fileName: name,
      bytes: Array.from(new TextEncoder().encode(json)),
    })
      .then((path) => toast("Exported to " + String(path || name)))
      .catch((e) => toast("Export failed: " + e));
    return;
  }

  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Exported");
}

function importJson(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(String(reader.result)); }
    catch (e) { toast("That file is not valid JSON"); return; }
    const incoming = parsed && Array.isArray(parsed.projects) ? parsed.projects
                   : (parsed && parsed.blocks ? [parsed] : null);
    if (!incoming || !incoming.length) { toast("No projects found in that file"); return; }
    /* Import adds; it never replaces what is already here. */
    const merged = normalize({ projects: incoming, activeProjectId: null });
    merged.projects.forEach((p) => { p.id = uid("p"); state.projects.unshift(p); });
    state.activeProjectId = state.projects[0].id;
    ui.focusBlockId = null;
    renderAll();
    /* renderAll only schedules the debounced write. An import is a large,
       deliberate change, so put it on disk now — in the app that means the
       library's metadata folder, the same place every other edit lands. */
    flushSave();
    toast("Imported " + merged.projects.length + " project" + (merged.projects.length > 1 ? "s" : ""));
  };
  reader.readAsText(file);
}

/* ============================================================
   9. Keyboard
   ============================================================ */

function isTyping(e) {
  const t = e.target;
  return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
}

function focusedBlock() {
  const p = project();
  return p.blocks.find((b) => b.id === ui.focusBlockId) || visibleBlocks()[0] || p.blocks[0] || null;
}

/* The cursor walks what is drawn. With a filter up that is the matches; with a
   dependency holding something back it is what is left — in both cases the
   keys move between the cards you can actually see. */
function moveFocus(dir) {
  const list = visibleBlocks();
  if (!list.length) return;
  const i = list.findIndex((b) => b.id === ui.focusBlockId);
  if (i < 0) { setFocusBlock(list[0].id, true); return; }
  const next = Math.max(0, Math.min(list.length - 1, i + dir));
  setFocusBlock(list[next].id, true);
}

/* ⌘F from anywhere. The field is in the pane header rather than the stack, so
   it is there to be typed into whatever the stack is scrolled to. */
function focusSearch() {
  const input = $("#searchInput");
  if (!input) return;
  input.focus();
  input.select();
}

function clearSearch(refocus) {
  const input = $("#searchInput");
  if (input) { input.value = ""; if (refocus === false) input.blur(); }
  if (!ui.searchQuery) return;
  ui.searchQuery = "";
  renderStack();
  const list = visibleBlocks();
  if (list.length && !list.some((b) => b.id === ui.focusBlockId)) setFocusBlock(list[0].id, true);
}

/* The app's binding for this window, forwarded by Rust.
   Matched exactly the way embedded-inject.js matches Grok's and Claude's, off
   e.code rather than the produced character, so a binding set on one keyboard
   layout still matches on another. This webview has focus whenever it is up, so
   the main window never sees the key — the page has to close itself. */
function parseCloseKey(spec) {
  if (!spec || typeof spec !== "string") return null;
  const out = { cmd: false, ctrl: false, alt: false, shift: false, base: "" };
  for (const part of spec.split("+").filter(Boolean)) {
    const lower = part.toLowerCase();
    if (lower === "cmd" || lower === "meta") out.cmd = true;
    else if (lower === "ctrl" || lower === "control") out.ctrl = true;
    else if (lower === "alt" || lower === "option") out.alt = true;
    else if (lower === "shift") out.shift = true;
    else out.base = lower;
  }
  return out.base ? out : null;
}

function baseKeyForEvent(e) {
  const code = e.code || "";
  if (/^Key[A-Z]$/.test(code)) return code.slice(3).toLowerCase();
  if (/^Digit[0-9]$/.test(code)) return code.slice(5);
  if (code === "Space") return "Space";
  if (code === "Escape") return "Escape";
  const key = e.key || "";
  return key.length === 1 ? key.toLowerCase() : key;
}

function matchesCloseKey(e) {
  const spec = parseCloseKey(window.__lgVariationsCloseKey);
  if (!spec) return false;
  if (!!e.metaKey !== spec.cmd) return false;
  if (!!e.ctrlKey !== spec.ctrl) return false;
  if (!!e.altKey !== spec.alt) return false;
  if (!!e.shiftKey !== spec.shift) return false;
  return baseKeyForEvent(e).toLowerCase() === spec.base;
}

/* Closing only means anything in the app; in a browser tab this is a no-op. */
function closeWindow() {
  if (!isApp()) return false;
  flushSave();
  HOST.invoke("close_variations_window").catch(() => { /* already gone */ });
  return true;
}

document.addEventListener("keydown", (e) => {
  const meta = e.metaKey || e.ctrlKey;

  // Before anything else, so the toggle always gets you back out.
  if (isApp() && matchesCloseKey(e)) {
    e.preventDefault(); e.stopPropagation();
    closeWindow();
    return;
  }

  if (e.key === "Escape") {
    if ($("#scrim").classList.contains("show")) { closeDialog(); e.preventDefault(); return; }
    /* In the filter field Escape means "give me the stack back", not "leave
       the field with the stack still cut down to a dozen rows". */
    if (e.target && e.target.id === "searchInput") {
      e.preventDefault();
      if (ui.searchQuery) clearSearch(false); else e.target.blur();
      return;
    }
    if (isTyping(e)) { e.target.blur(); e.preventDefault(); return; }
    // Nothing left to back out of, so Esc leaves the window — same as Grok
    // and Claude.
    if (isApp()) { e.preventDefault(); closeWindow(); }
    return;
  }

  /* Copy the whole assembled prompt from anywhere. */
  if (meta && e.shiftKey && (e.key === "c" || e.key === "C")) {
    e.preventDefault(); copyText(assemble(), "Prompt copied"); return;
  }
  if (meta && (e.key === "e" || e.key === "E")) { e.preventDefault(); exportJson(); return; }
  if (meta && (e.key === "f" || e.key === "F") && !$("#scrim").classList.contains("show")) {
    e.preventDefault(); focusSearch(); return;
  }

  if (isTyping(e) || $("#scrim").classList.contains("show")) return;

  const b = focusedBlock();

  switch (e.key) {
    case "j": case "ArrowDown": e.preventDefault(); moveFocus(1); return;
    case "k": case "ArrowUp":   e.preventDefault(); moveFocus(-1); return;
    case "h": case "ArrowLeft": if (b) { e.preventDefault(); cycleVariant(b.id, -1); } return;
    case "l": case "ArrowRight":if (b) { e.preventDefault(); cycleVariant(b.id, 1); } return;
    case " ": if (b) { e.preventDefault(); b.enabled = !b.enabled; touch(); renderStack(); renderOutput(); renderRail(); } return;
    case "m": e.preventDefault(); setView(ui.view === "mixer" ? "edit" : "mixer"); return;
    case "g": if (b) { e.preventDefault(); blockGroupMenu(b); } return;
    case "G": if (b) { e.preventDefault(); const g = groupOf(b); if (g) toggleGroup(g.id); else toast("“" + b.label + "” is not in a group"); } return;
    /* Versions sit one level below variants, so they get the keys next to the
       ones that cycle variants. */
    case ",": if (b) { e.preventDefault(); cycleVersion(b.id, -1); } return;
    case ".": if (b) { e.preventDefault(); cycleVersion(b.id, 1); } return;
    case "[": case "]": {
      if (!b) return;
      e.preventDefault();
      const g = groupOf(b);
      if (!g) { toast("“" + b.label + "” is not in a group"); return; }
      cycleArrangement(g.id, e.key === "[" ? -1 : 1);
      return;
    }
    case "d": if (b) { e.preventDefault(); openDependsDialog({ kind: "block", block: b }); } return;
    case "n": if (b) { e.preventDefault(); addVariant(b.id, false); } return;
    case "f": if (b) { e.preventDefault(); addVariant(b.id, true); } return;
    case "s": e.preventDefault(); saveTake(); return;
    case "?": e.preventDefault(); showHelp(); return;
    case "e": {
      if (!b) return;
      e.preventDefault();
      if (ui.view !== "edit") { setView("edit"); }
      const ta = $('#stackBody .block[data-block="' + b.id + '"] .editor');
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      return;
    }
  }

  if (/^[1-9]$/.test(e.key) && b) { e.preventDefault(); pickVariantByIndex(b.id, Number(e.key) - 1); }
});

/* ============================================================
   10. Help
   ============================================================ */

function showHelp() {
  $("#dlgTitle").textContent = "Variations";
  $("#dlgBody").innerHTML = `
    <h3>All the versions, at once</h3>
    <p>A <b>project</b> is one prompt. A prompt is a stack of <b>blocks</b> — Role, Task, Tone,
    whatever you like. Each block holds as many <b>variants</b> as you want, and they all stay
    on the table: nothing is buried in history. Switching a block swaps that part of the prompt
    instantly. A <b>take</b> saves the whole combination so you can jump back to it in one click.</p>
    <h4>Versions inside variants</h4>
    <p>A variant is a slot, not a leaf. Each one holds <b>versions</b>, and the text lives on the
    version, so “concise” can keep three degrees of concise without spending three variant slots
    on a single idea. The open variant's versions sit in the mustard row under the chips; a variant
    holding more than one shows a small count so it never hides its depth. Arrangements and takes
    both record the version alongside the variant.</p>
    <h4>Word banks</h4>
    <p>A <b>word bank</b> is one named swap shared by the whole project. Name it in capitals with
    underscores, give it as many words as you like, and pick one. Then write the name straight into
    any block: <code>Explain this to AUDIENCE.</code> The assembled prompt gets the selected word,
    and the substituted run is underlined in the Assembled pane so you can see what came from where.
    The naming rule is the whole trick — SCREAMING_SNAKE never turns up by accident, so there is no
    escaping syntax to learn. Renaming a bank rewrites every mention for you. A bank you have not
    filled in leaves its own name in the prompt rather than quietly deleting itself, and one that
    nothing mentions is struck through in the rail.</p>
    <h4>Notes that never ship</h4>
    <p>A line starting with <code>//</code> is a <b>note</b>: it lives in the text, right next to the
    sentence it is about, and it is taken out before the prompt is assembled, before the banks are
    substituted and before every count you see. A line that is only <code>//</code> opens a note that
    runs until the next line that is only <code>//</code>, so a paragraph of commentary needs one
    marker, not one per line. Notes are banded in the editor, they travel with a fork, a duplicate
    and an export, and they show up in the word diff — the annotation is part of what changed.</p>
    <h4>Finding things</h4>
    <p><kbd>⌘F</kbd> puts the cursor in the <b>filter</b> in the Composer's title bar. It matches
    block labels, variant and version names, the text of every version, group labels, arrangement
    names and word banks — by the name you write into a block or by any word the bank holds. The
    stack narrows as you type, chips narrow to the variants that matched, and the count reads
    “3 of 47”. It is a view and only a view: switching variants, muting blocks and saving a take
    while it is up all act on the whole project, and the Assembled pane always shows the whole
    prompt. <kbd>esc</kbd> in the field gives the stack back.</p>
    <h4>Dragging</h4>
    <p>Blocks are dragged by their number and groups by their header bar. A loose block and a whole
    group are the units of the stack, so a block hops over a group rather than landing inside it;
    a member is dragged within its own group and cannot leave it. Grouping stays something you say
    out loud, through the footer's picker or <kbd>g</kbd>. The ↑↓ buttons still do the same moves.</p>
    <h4>Dependencies</h4>
    <p>A block, a variant, a version or a group can say it only makes sense when something else is
    in a particular state — press <kbd>d</kbd>, or use <i>Depends…</i> in the footer. Pick what it
    depends on and which states of that thing will do; there is nothing else to choose, because a
    condition that fails does exactly one thing. It <b>holds the item off</b>: it stays exactly
    where it is, struck through, with its switch locked and the reason written on it, and it takes
    no part in the prompt. It is never taken out of the stack — a section you cannot see is a
    section you cannot switch back on, and the way back would be the very thing that vanished.</p>
    <p>Nothing is rewritten either: its switch, its variant and its version are all waiting where
    you left them, and they come straight back when the condition passes. Delete the block a
    condition points at and the condition simply stops applying, so nothing can be left stuck off
    behind a controller that no longer exists.</p>
    <p>Conditions sit on top of everything else rather than inside it. An arrangement may still name
    a variant a condition is currently holding off, and a take may still restore one — the stored
    choice is kept as it was, and the moment the condition passes it is showing again. If the
    variant a block is set to is held off, the block falls back to the first one still available and
    says so, rather than silently emitting nothing.</p>
    <h4>Groups and arrangements</h4>
    <p>Blocks that belong together can be wired into a <b>group</b> — pick one from the block's
    footer, or press <kbd>g</kbd>. A group has its own switch, so its blocks mute and unmute as
    one, and its own variants, called <b>arrangements</b>: an arrangement remembers which members
    are on and which variant each of them is showing. So a group of three blocks can have a
    <i>house</i> arrangement and an <i>unsparing</i> one and you flip between whole passages of
    the prompt at a stroke.</p>
    <p>Arrangements stay live, the way block variants do: whatever the members are doing now <i>is</i>
    what the active arrangement means, so there is never a stale copy to update. A block added to
    the group appears in the arrangement you were on and starts off in the others — the same rule
    takes use.</p>
    <p>A group is one passage, so its blocks run together into a <b>single paragraph</b> in the
    assembled prompt instead of being held apart by a blank line. Hovering the group's header
    lights that whole paragraph; hovering one member lights just its share of it. With
    <i>Emit labels</i> on, the group writes one heading of its own over the paragraph rather than
    a heading per member, which would only split it up again.</p>
    <h4>What a take remembers</h4>
    <p>A take snapshots the whole rig: each block's variant <i>and</i> whether it was on, each
    group's arrangement <i>and</i> whether it was on. Anything the take never saw — a block or
    group made after it was saved — comes back <b>off</b>, because a snapshot cannot vouch for
    text it never approved. The one exception is a group wrapped around blocks an older take
    already had on: that group comes back on, so the take still shows what it always showed.</p>
    <h4>Keys — when you are not typing</h4>
    <table class="keytable">
      <tr><td><kbd>j</kbd> <kbd>k</kbd> / <kbd>↓</kbd> <kbd>↑</kbd></td><td>Move between blocks</td></tr>
      <tr><td><kbd>h</kbd> <kbd>l</kbd> / <kbd>←</kbd> <kbd>→</kbd></td><td>Cycle the focused block's variant</td></tr>
      <tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>Jump straight to a variant</td></tr>
      <tr><td><kbd>,</kbd> <kbd>.</kbd></td><td>Cycle the versions inside that variant</td></tr>
      <tr><td><kbd>space</kbd></td><td>Mute or include the block</td></tr>
      <tr><td><kbd>g</kbd> / <kbd>⇧G</kbd></td><td>Group this block · mute or include its whole group</td></tr>
      <tr><td><kbd>[</kbd> <kbd>]</kbd></td><td>Cycle its group's arrangement</td></tr>
      <tr><td><kbd>e</kbd></td><td>Edit the active variant's text</td></tr>
      <tr><td><kbd>d</kbd></td><td>Conditions on this block, variant or version</td></tr>
      <tr><td><kbd>n</kbd> / <kbd>f</kbd></td><td>New empty variant / fork the current one</td></tr>
      <tr><td><kbd>m</kbd></td><td>Toggle Mixer view</td></tr>
      <tr><td><kbd>s</kbd></td><td>Snapshot this combination as a take</td></tr>
      <tr><td><kbd>esc</kbd></td><td>Leave the text field</td></tr>
    </table>
    <h4>Anywhere</h4>
    <table class="keytable">
      <tr><td><kbd>⌘F</kbd></td><td>Filter the stack</td></tr>
      <tr><td><kbd>⌘⇧C</kbd></td><td>Copy the assembled prompt</td></tr>
      <tr><td><kbd>⌘E</kbd></td><td>Export everything as JSON</td></tr>
    </table>
    <h4>Two things worth knowing</h4>
    <p>Shift-click a chip (or use <i>Compare with…</i>) to word-diff it against the active variant —
    useful when two phrasings differ by a sentence.</p>
    ${isApp()
      ? '<p>Everything here saves itself into this library\'s metadata folder, at ' +
        '<code>' + esc(HOST.file) + '</code>, so it travels with the library. Import and Export ' +
        'move documents in and out of that file — an import merges in and is written straight ' +
        'back, an export drops a copy in your Downloads folder. Esc or the Variations key closes ' +
        'this window.</p>'
      : "<p>Everything lives in this browser's local storage, and Export writes a JSON file you " +
        "can keep or move. Opened inside Local Gallery, this same page keeps its document in the " +
        "library's metadata folder instead, with Import and Export working the same way.</p>"}`;
  $("#dlgFoot").innerHTML = "";
  $("#dlgFoot").append(el("button", { class: "btn primary", text: "Close", onclick: closeDialog }));
  $("#scrim").classList.add("show");
}

/* ============================================================
   11. Wiring
   ============================================================ */

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-cmd]");
  if (!btn) return;
  const cmd = btn.getAttribute("data-cmd");
  if (cmd === "new-project") newProject();
  else if (cmd === "toggle-rail") { ui.railOpen = !ui.railOpen; save(); renderAll(); }
  else if (cmd === "toggle-output") { ui.outputOpen = !ui.outputOpen; save(); renderAll(); }
  else if (cmd === "import") $("#fileInput").click();
  else if (cmd === "export") exportJson();
  else if (cmd === "dusk") { ui.dusk = !ui.dusk; save(); document.body.classList.toggle("dusk", ui.dusk); }
  else if (cmd === "help") showHelp();
  else if (cmd === "copy") copyText(assemble(), "Prompt copied");
  else if (cmd === "save-take") saveTake();
  else if (cmd === "new-bank") newBank();
  else if (cmd === "close-window") closeWindow();
});

$("#scrim").addEventListener("mousedown", (e) => { if (e.target.id === "scrim") closeDialog(); });

$("#searchInput").addEventListener("input", (e) => setSearchQuery(e.target.value));
$("#searchClear").addEventListener("click", () => { clearSearch(true); focusSearch(); });

$("#fileInput").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) importJson(f);
  e.target.value = "";
});

function tickClock() {
  const d = new Date();
  let h = d.getHours(); const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  $("#clock").textContent = h + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ampm;
}

window.addEventListener("resize", () => {
  growEditors($("#stackBody"));
});

/* Import and Export stay available in both worlds. They move documents in and
   out; they are not what decides where this one lives. In the app that is
   always the library's metadata folder — an import merges into the document and
   is saved straight back there, and an export is a copy taken out of it, so
   neither can quietly relocate the working data.

   The app gets one extra item, a Close: the toggle key and Esc both work, but a
   visible way out is worth a slot in the menu bar. */
function applyHostChrome() {
  if (isApp() && !$('#menubar [data-cmd="close-window"]')) {
    const close = el("button", { class: "menuitem", "data-cmd": "close-window", text: "Close" });
    $("#menubar .spacer").before(close);
  }
  if (HOST.note) $("#clock").before(el("span", { class: "clock", text: HOST.note, title: HOST.note }));
}

async function boot() {
  await load();
  applyHostChrome();
  /* Belt as well as braces: the field starts empty however the browser feels
     about restoring it. */
  $("#searchInput").value = "";
  renderAll();
  tickClock();
  setInterval(tickClock, 20000);
}

boot().catch((e) => {
  console.error("Variations failed to start:", e);
  /* Never leave a blank window: fall back to a fresh document. */
  if (!state) { state = seedState(); renderAll(); }
});

/* A hand-off for the console, and for anything that wants to poke at it. */
window.Variations = {
  get state() { return state; },
  get host() { return HOST; },
  assemble, save, renderAll,
};
</script>
