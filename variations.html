    el("button", { class: "btn primary", text: "New group…", onclick: () => { closeDialog(); newGroupFrom(b.id); } }),
  ].filter(Boolean));
  $("#scrim").classList.add("show");
}

/* ============================================================
   6. Rendering — the stack (edit view and mixer view)
   ============================================================ */

function renderStack() {
  const body = $("#stackBody");
  const scroll = body.scrollTop;
  body.innerHTML = "";
  const p = project();

  /* Toolbar */
  const nameInput = el("input", { class: "ghost-field projname", value: p.name, spellcheck: "false", "aria-label": "Project name" });
  nameInput.addEventListener("input", () => { p.name = nameInput.value; touch(); renderRail(); });

  const seg = el("div", { class: "segbtn" }, [
    el("button", { class: ui.view === "edit" ? "on" : "", text: "Edit", onclick: () => setView("edit") }),
    el("button", { class: ui.view === "mixer" ? "on" : "", text: "Mixer", onclick: () => setView("mixer") }),
  ]);

  const labelsToggle = el("label", { class: "togline" }, [
    el("input", { type: "checkbox", checked: p.includeLabels, onchange: (e) => { p.includeLabels = e.target.checked; touch(); renderOutput(); } }),
    el("span", { text: "Emit labels" }),
  ]);

  body.appendChild(el("div", { class: "stack-toolbar" }, [
    nameInput, seg, labelsToggle,
    el("button", { class: "btn tiny", text: "Shuffle", title: "Random combination", onclick: shuffleMix }),
    el("button", { class: "btn tiny", text: "Snapshot", title: "Save this combination as a take", onclick: saveTake }),
  ]));

  const units = stackUnits(p);
  if (ui.view === "mixer") body.appendChild(renderMixer(p, units));
  else units.forEach((u, i) => {
    body.appendChild(u.kind === "group" ? renderGroup(u, i, units.length, p)
                                        : renderBlock(u.block, p, { unitIndex: i, unitCount: units.length }));
  });

  body.appendChild(el("button", { class: "addblock", text: "+  Add a block", onclick: addBlock }));
  /* Height first, then scroll — see growEditors. */
  growEditors(body);
  body.scrollTop = scroll;

  const arrs = p.groups.reduce((n, g) => n + g.variants.length, 0);
  $("#stackHint").textContent = p.blocks.length + " blocks · " +
    p.blocks.reduce((n, b) => n + b.variants.length, 0) + " variants" +
    (p.groups.length ? " · " + p.groups.length + (p.groups.length > 1 ? " groups · " : " group · ") +
      arrs + (arrs > 1 ? " arrangements" : " arrangement") : "");
}

/* ---------- A group container ---------- */

/* The bookmark's two pieces. The tail is drawn as a stroked path rather than
   clipped shapes so the ink stays an even band through the fork; it is a fixed
   size, and the body above it is what stretches to the group's height. */
const GROUP_TAIL_SVG =
  '<svg viewBox="0 0 13 15" aria-hidden="true" focusable="false">' +
  '<path d="M0.75 0 L0.75 14.25 L6.5 8.5 L12.25 14.25 L12.25 0"/></svg>';

function groupBookmarkNodes() {
  const tail = el("span", { class: "gtail" });
  tail.innerHTML = GROUP_TAIL_SVG;
  return [el("span", { class: "gribbon" }), tail];
}

function renderGroup(unit, unitIndex, unitCount, p) {
  const g = unit.group;
  const a = activeArrangement(g);
  const onCount = unit.blocks.filter((b) => b.enabled).length;

  const labelInput = el("input", { class: "ghost-field grouplabel", value: g.label, spellcheck: "false", "aria-label": "Group label" });
  labelInput.addEventListener("input", () => { g.label = labelInput.value; touch(); renderRail(); });

  const head = el("div", { class: "ghead" }, [
    el("span", { class: "gtag", text: "Group" }),
    el("button", {
      class: "switch teal", "aria-pressed": String(g.enabled),
      title: g.enabled ? "The whole group is included — click to mute all of it" : "The whole group is muted — click to include it",
      onclick: () => toggleGroup(g.id),
    }),
    labelInput,
    el("span", { class: "groupmeta", text: onCount + "/" + unit.blocks.length + " on · " + g.variants.length + " arr" }),
    el("button", {
      class: "btn ghost tiny", text: g.collapsed ? "▸" : "▾", title: g.collapsed ? "Expand" : "Collapse",
      onclick: () => { g.collapsed = !g.collapsed; touch(); renderStack(); },
    }),
    el("button", { class: "btn ghost tiny", text: "↑", title: "Move the whole group up", disabled: unitIndex === 0, onclick: () => moveUnit(unitIndex, -1) }),
    el("button", { class: "btn ghost tiny", text: "↓", title: "Move the whole group down", disabled: unitIndex === unitCount - 1, onclick: () => moveUnit(unitIndex, 1) }),
    el("button", { class: "btn ghost tiny", text: "✕", title: "Disband — the blocks stay, the wiring goes", onclick: () => disbandGroup(g.id) }),
  ]);

  /* Arrangement chips: the group's own variants. */
  const arrs = el("div", { class: "arrs" }, [el("span", { class: "label-cap", text: "Arrangements" })]);
  g.variants.forEach((av, i) => {
    const isOn = av.id === g.activeVariantId;
    const chip = el("button", {
      class: "chip arr" + (isOn ? " on" : ""),
      title: isOn ? "Active arrangement — click the name to rename it"
                  : "Switch this group to “" + av.name + "”",
      onclick: () => { if (!isOn) pickArrangement(g.id, av.id); },
    });
    chip.appendChild(el("span", { class: "k", text: i < 9 ? String(i + 1) : "·" }));
    if (isOn) {
      const nameInput = el("input", { class: "chipname", value: av.name, size: Math.max(2, av.name.length), spellcheck: "false", "aria-label": "Arrangement name" });
      nameInput.addEventListener("input", () => {
        av.name = nameInput.value; nameInput.size = Math.max(2, nameInput.value.length);
        av.updatedAt = now(); touch();
      });
      nameInput.addEventListener("click", (e) => e.stopPropagation());
      chip.appendChild(nameInput);
    } else {
      const missing = unit.blocks.filter((b) => !Object.prototype.hasOwnProperty.call(av.picks, b.id)).length;
      const onHere = unit.blocks.filter((b) => Object.prototype.hasOwnProperty.call(av.picks, b.id) && !av.off.includes(b.id)).length;
      chip.appendChild(el("span", { class: "t", text: av.name || "—" }));
      chip.title += " · " + onHere + " of " + unit.blocks.length + " on" +
        (missing ? " · " + missing + " added since (off here)" : "");
    }
    arrs.appendChild(chip);
  });
  arrs.appendChild(el("button", {
    class: "chip add arr", text: "+",
    title: "New arrangement, starting from how the group looks right now",
    onclick: () => addArrangement(g.id),
  }));
  if (g.variants.length > 1) {
    arrs.appendChild(el("button", {
      class: "chip add arr", text: "✕",
      title: "Delete the active arrangement",
      onclick: () => deleteArrangement(g.id, g.activeVariantId),
    }));
  }

  const body = el("div", { class: "gbody" });
  unit.blocks.forEach((b, i) => body.appendChild(renderBlock(b, p, { inGroup: g, memberIndex: i, memberCount: unit.blocks.length })));

  const foot = el("div", { class: "gfoot" }, [
    el("span", { text: "“" + (a ? a.name : "—") + "” · " + onCount + " of " + unit.blocks.length + " blocks on" }),
    el("span", { class: "grow" }),
    el("button", { class: "btn ghost tiny", text: "+ Block in group", title: "Add a new block to this group", onclick: () => addBlock(g.id) }),
  ]);

  const wrap = el("section", {
    class: "group" + (g.enabled ? "" : " off") + (g.collapsed ? " collapsed" : ""),
    "data-group": g.id,
  }, [head, arrs, body, foot].concat(groupBookmarkNodes()));
  /* On the head, not the container — the members light their own slices. */
  head.addEventListener("mouseenter", () => litGroupSegment(g.id, true));
  head.addEventListener("mouseleave", () => litGroupSegment(g.id, false));
  return wrap;
}

function renderBlock(b, p, opts) {
  opts = opts || {};
  const idx = p.blocks.indexOf(b);
  const focused = ui.focusBlockId === b.id;
  const av = activeVariant(b);
  const grp = opts.inGroup || null;

  /* Head */
  const labelInput = el("input", { class: "ghost-field blocklabel", value: b.label, spellcheck: "false", "aria-label": "Block label" });
  labelInput.addEventListener("input", () => { b.label = labelInput.value; touch(); if (p.includeLabels) renderOutput(); });

  /* ↑↓ move within the group when the block is in one, and move the whole
     unit when it is loose — so a loose block hops over a group rather than
     tunnelling into the middle of it. */
  const upDisabled  = grp ? opts.memberIndex === 0 : opts.unitIndex === 0;
  const dnDisabled  = grp ? opts.memberIndex === opts.memberCount - 1 : opts.unitIndex === opts.unitCount - 1;
  const move = (dir) => (grp ? moveBlockWithinGroup(b.id, dir) : moveUnit(opts.unitIndex, dir));

  const head = el("div", { class: "head" }, [
    el("span", { class: "blocknum", text: String(idx + 1) }),
    el("button", {
      class: "switch", "aria-pressed": String(b.enabled),
      title: grp && !grp.enabled
        ? (b.enabled ? "On in this arrangement, but the group is muted" : "Off in this arrangement")
        : (b.enabled ? "Included — click to mute" : "Muted — click to include"),
      onclick: () => { b.enabled = !b.enabled; touch(); renderStack(); renderOutput(); renderRail(); },
    }),
    labelInput,
    el("span", { class: "blockmeta", text: b.variants.length + " var · " + countWords(av.text) + "w" }),
    el("button", { class: "btn ghost tiny", text: "↑", title: grp ? "Move up inside the group" : "Move up", disabled: upDisabled, onclick: () => move(-1) }),
    el("button", { class: "btn ghost tiny", text: "↓", title: grp ? "Move down inside the group" : "Move down", disabled: dnDisabled, onclick: () => move(1) }),
    el("button", { class: "btn ghost tiny", text: "⧉", title: "Duplicate block", onclick: () => duplicateBlock(b.id) }),
    el("button", { class: "btn ghost tiny", text: "✕", title: "Delete block", onclick: () => deleteBlock(b.id) }),
  ]);

  /* Chips — every variant, always visible. The active one is renameable in place. */
  const chips = el("div", { class: "chips" });
  b.variants.forEach((v, i) => {
    const isOn = v.id === b.activeVariantId;
    const isCmp = b.compareId === v.id;
    const chip = el("button", {
      class: "chip" + (isOn ? " on" : "") + (isCmp ? " cmp" : ""),
      title: isOn ? "Active — click the name to rename. Shift-click another chip to compare."
                  : "Click to use · Shift-click to compare with the active variant",
      onclick: (e) => {
        if (e.shiftKey && !isOn) { b.compareId = isCmp ? null : v.id; touch(); renderStack(); return; }
        if (!isOn) pickVariant(b.id, v.id);
      },
    });
    chip.appendChild(el("span", { class: "k", text: i < 9 ? String(i + 1) : "·" }));
    if (isOn) {
      const nameInput = el("input", { class: "chipname", value: v.name, size: Math.max(2, v.name.length), spellcheck: "false", "aria-label": "Variant name" });
      nameInput.addEventListener("input", () => {
        v.name = nameInput.value; nameInput.size = Math.max(2, nameInput.value.length);
        v.updatedAt = now(); touch();
      });
      nameInput.addEventListener("click", (e) => e.stopPropagation());
      chip.appendChild(nameInput);
    } else {
      chip.appendChild(el("span", { class: "t", text: v.name || "—" }));
    }
    chips.appendChild(chip);
  });
  chips.appendChild(el("button", { class: "chip add", text: "+", title: "New empty variant", onclick: () => addVariant(b.id, false) }));
  chips.appendChild(el("button", { class: "chip add", text: "⧉", title: "Fork the active variant", onclick: () => addVariant(b.id, true) }));

  /* Editor — typing must never re-render this card, or the caret jumps. */
  const ta = el("textarea", {
    class: "editor", spellcheck: "true",
    placeholder: "Write this part of the prompt…",
    "data-block": b.id,
  });
  ta.value = av.text;
  ta.addEventListener("input", () => {
    av.text = ta.value; av.updatedAt = now(); touch();
    autoGrow(ta);
    head.querySelector(".blockmeta").textContent = b.variants.length + " var · " + countWords(av.text) + "w";
    renderOutput();
    if (b.compareId) refreshDiff(card, b);
  });
  ta.addEventListener("focus", () => setFocusBlock(b.id, false));

  /* Foot: compare picker + counts */
  const cmpSelect = el("select", { title: "Compare the active variant against another" });
  cmpSelect.appendChild(el("option", { value: "", text: "Compare with…" }));
  b.variants.filter((v) => v.id !== b.activeVariantId).forEach((v) => {
    cmpSelect.appendChild(el("option", { value: v.id, text: v.name, selected: b.compareId === v.id }));
  });
  cmpSelect.value = b.compareId || "";
  cmpSelect.addEventListener("change", () => { b.compareId = cmpSelect.value || null; touch(); renderStack(); });

  /* Which group this block is wired into. Choosing one moves the block next
     to its group-mates, because a group is drawn as one container. */
  const grpSelect = el("select", { title: "Wire this block into a group" });
  grpSelect.appendChild(el("option", { value: "", text: "No group" }));
  p.groups.forEach((g2) => grpSelect.appendChild(el("option", { value: g2.id, text: "Group: " + (g2.label || "—") })));
  grpSelect.appendChild(el("option", { value: "__new", text: "New group…" }));
  grpSelect.value = b.groupId || "";
  grpSelect.addEventListener("change", () => {
    const v = grpSelect.value;
    if (v === "__new") { grpSelect.value = b.groupId || ""; newGroupFrom(b.id); return; }
    setBlockGroup(b.id, v || null);
  });

  const foot = el("div", { class: "foot" }, [
    cmpSelect,
    grpSelect,
    el("span", { class: "grow" }),
    el("span", { text: av.text.length + " ch · " + countWords(av.text) + " words" }),
    el("button", { class: "btn ghost tiny", text: "Copy part", onclick: () => copyText(av.text, "Copied “" + b.label + "”") }),
    el("button", {
      class: "btn ghost tiny", text: "Delete variant", disabled: b.variants.length < 2,
      onclick: () => deleteVariant(b.id, b.activeVariantId),
    }),
  ]);

  const card = el("section", {
    class: "block" + (focused ? " focused" : "") + (b.enabled ? "" : " off") +
           (b.enabled && grp && !grp.enabled ? " mutedbygroup" : ""),
    "data-block": b.id,
  }, [head, chips, ta, foot]);

  card.addEventListener("mouseenter", () => litSegment(b.id, true));
  card.addEventListener("mouseleave", () => litSegment(b.id, false));
  card.addEventListener("mousedown", () => setFocusBlock(b.id, false));

  if (b.compareId) refreshDiff(card, b);
  /* No autoGrow here: the card is still detached, so it cannot be measured.
     renderStack grows the whole stack at once once everything is in the DOM. */
  return card;
}

function refreshDiff(card, b) {
  let box = card.querySelector(".diffbox");
  const other = b.variants.find((v) => v.id === b.compareId);
  if (!other) { if (box) box.remove(); return; }
  if (!box) {
    box = el("div", { class: "diffbox" });
    card.insertBefore(box, card.querySelector(".foot"));
  }
  const av = activeVariant(b);
  box.innerHTML =
    '<span class="legend">' + esc(other.name) + " → " + esc(av.name) +
    "  ·  <del>removed</del> <ins>added</ins></span>" +
    renderDiffHtml(other.text, av.text);
}

function autoGrow(ta) {
  ta.style.height = "auto";
  ta.style.height = Math.max(70, ta.scrollHeight) + "px";
}

/* Grow every editor at once, synchronously.

   This has to happen before renderStack restores the scroll position. A freshly
   built editor has no height yet, so the whole stack sits at its 70px-per-block
   minimum; write scrollTop against that and the browser clamps it to the short
   content, and the position is gone for good — the view jumps upward. Growing
   them a tick later (which is what used to happen) is far too late.

   Batched into one read pass and one write pass, so measuring a long stack
   costs a single layout rather than one per block. */
function growEditors(root) {
  const list = $$(".editor", root);
  list.forEach((ta) => { ta.style.height = "auto"; });
  const heights = list.map((ta) => Math.max(70, ta.scrollHeight));
  list.forEach((ta, i) => { ta.style.height = heights[i] + "px"; });
}

function renderMixer(p, units) {
  const wrap = el("div", { class: "mixer" });
  (units || stackUnits(p)).forEach((u) => {
    if (u.kind === "group") {
      wrap.appendChild(renderMixerGroupRow(u));
      u.blocks.forEach((b) => wrap.appendChild(renderMixerRow(b, u.group)));
      return;
    }
    wrap.appendChild(renderMixerRow(u.block, null));
  });
  return wrap;
}

function renderMixerGroupRow(unit) {
  const g = unit.group;
  const a = activeArrangement(g);
  const ai = g.variants.indexOf(a);
  const onCount = unit.blocks.filter((b) => b.enabled).length;
  const row = el("div", { class: "mixgroup" + (g.enabled ? "" : " off"), "data-group": g.id }, [
    el("button", {
      class: "switch teal", "aria-pressed": String(g.enabled), title: "Include or mute the whole group",
      onclick: () => toggleGroup(g.id),
    }),
    el("div", { class: "mlabel" }, [
      el("span", { class: "gtag", text: "Grp" }),
      el("span", { text: g.label, title: g.label }),
    ]),
    el("div", { class: "mixpick" }, [
      el("button", { class: "arw", text: "◀", title: "Previous arrangement", onclick: () => cycleArrangement(g.id, -1) }),
      el("button", {
        class: "now", text: a ? a.name : "—",
        title: "Click to advance · " + (ai + 1) + " of " + g.variants.length,
        onclick: () => cycleArrangement(g.id, 1),
      }),
      el("button", { class: "arw", text: "▶", title: "Next arrangement", onclick: () => cycleArrangement(g.id, 1) }),
    ]),
    el("span", { class: "snip", text: onCount + " of " + unit.blocks.length + " blocks on" }),
    el("span", { class: "ct", text: (ai + 1) + "/" + g.variants.length }),
  ]);
  row.addEventListener("mouseenter", () => litGroupSegment(g.id, true));
  row.addEventListener("mouseleave", () => litGroupSegment(g.id, false));
  return row;
}

function renderMixerRow(b, grp) {
  const av = activeVariant(b);
  const vi = b.variants.indexOf(av);
  const row = el("div", {
    class: "mixrow" + (b.enabled ? "" : " off") + (grp ? " ingroup" : "") +
           (ui.focusBlockId === b.id ? " focused" : ""),
    "data-block": b.id,
  }, [
    el("button", {
      class: "switch", "aria-pressed": String(b.enabled),
      title: grp && !grp.enabled ? "On in this arrangement, but the group is muted" : "Include or mute",
      onclick: () => { b.enabled = !b.enabled; touch(); renderStack(); renderOutput(); renderRail(); },
    }),
    el("span", { class: "mlabel", text: b.label, title: b.label }),
    el("div", { class: "mixpick" }, [
      el("button", { class: "arw", text: "◀", title: "Previous variant", onclick: () => cycleVariant(b.id, -1) }),
      el("button", {
        class: "now", text: av.name, title: "Click to advance · " + (vi + 1) + " of " + b.variants.length,
        onclick: () => cycleVariant(b.id, 1),
      }),
      el("button", { class: "arw", text: "▶", title: "Next variant", onclick: () => cycleVariant(b.id, 1) }),
    ]),
    el("span", { class: "snip", text: av.text.replace(/\s+/g, " ").trim() || "—", title: av.text }),
    el("span", { class: "ct", text: (vi + 1) + "/" + b.variants.length }),
  ]);
  row.addEventListener("mouseenter", () => litSegment(b.id, true));
  row.addEventListener("mouseleave", () => litSegment(b.id, false));
  row.addEventListener("mousedown", () => setFocusBlock(b.id, false));
  return row;
}

/* ============================================================
   7. Rendering — assembled output
   ============================================================ */

function renderOutput() {
  const host = $("#outText");
  const units = promptUnits();
  host.innerHTML = "";
  if (!units.length) {
    host.appendChild(el("div", { class: "placeholder", text: "Nothing to assemble yet. Write into a block, or un-mute one." }));
    $("#outStats").textContent = "";
    return;
  }
  units.forEach((u, i) => {
    /* One node per paragraph, and inside it one node per block, so a group's
       members read as continuous text while each still lights up on its own. */
    const para = el("span", { class: "seg", title: u.label }, []);
    if (u.kind === "group") para.setAttribute("data-group", u.id);
    if (u.heading) para.appendChild(el("span", { class: "segh", text: u.heading + "\n" }));
    u.parts.forEach((part, j) => {
      const piece = el("span", { class: "segpart", "data-block": part.blockId, title: part.label });
      piece.appendChild(document.createTextNode(part.text));
      piece.addEventListener("mouseenter", () => litBlock(part.blockId, true));
      piece.addEventListener("mouseleave", () => litBlock(part.blockId, false));
      para.appendChild(piece);
      if (j < u.parts.length - 1) para.appendChild(document.createTextNode(GROUP_JOIN));
    });
    if (i < units.length - 1) para.appendChild(document.createTextNode("\n\n"));
    host.appendChild(para);
  });
  const text = assemble();
  $("#outStats").innerHTML =
    "<b>" + countWords(text) + "</b> words · <b>" + text.length + "</b> ch · ~<b>" +
    Math.ceil(text.length / 4) + "</b> tok";
}

/* Hovering a block lights its slice of the prompt, and the reverse. A group's
   head lights the whole paragraph its members were folded into. */
function litSegment(blockId, on) {
  const n = $('#outText [data-block="' + blockId + '"]');
  if (n) n.classList.toggle("lit", on);
}
function litGroupSegment(groupId, on) {
  const n = $('#outText .seg[data-group="' + groupId + '"]');
  if (n) n.classList.toggle("lit", on);
}
function litBlock(blockId, on) {
  const n = $('#stackBody [data-block="' + blockId + '"]');
  if (n && n.classList.contains("block")) n.classList.toggle("lit", on);
}

function renderAll() {
  document.body.classList.toggle("rail-closed", !ui.railOpen);
  document.body.classList.toggle("out-closed", !ui.outputOpen);
  document.body.classList.toggle("dusk", !!ui.dusk);
  const p = project();
  if (!p.blocks.some((b) => b.id === ui.focusBlockId)) ui.focusBlockId = p.blocks.length ? p.blocks[0].id : null;
  renderRail();
  renderStack();
  renderOutput();
  save();
}

/* ============================================================
   8. Mutations
   ============================================================ */

function selectProject(id) {
  if (id === state.activeProjectId) return;
  state.activeProjectId = id;
  ui.focusBlockId = null;
  renderAll();
}

function newProject() {
  askText("New project", "Name this prompt", "Untitled prompt", (name) => {
    const p = makeProject(name, [makeBlock("Role", null), makeBlock("Task", null)]);
    state.projects.unshift(p);
    state.activeProjectId = p.id;
    ui.focusBlockId = null;
    renderAll();
    toast("Created “" + name + "”");
  });
}

function duplicateProject(id) {
  const src = state.projects.find((p) => p.id === id);
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid("p");
  copy.name = src.name + " copy";
  copy.createdAt = copy.updatedAt = now();
  /* Fresh ids throughout, and re-point actives/groups/takes at them. */
  const vmap = {}, bmap = {}, gmap = {}, amap = {};
  copy.groups = Array.isArray(copy.groups) ? copy.groups : [];
  copy.groups.forEach((g) => {
    const oldG = g.id; g.id = uid("g"); gmap[oldG] = g.id;
    g.variants.forEach((a) => { const oldA = a.id; a.id = uid("a"); amap[oldA] = a.id; });
    g.activeVariantId = amap[g.activeVariantId] || g.variants[0].id;
  });
  copy.blocks.forEach((b) => {
    const oldB = b.id; b.id = uid("b"); bmap[oldB] = b.id;
    b.variants.forEach((v) => { const oldV = v.id; v.id = uid("v"); vmap[oldV] = v.id; });
    b.activeVariantId = vmap[b.activeVariantId] || b.variants[0].id;
    b.compareId = b.compareId ? (vmap[b.compareId] || null) : null;
    b.groupId = b.groupId ? (gmap[b.groupId] || null) : null;
  });
  copy.groups.forEach((g) => g.variants.forEach((a) => {
    const picks = {};
    for (const k in a.picks) if (bmap[k] && vmap[a.picks[k]]) picks[bmap[k]] = vmap[a.picks[k]];
    a.picks = picks;
    a.off = (a.off || []).map((k) => bmap[k]).filter(Boolean);
  }));
  copy.takes.forEach((t) => {
    t.id = uid("t");
    const blocks = {};
    for (const k in (t.blocks || {})) {
      if (!bmap[k]) continue;
      blocks[bmap[k]] = { v: vmap[t.blocks[k].v] || null, on: !!t.blocks[k].on };
    }
    t.blocks = blocks;
    const groups = {};
    for (const k in (t.groups || {})) {
      if (!gmap[k]) continue;
      groups[gmap[k]] = { v: amap[t.groups[k].v] || null, on: !!t.groups[k].on };
    }
    t.groups = groups;
  });
  state.projects.splice(state.projects.indexOf(src) + 1, 0, copy);
  state.activeProjectId = copy.id;
  renderAll();
  toast("Duplicated");
}

function deleteProject(id) {
  state.projects = state.projects.filter((p) => p.id !== id);
  if (!state.projects.length) state.projects.push(makeProject("Untitled prompt", null));
  if (!state.projects.some((p) => p.id === state.activeProjectId)) state.activeProjectId = state.projects[0].id;
  ui.focusBlockId = null;
  renderAll();
  toast("Deleted");
}

function addBlock(groupId) {
  const p = project();
  const b = makeBlock("New block", null);
  if (groupId && p.groups.some((g) => g.id === groupId)) {
    b.groupId = groupId;
    /* Land it at the end of its group's run rather than the end of the stack. */
    let last = -1;
    p.blocks.forEach((x, i) => { if (x.groupId === groupId) last = i; });
    p.blocks.splice(last + 1, 0, b);
  } else {
    p.blocks.push(b);
  }
  normalizeGroupOrder(p);
  ui.focusBlockId = b.id;
  touch(); renderAll();
  const node = $('#stackBody .block[data-block="' + b.id + '"]');
  if (node) { node.scrollIntoView({ block: "center" }); const inp = node.querySelector(".blocklabel"); if (inp) { inp.focus(); inp.select(); } }
}

function duplicateBlock(id) {
  const p = project();
  const src = blockById(id);
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid("b");
  copy.label = src.label + " copy";
  const vmap = {};
  copy.variants.forEach((v) => { const old = v.id; v.id = uid("v"); vmap[old] = v.id; });
  copy.activeVariantId = vmap[copy.activeVariantId] || copy.variants[0].id;
  copy.compareId = copy.compareId ? (vmap[copy.compareId] || null) : null;
  p.blocks.splice(p.blocks.indexOf(src) + 1, 0, copy);
  ui.focusBlockId = copy.id;
  touch(); renderAll();
}

function deleteBlock(id) {
  const p = project();
  const b = blockById(id);
  if (!b) return;
  const run = () => {
    p.blocks = p.blocks.filter((x) => x.id !== id);
    if (!p.blocks.length) p.blocks.push(makeBlock("Section", null));
    p.takes.forEach((t) => { delete t.blocks[id]; });
    p.groups.forEach((g) => g.variants.forEach((a) => {
      delete a.picks[id];
      a.off = a.off.filter((x) => x !== id);
    }));
    /* A group that has lost its last member is not a group any more. */
    dropEmptyGroups(p);
    ui.focusBlockId = p.blocks[0].id;
    touch(); renderAll();
  };
  const hasContent = b.variants.some((v) => v.text.trim());
  if (hasContent) askConfirm("Delete block", "Delete “" + b.label + "” and its " + b.variants.length + " variants?", "Delete", run);
  else run();
}

/* Reordering happens between units, so a loose block steps over an entire
   group instead of landing inside it. */
function moveUnit(index, dir) {
  const p = project();
  const units = stackUnits(p);
  const j = index + dir;
  if (index < 0 || index >= units.length || j < 0 || j >= units.length) return;
  const [u] = units.splice(index, 1);
  units.splice(j, 0, u);
  p.blocks = units.flatMap((x) => (x.kind === "group" ? x.blocks : [x.block]));
  touch(); renderStack(); renderOutput();
}

function moveBlockWithinGroup(id, dir) {
  const p = project();
  const b = blockById(id);
  if (!b || !b.groupId) return;
  const run = p.blocks.filter((x) => x.groupId === b.groupId);
  const i = run.indexOf(b);
  const j = i + dir;
  if (j < 0 || j >= run.length) return;
  const start = p.blocks.indexOf(run[0]);
  run.splice(i, 1);
  run.splice(j, 0, b);
  p.blocks.splice(start, run.length, ...run);
  ui.focusBlockId = id;
  touch(); renderStack(); renderOutput();
}

/* ---------- Groups ---------- */

function dropEmptyGroups(p) {
  const dead = p.groups.filter((g) => !p.blocks.some((b) => b.groupId === g.id)).map((g) => g.id);
  if (!dead.length) return;
  p.groups = p.groups.filter((g) => !dead.includes(g.id));
  p.takes.forEach((t) => dead.forEach((gid) => { delete t.groups[gid]; }));
}

function newGroupFrom(blockId) {
  const p = project();
  const b = blockById(blockId);
  if (!b) return;
  askText("New group", "Name this group", "Group " + (p.groups.length + 1), (label) => {
    const g = makeGroup(label);
    p.groups.push(g);
    setBlockGroup(blockId, g.id, { silent: true });
    toast("“" + label + "” created — set other blocks to it to wire them in");
  });
}

/* Joining a group moves the block next to its group-mates: a group is one
   container on screen, so its members have to be a contiguous run. */
function setBlockGroup(blockId, groupId, opts) {
  const p = project();
  const b = blockById(blockId);
  if (!b || b.groupId === groupId) return;
  const from = b.groupId;

  if (from) {
    p.groups.forEach((g) => {
      if (g.id !== from) return;
      g.variants.forEach((a) => { delete a.picks[blockId]; a.off = a.off.filter((x) => x !== blockId); });
    });
  }
  b.groupId = groupId || null;

  if (groupId) {
    /* Sit at the end of the target group's run — but a group that has no
       members yet (one just made for this block) has no run to join, and the
       block should stay exactly where it is rather than jump to the top. */
    const at = p.blocks.indexOf(b);
    const others = p.blocks.filter((x) => x.id !== blockId);
    let last = -1;
    others.forEach((x, i) => { if (x.groupId === groupId) last = i; });
    others.splice(last < 0 ? at : last + 1, 0, b);
    p.blocks = others;
  }
  normalizeGroupOrder(p);
  dropEmptyGroups(p);
  ui.focusBlockId = blockId;
  touch(); renderAll();
  if (!opts || !opts.silent) {
    const g = groupById(groupId);
    toast(g ? "Wired “" + b.label + "” into “" + g.label + "”" : "“" + b.label + "” left its group");
  }
}

function toggleGroup(id) {
  const g = groupById(id);
  if (!g) return;
  g.enabled = !g.enabled;
  touch(); renderStack(); renderOutput(); renderRail();
}

/* Disbanding keeps every block and whatever it is currently showing; only the
   wiring goes. The arrangements go with it — they described this group. */
function disbandGroup(id) {
  const p = project();
  const g = groupById(id);
  if (!g) return;
  const run = () => {
    p.blocks.forEach((b) => { if (b.groupId === id) b.groupId = null; });
    p.groups = p.groups.filter((x) => x.id !== id);
    p.takes.forEach((t) => { delete t.groups[id]; });
    touch(); renderAll();
    toast("Disbanded “" + g.label + "”");
  };
  if (g.variants.length > 1) {
    askConfirm("Disband group", "Disband “" + g.label + "”? Its " + g.variants.length +
      " arrangements are lost; the blocks stay exactly as they are now.", "Disband", run);
  } else run();
}

/* ---------- Arrangements (a group's own variants) ---------- */

function pickArrangement(groupId, arrangementId) {
  const g = groupById(groupId);
  if (!g || g.activeVariantId === arrangementId) return;
  /* touch() syncs the *active* arrangement from the members, so the switch has
     to happen first — otherwise the outgoing one is overwritten. */
  g.activeVariantId = arrangementId;
  applyArrangement(g);
  touch(); renderStack(); renderOutput(); renderRail();
}

function cycleArrangement(groupId, dir) {
  const g = groupById(groupId);
  if (!g || g.variants.length < 2) return;
  const i = g.variants.findIndex((a) => a.id === g.activeVariantId);
  const next = (i + dir + g.variants.length) % g.variants.length;
  pickArrangement(groupId, g.variants[next].id);
}

/* A new arrangement starts as a copy of how the group looks right now — the
   useful default, since you make one in order to vary from here. */
function addArrangement(groupId) {
  const g = groupById(groupId);
  if (!g) return;
  const src = activeArrangement(g);
  const a = makeArrangement(nextArrangementName(g, src ? src.name : "a"));
  a.picks = Object.assign({}, src ? src.picks : {});
  a.off = (src ? src.off : []).slice();
  g.variants.splice(g.variants.indexOf(src) + 1, 0, a);
  g.activeVariantId = a.id;
  touch(); renderStack(); renderOutput(); renderRail();
  const node = $('#stackBody .group[data-group="' + g.id + '"] .chip.arr.on .chipname');
  if (node) { node.focus(); node.select(); }
}

function nextArrangementName(g, name) {
  const base = String(name || "a").replace(/\s+\d+$/, "");
  let n = 2;
  const taken = new Set(g.variants.map((a) => a.name));
  while (taken.has(base + " " + n)) n++;
  return base + " " + n;
}

function deleteArrangement(groupId, arrangementId) {
  const g = groupById(groupId);
  if (!g || g.variants.length < 2) return;
  const a = g.variants.find((x) => x.id === arrangementId);
  if (!a) return;
  const run = () => {
    const i = g.variants.indexOf(a);
    g.variants.splice(i, 1);
    project().takes.forEach((t) => {
      const rec = t.groups[groupId];
      if (rec && rec.v === arrangementId) rec.v = null;
    });
    if (g.activeVariantId === arrangementId) {
      g.activeVariantId = g.variants[Math.max(0, i - 1)].id;
      applyArrangement(g);
    }
    touch(); renderStack(); renderOutput(); renderRail();
  };
  askConfirm("Delete arrangement", "Delete “" + a.name + "”? The blocks stay; only this pairing of them goes.", "Delete", run);
}

function addVariant(blockId, fork) {
  const b = blockById(blockId);
  if (!b) return;
  const src = activeVariant(b);
  const base = fork ? src.text : "";
  const name = fork ? nextForkName(b, src.name) : "v" + (b.variants.length + 1);
  const v = makeVariant(name, base);
  b.variants.splice(b.variants.indexOf(src) + 1, 0, v);
  b.activeVariantId = v.id;
  ui.focusBlockId = b.id;
  touch(); renderStack(); renderOutput(); renderRail();
  const ta = $('#stackBody .block[data-block="' + b.id + '"] .editor');
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

/* "tight" forks to "tight 2", then "tight 3"… */
function nextForkName(b, name) {
  const base = name.replace(/\s+\d+$/, "");
  let n = 2;
  const taken = new Set(b.variants.map((v) => v.name));
  while (taken.has(base + " " + n)) n++;
  return base + " " + n;
}

function deleteVariant(blockId, variantId) {
  const b = blockById(blockId);
  if (!b || b.variants.length < 2) return;
  const v = b.variants.find((x) => x.id === variantId);
  const run = () => {
    const i = b.variants.indexOf(v);
    b.variants.splice(i, 1);
    if (b.activeVariantId === variantId) b.activeVariantId = b.variants[Math.max(0, i - 1)].id;
    if (b.compareId === variantId) b.compareId = null;
    const p = project();
    p.takes.forEach((t) => {
      const rec = t.blocks[blockId];
      if (rec && rec.v === variantId) rec.v = b.activeVariantId;
    });
    /* Arrangements that pointed at the deleted variant fall back to whatever
       the block shows now, rather than silently dropping the member. */
    p.groups.forEach((g) => g.variants.forEach((a) => {
      if (a.picks[blockId] === variantId) a.picks[blockId] = b.activeVariantId;
    }));
    touch(); renderStack(); renderOutput(); renderRail();
  };
  if (v.text.trim()) askConfirm("Delete variant", "Delete “" + v.name + "”? Other variants of this block stay.", "Delete", run);
  else run();
}

function pickVariant(blockId, variantId) {
  const b = blockById(blockId);
  if (!b || b.activeVariantId === variantId) return;
  b.activeVariantId = variantId;
  if (b.compareId === variantId) b.compareId = null;
  ui.focusBlockId = blockId;
  touch(); renderStack(); renderOutput(); renderRail();
}

function cycleVariant(blockId, dir) {
  const b = blockById(blockId);
  if (!b || b.variants.length < 2) return;
  const i = b.variants.findIndex((v) => v.id === b.activeVariantId);
  const next = (i + dir + b.variants.length) % b.variants.length;
  pickVariant(blockId, b.variants[next].id);
}

function pickVariantByIndex(blockId, index) {
  const b = blockById(blockId);
  if (!b || !b.variants[index]) return;
  pickVariant(blockId, b.variants[index].id);
}

/* Shuffle rolls the groups first and lets their arrangements land, then rolls
   whatever is still loose — otherwise the arrangement would immediately
   overwrite the members it had just randomised. */
function shuffleMix() {
  const p = project();
  p.groups.forEach((g) => {
    g.activeVariantId = g.variants[Math.floor(Math.random() * g.variants.length)].id;
    applyArrangement(g);
  });
  p.blocks.forEach((b) => {
    if (b.groupId) return;
    b.activeVariantId = b.variants[Math.floor(Math.random() * b.variants.length)].id;
  });
  touch(); renderStack(); renderOutput(); renderRail();
  toast("Shuffled");
}

function setView(v) { ui.view = v; save(); renderStack(); }

function setFocusBlock(id, scroll) {
  if (ui.focusBlockId === id) return;
  const prev = ui.focusBlockId;
  ui.focusBlockId = id;
  save();
  /* Cheap: just move the marker classes rather than rebuilding the stack. */
  $$('#stackBody [data-block]').forEach((n) => {
    if (!n.classList.contains("block") && !n.classList.contains("mixrow")) return;
    n.classList.toggle("focused", n.getAttribute("data-block") === id);
  });
  if (scroll) {
    const n = $('#stackBody [data-block="' + id + '"]');
    if (n) n.scrollIntoView({ block: "nearest" });
  }
  void prev;
}

/* ---------- Takes ----------
   A take records the whole rig, not just the picks: every block's variant
   *and* whether it was on, every group's arrangement *and* whether it was on.

   The rule for anything a take never saw — a block or group added after it
   was saved — is that it is off. A snapshot can only vouch for what existed
   when it was taken, and silently switching on a block written weeks later
   would put text into the prompt that the take never approved.

   One deliberate exception, at the group level. Grouping two blocks that an
   older take had on would otherwise hide them both, because the group the
   take never saw would come back off. So an unknown *group* takes its state
   from its members: on if the take had any of them on. Nothing the take
   actually said is contradicted, and nothing appears that it had off. */

function resolveTake(t, p) {
  const blocks = {}, groups = {};
  p.blocks.forEach((b) => {
    const r = t.blocks ? t.blocks[b.id] : null;
    blocks[b.id] = {
      known: !!r,
      on: !!(r && r.on),
      v: (r && r.v && b.variants.some((v) => v.id === r.v)) ? r.v : b.activeVariantId,
    };
  });
  p.groups.forEach((g) => {
    const r = t.groups ? t.groups[g.id] : null;
    groups[g.id] = {
      known: !!r,
      on: r ? !!r.on : p.blocks.some((b) => b.groupId === g.id && blocks[b.id] && blocks[b.id].on),
      v: (r && r.v && g.variants.some((a) => a.id === r.v)) ? r.v : g.activeVariantId,
    };
  });
  return { blocks, groups };
}

/* Two states are the same take only if every switch and every pick agrees —
   including the groups, so muting a group alone breaks the match. */
function signatureFrom(p, res) {
  return p.blocks.map((b) => b.id + ":" + (res.blocks[b.id].on ? res.blocks[b.id].v : "off")).join("|") +
    " || " + p.groups.map((g) => g.id + ":" + (res.groups[g.id].on ? res.groups[g.id].v : "off")).join("|");
}

function currentSignature() {
  const p = project();
  const res = { blocks: {}, groups: {} };
  p.blocks.forEach((b) => { res.blocks[b.id] = { on: b.enabled, v: b.activeVariantId }; });
  p.groups.forEach((g) => { res.groups[g.id] = { on: g.enabled, v: g.activeVariantId }; });
  return signatureFrom(p, res);
}

function takeSignature(t) {
  const p = project();
  return signatureFrom(p, resolveTake(t, p));
}

function captureTakeState(p) {
  const blocks = {}, groups = {};
  p.blocks.forEach((b) => { blocks[b.id] = { v: b.activeVariantId, on: !!b.enabled }; });
  p.groups.forEach((g) => { groups[g.id] = { v: g.activeVariantId, on: !!g.enabled }; });
  return { blocks, groups };
}

function saveTake() {
  const p = project();
  const suggested = "Take " + (p.takes.length + 1);
  askText("Save take", "Name this combination", suggested, (name) => {
    const snap = captureTakeState(p);
    p.takes.unshift({ id: uid("t"), name, createdAt: now(), blocks: snap.blocks, groups: snap.groups });
    touch(); renderRail();
    toast("Saved “" + name + "”");
  });
}

function updateTake(id) {
  const p = project();
  const t = p.takes.find((x) => x.id === id);
  if (!t) return;
  const snap = captureTakeState(p);
  t.blocks = snap.blocks;
  t.groups = snap.groups;
  touch(); renderRail();
  toast("Updated “" + t.name + "”");
}

function applyTake(id) {
  const p = project();
  const t = p.takes.find((x) => x.id === id);
  if (!t) return;
  const res = resolveTake(t, p);
  p.groups.forEach((g) => {
    const r = res.groups[g.id];
    g.enabled = r.on;
    g.activeVariantId = r.v;
  });
  /* Blocks are restored *after* the groups, and literally: the take's own
     record wins over what the arrangement would have replayed. The two agree
     whenever the take was saved from a settled state, and where an
     arrangement has been redefined since, what the user asked for back is the
     take. touch() then writes that restored state into the active
     arrangements, so a group never sits half-way between two definitions. */
  p.blocks.forEach((b) => {
    const r = res.blocks[b.id];
    b.enabled = r.on;
    if (r.v && b.variants.some((v) => v.id === r.v)) b.activeVariantId = r.v;
  });
  touch(); renderStack(); renderOutput(); renderRail();

  const unseen = p.blocks.filter((b) => !res.blocks[b.id].known).length;
  toast("“" + t.name + "”" + (unseen ? " · " + unseen + " newer block" + (unseen > 1 ? "s" : "") + " left off" : ""));
}

/* ---------- Clipboard, import, export ---------- */

async function copyText(text, msg) {
  if (!text.trim()) { toast("Nothing to copy"); return; }
  try {
    await navigator.clipboard.writeText(text);
    toast(msg || "Copied");
  } catch (e) {
    /* Clipboard API needs a secure context; fall back to a scratch textarea. */
    const ta = el("textarea", { style: "position:fixed;opacity:0;left:-9999px" });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
    toast(ok ? (msg || "Copied") : "Copy blocked by the browser");
  }
}

/* Export takes a copy out; it never changes where the live document is kept.
   The two hosts need different mechanics for the same act: an anchor with a
   blob URL is how a browser saves a file, but a WKWebView has no download UI to
   drive, so in the app the bytes go through the same native
   `write_download_file` the gallery already uses for its own exports (it
   sanitizes the name and avoids collisions, Finder-style). */
function exportFileName() {
  return "variations-" + new Date().toISOString().slice(0, 10) + ".json";
}

function exportJson() {
  const json = JSON.stringify(state, null, 2);
  const name = exportFileName();

  if (isApp()) {
    HOST.invoke("write_download_file", {
      fileName: name,
      bytes: Array.from(new TextEncoder().encode(json)),
    })
      .then((path) => toast("Exported to " + String(path || name)))
      .catch((e) => toast("Export failed: " + e));
    return;
  }

  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Exported");
}

function importJson(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(String(reader.result)); }
    catch (e) { toast("That file is not valid JSON"); return; }
    const incoming = parsed && Array.isArray(parsed.projects) ? parsed.projects
                   : (parsed && parsed.blocks ? [parsed] : null);
    if (!incoming || !incoming.length) { toast("No projects found in that file"); return; }
    /* Import adds; it never replaces what is already here. */
    const merged = normalize({ projects: incoming, activeProjectId: null });
    merged.projects.forEach((p) => { p.id = uid("p"); state.projects.unshift(p); });
    state.activeProjectId = state.projects[0].id;
    ui.focusBlockId = null;
    renderAll();
    /* renderAll only schedules the debounced write. An import is a large,
       deliberate change, so put it on disk now — in the app that means the
       library's metadata folder, the same place every other edit lands. */
    flushSave();
    toast("Imported " + merged.projects.length + " project" + (merged.projects.length > 1 ? "s" : ""));
  };
  reader.readAsText(file);
}

/* ============================================================
   9. Keyboard
   ============================================================ */

function isTyping(e) {
  const t = e.target;
  return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
}

function focusedBlock() {
  const p = project();
  return p.blocks.find((b) => b.id === ui.focusBlockId) || p.blocks[0] || null;
}

function moveFocus(dir) {
  const p = project();
  if (!p.blocks.length) return;
  const i = p.blocks.findIndex((b) => b.id === ui.focusBlockId);
  const next = Math.max(0, Math.min(p.blocks.length - 1, (i < 0 ? 0 : i + dir)));
  setFocusBlock(p.blocks[next].id, true);
}

/* The app's binding for this window, forwarded by Rust.
   Matched exactly the way embedded-inject.js matches Grok's and Claude's, off
   e.code rather than the produced character, so a binding set on one keyboard
   layout still matches on another. This webview has focus whenever it is up, so
   the main window never sees the key — the page has to close itself. */
function parseCloseKey(spec) {
  if (!spec || typeof spec !== "string") return null;
  const out = { cmd: false, ctrl: false, alt: false, shift: false, base: "" };
  for (const part of spec.split("+").filter(Boolean)) {
    const lower = part.toLowerCase();
    if (lower === "cmd" || lower === "meta") out.cmd = true;
    else if (lower === "ctrl" || lower === "control") out.ctrl = true;
    else if (lower === "alt" || lower === "option") out.alt = true;
    else if (lower === "shift") out.shift = true;
    else out.base = lower;
  }
  return out.base ? out : null;
}

function baseKeyForEvent(e) {
  const code = e.code || "";
  if (/^Key[A-Z]$/.test(code)) return code.slice(3).toLowerCase();
  if (/^Digit[0-9]$/.test(code)) return code.slice(5);
  if (code === "Space") return "Space";
  if (code === "Escape") return "Escape";
  const key = e.key || "";
  return key.length === 1 ? key.toLowerCase() : key;
}

function matchesCloseKey(e) {
  const spec = parseCloseKey(window.__lgVariationsCloseKey);
  if (!spec) return false;
  if (!!e.metaKey !== spec.cmd) return false;
  if (!!e.ctrlKey !== spec.ctrl) return false;
  if (!!e.altKey !== spec.alt) return false;
  if (!!e.shiftKey !== spec.shift) return false;
  return baseKeyForEvent(e).toLowerCase() === spec.base;
}

/* Closing only means anything in the app; in a browser tab this is a no-op. */
function closeWindow() {
  if (!isApp()) return false;
  flushSave();
  HOST.invoke("close_variations_window").catch(() => { /* already gone */ });
  return true;
}

document.addEventListener("keydown", (e) => {
  const meta = e.metaKey || e.ctrlKey;

  // Before anything else, so the toggle always gets you back out.
  if (isApp() && matchesCloseKey(e)) {
    e.preventDefault(); e.stopPropagation();
    closeWindow();
    return;
  }

  if (e.key === "Escape") {
    if ($("#scrim").classList.contains("show")) { closeDialog(); e.preventDefault(); return; }
    if (isTyping(e)) { e.target.blur(); e.preventDefault(); return; }
    // Nothing left to back out of, so Esc leaves the window — same as Grok
    // and Claude.
    if (isApp()) { e.preventDefault(); closeWindow(); }
    return;
  }

  /* Copy the whole assembled prompt from anywhere. */
  if (meta && e.shiftKey && (e.key === "c" || e.key === "C")) {
    e.preventDefault(); copyText(assemble(), "Prompt copied"); return;
  }
  if (meta && (e.key === "e" || e.key === "E")) { e.preventDefault(); exportJson(); return; }

  if (isTyping(e) || $("#scrim").classList.contains("show")) return;

  const b = focusedBlock();

  switch (e.key) {
    case "j": case "ArrowDown": e.preventDefault(); moveFocus(1); return;
    case "k": case "ArrowUp":   e.preventDefault(); moveFocus(-1); return;
    case "h": case "ArrowLeft": if (b) { e.preventDefault(); cycleVariant(b.id, -1); } return;
    case "l": case "ArrowRight":if (b) { e.preventDefault(); cycleVariant(b.id, 1); } return;
    case " ": if (b) { e.preventDefault(); b.enabled = !b.enabled; touch(); renderStack(); renderOutput(); renderRail(); } return;
    case "m": e.preventDefault(); setView(ui.view === "mixer" ? "edit" : "mixer"); return;
    case "g": if (b) { e.preventDefault(); blockGroupMenu(b); } return;
    case "G": if (b) { e.preventDefault(); const g = groupOf(b); if (g) toggleGroup(g.id); else toast("“" + b.label + "” is not in a group"); } return;
    case "[": case "]": {
      if (!b) return;
      e.preventDefault();
      const g = groupOf(b);
      if (!g) { toast("“" + b.label + "” is not in a group"); return; }
      cycleArrangement(g.id, e.key === "[" ? -1 : 1);
      return;
    }
    case "n": if (b) { e.preventDefault(); addVariant(b.id, false); } return;
    case "f": if (b) { e.preventDefault(); addVariant(b.id, true); } return;
    case "s": e.preventDefault(); saveTake(); return;
    case "?": e.preventDefault(); showHelp(); return;
    case "e": {
      if (!b) return;
      e.preventDefault();
      if (ui.view !== "edit") { setView("edit"); }
      const ta = $('#stackBody .block[data-block="' + b.id + '"] .editor');
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      return;
    }
  }

  if (/^[1-9]$/.test(e.key) && b) { e.preventDefault(); pickVariantByIndex(b.id, Number(e.key) - 1); }
});

/* ============================================================
   11. Wiring
   ============================================================ */

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-cmd]");
  if (!btn) return;
  const cmd = btn.getAttribute("data-cmd");
  if (cmd === "new-project") newProject();
  else if (cmd === "toggle-rail") { ui.railOpen = !ui.railOpen; save(); renderAll(); }
  else if (cmd === "toggle-output") { ui.outputOpen = !ui.outputOpen; save(); renderAll(); }
  else if (cmd === "import") $("#fileInput").click();
  else if (cmd === "export") exportJson();
  else if (cmd === "dusk") { ui.dusk = !ui.dusk; save(); document.body.classList.toggle("dusk", ui.dusk); }
  else if (cmd === "help") showHelp();
  else if (cmd === "copy") copyText(assemble(), "Prompt copied");
  else if (cmd === "save-take") saveTake();
  else if (cmd === "close-window") closeWindow();
});

$("#scrim").addEventListener("mousedown", (e) => { if (e.target.id === "scrim") closeDialog(); });

$("#fileInput").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) importJson(f);
  e.target.value = "";
});

function tickClock() {
  const d = new Date();
  let h = d.getHours(); const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  $("#clock").textContent = h + ":" + String(d.getMinutes()).padStart(2, "0") + " " + ampm;
}

window.addEventListener("resize", () => {
  growEditors($("#stackBody"));
});

/* Import and Export stay available in both worlds. They move documents in and
   out; they are not what decides where this one lives. In the app that is
   always the library's metadata folder — an import merges into the document and
   is saved straight back there, and an export is a copy taken out of it, so
   neither can quietly relocate the working data.

   The app gets one extra item, a Close: the toggle key and Esc both work, but a
   visible way out is worth a slot in the menu bar. */
function applyHostChrome() {
  if (isApp() && !$('#menubar [data-cmd="close-window"]')) {
    const close = el("button", { class: "menuitem", "data-cmd": "close-window", text: "Close" });
    $("#menubar .spacer").before(close);
  }
  if (HOST.note) $("#clock").before(el("span", { class: "clock", text: HOST.note, title: HOST.note }));
}

async function boot() {
  await load();
  applyHostChrome();
  renderAll();
  tickClock();
  setInterval(tickClock, 20000);
}

boot().catch((e) => {
  console.error("Variations failed to start:", e);
  /* Never leave a blank window: fall back to a fresh document. */
  if (!state) { state = seedState(); renderAll(); }
});

/* A hand-off for the console, and for anything that wants to poke at it. */
window.Variations = {
  get state() { return state; },
  get host() { return HOST; },
  assemble, save, renderAll,
};
</script>
</body>
</html>
